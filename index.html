<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Детская читалка</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#fdf6e3;--card:#fff;--ink:#3a2e2a;--soft:#8a7a6e;
    --a1:#4caf50;--a2:#ff9800;--b1:#3f7bd9;
    --shadow:0 8px 30px rgba(90,60,30,.12)}
  body{background:linear-gradient(160deg,#fff8e8,#fdf0d8);color:var(--ink);
    font:17px/1.6 "Segoe UI",system-ui,Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
  header{text-align:center;padding:14px 0 8px}
  header h1{font-size:30px;letter-spacing:.5px}
  header .sub{color:var(--soft);font-size:15px;margin-top:2px}
  .levels{display:flex;gap:12px;justify-content:center;margin:18px 0 8px;flex-wrap:wrap}
  .level-btn{border:0;border-radius:18px;padding:14px 22px;font-size:19px;font-weight:700;
    cursor:pointer;color:#fff;box-shadow:var(--shadow);transition:transform .15s,filter .15s;min-width:110px}
  .level-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .level-btn.active{outline:4px solid rgba(0,0,0,.18)}
  .l-a1{background:var(--a1)} .l-a2{background:var(--a2)} .l-b1{background:var(--b1)}
  .level-hint{text-align:center;color:var(--soft);font-size:14px;margin-bottom:14px}
  .card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{font-size:18px;margin-bottom:12px}
  .story-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#faf5ea;border:0;border-radius:16px;padding:14px 16px;margin-bottom:10px;
    cursor:pointer;transition:background .15s;font:inherit;color:inherit}
  .story-item:hover{background:#f3ead7}
  .story-emoji{font-size:34px}
  .story-info{flex:1}
  .story-title{font-weight:700;font-size:17px}
  .story-meta{color:var(--soft);font-size:13px;margin-top:2px}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;color:#fff;font-size:12px;
    font-weight:700;vertical-align:middle;margin-left:8px}
  .b-a1{background:var(--a1)} .b-a2{background:var(--a2)} .b-b1{background:var(--b1)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .btn{background:#f0e6d2;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;
    font:inherit;font-weight:600;color:var(--ink)}
  .btn:hover{background:#e5d7bd}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.primary:hover{background:#4a3c36}
  .fs-group{margin-left:auto;display:flex;align-items:center;gap:6px}
  .fs-btn{width:36px;height:36px;border-radius:10px;border:0;background:#f0e6d2;cursor:pointer;
    font-size:18px;font-weight:700}
  .fs-btn:hover{background:#e5d7bd}
  .story-text{font-size:19px;line-height:1.8;white-space:pre-wrap}
  .story-text.big{font-size:23px}
  .story-text.small{font-size:17px}
  .reading-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .reading-head .story-title{font-size:20px}
  .tts-bar{display:flex;gap:8px;align-items:center;margin:0 0 14px}
  .tts-btn{display:inline-flex;align-items:center;gap:6px;background:#e8f0fc;border:0;border-radius:12px;
    padding:9px 16px;cursor:pointer;font:inherit;font-weight:700;color:var(--b1)}
  .tts-btn.playing{background:#e8f5e9;color:var(--a1)}
  .tts-btn:hover{filter:brightness(.97)}
  .tts-note{color:var(--soft);font-size:12px}
  .choice-btn{display:block;width:100%;text-align:left;background:#faf5ea;border:2px solid #eee0c8;
    border-radius:14px;padding:12px 16px;margin-top:10px;cursor:pointer;font:inherit;color:inherit;
    transition:border-color .15s,background .15s}
  .choice-btn:hover{border-color:var(--ink)}
  .choice-btn.correct{background:#e8f5e9;border-color:var(--a1)}
  .choice-btn.wrong{background:#fdecea;border-color:#e57373}
  .choice-btn:disabled{cursor:default;opacity:.75}
  .ending-box{background:#fff8e8;border:2px dashed #e8c87a;border-radius:16px;padding:16px;margin-top:16px;
    text-align:center}
  .ending-box .end-title{font-size:22px;font-weight:800}
  .quiz-q{font-weight:700;margin:18px 0 4px;font-size:18px}
  .quiz-progress{color:var(--soft);font-size:13px}
  .quiz-score{text-align:center;font-size:22px;margin:12px 0}
  .quiz-score .stars{font-size:28px}
  .hint{text-align:center;color:var(--soft);font-size:14px;margin-top:14px}
  footer{text-align:center;color:var(--soft);font-size:13px;margin-top:26px}

  .dict-word{border-bottom:2px dashed #e8a33d;cursor:pointer;position:relative;
    transition:background .15s;border-radius:3px}
  .dict-word:hover{background:#fff3d6}
  .dict-tip{position:fixed;z-index:999;display:none;background:#3a2e2a;color:#fff;
    padding:8px 13px;border-radius:10px;font-size:14px;max-width:270px;
    box-shadow:0 6px 20px rgba(0,0,0,.28);line-height:1.45}
  .dict-tip b{color:#ffd97a}

.dict-card{margin-top:16px}
.dict-list{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.dict-list li{background:var(--card,#fff);border:1px solid var(--line,#e3d9c9);border-radius:10px;padding:8px 12px;font-size:17px}
.tip-add{margin-left:8px;border:none;background:#ffd166;border-radius:8px;cursor:pointer;font-size:14px;padding:2px 10px}
.level-time{margin:6px 0 12px;color:var(--soft);font-size:15px}
</style></head><body>
<div class="wrap">
  <header><h1>📚 Детская читалка</h1>
    <div class="sub">Истории на английском с выбором и квизом</div></header>
  <div class="levels" id="levels"></div>
  <div class="level-hint" id="levelHint"></div>
  <div id="app"></div>
  <footer>Уровни: A1 — начинающий · A2 — базовый · B1 — средний</footer>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const appEl=$('#app');

/* ===== Уровни ===== */
const LEVELS=[
  {id:'a1',label:'A1',cls:'l-a1',badge:'b-a1',hint:'Начинающий · простые слова и короткие фразы'},
  {id:'a2',label:'A2',cls:'l-a2',badge:'b-a2',hint:'Базовый · чуть сложнее, есть прошедшее время'},
  {id:'b1',label:'B1',cls:'l-b1',badge:'b-b1',hint:'Средний · длиннее истории, больше слов'}
];

/* ===== Истории: ветвление (выбери приключение) + квиз ===== */
const STORIES={
  a1:[
{
emoji:'🐱',title:'Tom and His Cat',start:'s1',
segs:{
 s1:{text:`Tom is a boy. He is seven years old. He lives in a small yellow house with his mother, his father, and his cat. The cat's name is Kitty. Kitty is small and white, with black spots on her back and a fluffy tail. Tom loves Kitty very much. She sleeps on his bed every night, near his feet.

One morning Tom wakes up. The sun is shining through the window. The birds are singing outside. Tom looks at the bed. But Kitty is not there! Tom is surprised. Where is Kitty? She is always on his bed in the morning. Tom gets up and calls: "Kitty! Kitty! Where are you?" But nobody answers.

Tom looks in his room. He looks under the bed. He looks near the window. He looks in the closet, behind the old toys. But Kitty is not there. Tom is a little sad. He wants to find his cat. He goes to the kitchen. His mother is making breakfast. "Mom, do you see Kitty?" asks Tom. "No, I don\t see her," says his mother. "Maybe she is in the garden."`, choices:[{t:'Go look for Kitty in the garden',n:'s2'},{t:'Look in the house again',n:'s3'}]},
 s2:{text:`Tom goes to the garden. The garden is big and green. There are red flowers, yellow flowers, and tall trees. Tom looks behind the bushes. He looks under the big tree. He looks near the flowers. But Kitty is not there. Tom is sad. "Kitty, where are you?" he calls again. Then Tom hears a small sound. It comes from the old box near the fence. Tom opens the box. And there is Kitty! She is sleeping on an old blanket. She opens her eyes and looks at Tom. "Meow!" she says. Tom is very happy. He takes Kitty in his arms and goes home.`, choices:[{t:'Take Kitty home',n:'s4'},{t:'Play with Kitty in the garden',n:'s5'}]},
 s3:{text:`Tom decides to look in the house again. He looks in the living room. He looks under the sofa. He looks behind the big chair. He looks in the kitchen, near the table. But Kitty is not there. Tom is worried. Then he hears a small "meow" from the bathroom. He opens the door. Kitty is sitting near the bathtub! She is playing with a small red ball. "There you are!" says Tom. He smiles. Kitty looks at him and says "Meow!" Tom picks her up and hugs her. He is so happy. Now he knows where to find her.`, choices:[{t:'Bring Kitty back to your room',n:'s4'},{t:'Make Kitty a soft bed',n:'s6'}]},
 s4:{text:`Tom takes Kitty to his room. He puts her on his bed. Kitty is happy. She purrs and rubs her head against Tom\s hand. Tom pets her and says: "Don\t run away again, Kitty. I was worried about you." Kitty says "Meow" and closes her eyes. Tom smiles. He loves his cat very much. Tom thinks: "Kitty likes to hide. I must look for her in new places." He remembers that Kitty likes the garden and the bathroom. Tom decides to make a soft little bed for Kitty near his own bed, so she can sleep close to him.`, choices:[{t:'Make Kitty a soft bed',n:'s6'},{t:'Go tell Mom',n:'s7'}]},
 s5:{text:`Tom plays with Kitty in the garden. He throws a small ball, and Kitty runs after it. She is fast! She catches the ball and brings it back. Tom laughs. They play for a long time. Then Tom sees a butterfly. It is yellow and red. Kitty sees it too and tries to catch it. But the butterfly flies away. Tom and Kitty laugh. After playing, Tom is tired. He sits on the grass and Kitty sits next to him. Tom says: "I\m glad I found you, Kitty." Kitty purrs. They watch the clouds in the sky. The clouds look like a big rabbit and a boat. It is a beautiful day. Tom is happy that he played outside with his cat.`, choices:[{t:'Go home with Kitty',n:'s7'},{t:'Take Kitty to your room',n:'s4'}]},
 s6:{text:`Tom finds an old soft towel. He puts it on the floor near his bed. He makes a nice little bed for Kitty. Kitty looks at it. She walks to the towel, turns around three times, and lies down. She purrs. Tom is happy. "Now you have your own bed, Kitty," he says. Kitty closes her eyes and sleeps. Tom watches her and smiles. He is a good boy who takes care of his cat. In the evening, Tom tells his mother about the new bed for Kitty. His mother says: "That is very kind of you, Tom." Tom feels proud.`, choices:[{t:'Go have dinner with your family',n:'s8'},{t:'Show Dad the new bed',n:'s9'}]},
 s7:{text:`Tom goes to the kitchen. His mother is making soup. His father is reading a book. Tom says: "I found Kitty! She was in the garden, in an old box." His mother smiles. "I am glad," she says. "You are a good boy to look for her." Tom tells about the butterfly and the game with the ball. His father laughs. Then the family sits at the table and eats dinner. Kitty sits under the table and waits for a piece of fish. Tom gives her a small piece. Kitty eats it and says "Meow." Everybody is happy.`, choices:[{t:'Go to sleep after dinner',n:'s9'},{t:'Go say goodnight to Kitty',n:'s8'}]},
 s8:{text:`After dinner, Tom is tired. He washes his face and brushes his teeth. He goes to his room. Kitty is already on her new soft bed. Tom lies down. Kitty opens her eyes and looks at him. Tom says: "Good night, Kitty." Kitty says "Meow" and closes her eyes. Tom smiles. He is happy that he found Kitty and that she is safe. He closes his eyes and sleeps. Kitty sleeps near him. What a nice day! Tom learned that if you look carefully, you can find what you love.`, ending:true},
 s9:{text:`Tom shows his father the new bed for Kitty. His father smiles and says: "You are very kind, Tom. Kitty is lucky to have you." Tom is happy. He pets Kitty. Then father says: "Come, let\s read a story before bed." Tom and his father sit on the sofa. They read a story about a brave dog. Kitty sits on Tom\s lap and listens. She purrs. After the story, Tom is sleepy. He yawns. Father says: "Time for bed, Tom." Tom nods. He takes Kitty to his room. Kitty goes to her new bed. Tom lies down. "Good night, Dad. Good night, Kitty," says Tom. Kitty says "Meow". Tom closes his eyes and sleeps.`, ending:true},},
quiz:[
 {q:'What is the cat\'s name?',o:['Kitty','Molly','Lucky'],a:0},
 {q:'Where does Kitty sleep at night?',o:['On Tom\s bed','In the kitchen','In the garden'],a:0},
 {q:'Where did Tom find Kitty?',o:['In an old box in the garden','Under the sofa','In the closet'],a:0},
 {q:'What did Tom make for Kitty?',o:['A soft bed from an old towel','A new toy','A big house'],a:0},
 {q:'How does Tom feel at the end?',o:['Happy and calm','Angry','Scared'],a:0}
]},

emoji:'🏠',title:'My Family Day',start:'s1',
segs:{
 s1:{text:`It is Saturday morning. The sun is bright. Emma wakes up and looks out the window. The sky is blue. There are no clouds. Emma is happy. Today is a family day! Her mother, her father, her little brother Max, and her grandmother will all be at home. Emma loves family days.

Emma goes to the kitchen. Her mother is making pancakes. They smell very good. "Good morning, Emma!" says her mother. "Good morning, Mom!" says Emma. "Today we can do something fun together. What do you want to do?" Emma thinks. She wants to do many things. She wants to go to the park. She wants to make a cake. She wants to play games. What should the family do first?`, choices:[{t:'Go to the park',n:'s2'},{t:'Stay home and bake a cake',n:'s3'}]},
 s2:{text:`Emma says: "Let's go to the park!" The family gets ready. Max puts on his red shoes. Father takes the big ball. Mother takes water and sandwiches. They walk to the park. The park is big and green. There is a playground with a slide and swings. Max runs to the slide. Emma pushes him on the swing. They laugh. Then father says: "Let\s play ball!" They play ball together. Emma kicks the ball, and Max runs after it. It is fun. After playing, they sit on the grass and eat sandwiches. The sandwiches are tasty. Emma is happy.`, choices:[{t:'Walk around the park more',n:'s4'},{t:'Go home and bake a cake',n:'s5'}]},
 s3:{text:`Emma says: "Let\s stay home and make a cake!" Her mother smiles. "Good idea," she says. They find a big bowl. Emma puts flour, sugar, eggs, and milk into the bowl. Max wants to help too. He stirs the mix with a big spoon. Some flour goes on his nose! Everybody laughs. They put the cake in the oven. While the cake bakes, the house smells wonderful. After thirty minutes, the cake is ready. It is golden and soft. They put jam on top. Emma and Max are happy.`, choices:[{t:'Call Grandma to try the cake',n:'s6'},{t:'Go to the park after the cake',n:'s4'}]},
 s4:{text:`The family walks around the park. They see ducks in the pond. The ducks are white and grey. Max wants to feed them. Father gives Max a small piece of bread. Max throws it to the ducks. The ducks swim fast and eat the bread. They say "quack, quack!" Max laughs. Then they see a big tree. Under the tree there is a bench. The family sits on the bench and rests. Emma looks at the sky. She sees a bird. The bird flies high. Emma thinks: "I wish I could fly like a bird." She smiles. It is a lovely day in the park.`, choices:[{t:'Go back home',n:'s7'},{t:'Go home and make a cake',n:'s5'}]},
 s5:{text:`After the park, the family goes home. Emma is a little tired, but she is happy. Mother says: "Now let\s make a cake together." Emma is excited. They make a big chocolate cake. Emma puts the chocolate on top. Max puts little candies on the cake. The cake looks beautiful. In the evening, the whole family sits at the table. Grandmother comes too. They eat the cake. It is very tasty. Everyone says: "What a good cake, Emma!" Emma is proud. She helped make it.`, choices:[{t:'Have a family games evening',n:'s9'},{t:'Play games with the family',n:'s8'}]},
 s6:{text:`Emma calls her grandmother. "Grandma, come and try our cake!" she says. Grandmother lives nearby, so she comes soon. She tastes the cake. "Mmm, it is delicious!" she says. "You are good cooks." Emma and Max smile. Grandmother tells a funny story about when she was little. Everyone laughs. Then they all drink tea with the cake. The house is warm and cozy. Emma loves these moments with her family. She thinks: "Family days are the best days."`, choices:[{t:'Play games with the whole family',n:'s8'},{t:'Ask Grandma to tell more stories',n:'s9'}]},
 s7:{text:`The family comes home from the park. They are tired but happy. Mother makes tea. Father reads a book. Max plays with his toys. Emma sits near the window and watches the sunset. The sky is orange and pink. It is beautiful. Emma thinks about the day. She played, she laughed, and she was with her family. She is very happy. In the evening, they all have dinner together. Then Emma goes to bed. She is tired, but she smiles. It was a wonderful family day.`, ending:true},
 s8:{text:`In the evening, the family plays games. They play a card game. Max wins the first game and jumps with joy. Then they play "Guess the animal." Father makes sounds like animals, and the children guess. Emma guesses the cow, and Max guesses the dog. Everyone laughs. Grandmother wins the last game. She is happy. After the games, they drink tea and eat the cake. Emma looks around the table. Her family is here, and they are all smiling. Emma thinks: "I love my family." She goes to bed with a happy heart. What a perfect family day!`, ending:true},
 s9:{text:`After the games, grandmother says: "Let me tell you a story about when your mother was little." Everyone listens. Grandmother tells a funny story about how mother lost her shoe in the garden. Everyone laughs. Emma says: "Tell us more, Grandma!" Grandmother smiles and tells another story. Then mother brings tea. They all drink tea together. Emma looks around. Her whole family is here. She feels warm and happy. She thinks: "I am so lucky." After tea, it is late. Emma kisses everyone good night and goes to bed. She sleeps with a smile.`, ending:true},},
quiz:[
 {q:'What day is it in the story?',o:['Saturday','Monday','Thursday'],a:0},
 {q:'What does Emma\'s mother make in the morning?',o:['Pancakes','Soup','Bread'],a:0},
 {q:'Where does the family play ball?',o:['In the park','In the kitchen','In the car'],a:0},
 {q:'What do Emma and Max put on the cake?',o:['Jam and candies','Salt','Pepper'],a:0},
 {q:'How does Emma feel at the end?',o:['Happy','Sad','Angry'],a:0}
]},

emoji:`🐶`,title:`The Little Dog`,start:`s1`,
segs:{
 s1:{text:`There is a little dog. His name is Rex. Rex is brown and white. He has long ears and a happy tail. Rex lives in a big house with a family. The family has a boy named Leo and a girl named Anna. Rex loves Leo and Anna very much. He always wags his tail when he sees them.

One day, Leo and Anna go to school. Rex is sad. He does not like to be alone. He sits near the door and waits. He waits and waits. The day is long. Rex looks out the window. He sees birds. He sees cars. But no Leo and Anna. Rex is bored. He wants to play. What can Rex do while the children are at school?`, choices:[{t:`Go play in the yard`,n:`s2`},{t:`Stay and wait by the door`,n:`s3`}]},
 s2:{text:`Rex goes to the yard. The yard is big. There is a tree and a fence. Rex runs around the tree. He jumps and barks. He finds an old ball near the fence. Rex plays with the ball. He throws it up and catches it. He runs after it. It is fun, but Rex wants a friend to play with. He sees a cat on the fence. The cat is black. Rex barks: "Woof! Woof!" The cat looks at him and says "Meow." Then the cat walks away. Rex is a little sad. He wants Leo and Anna to come home.`, choices:[{t:`Go look for adventures`,n:`s4`},{t:`Go back to the door and wait`,n:`s3`}]},
 s3:{text:`Rex sits near the door. He waits. He hears a sound. Is it the children? Rex runs to the door. But it is only the wind. Rex is sad. He lies down near the door. He puts his head on his paws. He thinks about Leo and Anna. He thinks about playing ball with them. He thinks about the tasty food they give him. Rex waits and waits. Then he hears a new sound. It is the school bus! Rex jumps up. His tail wags fast. The door opens. Leo and Anna come in! "Rex!" they shout. Rex is so happy. He jumps and barks.`, choices:[{t:`Greet the children happily`,n:`s5`},{t:`Stay inside with the children`,n:`s8`}]},
 s4:{text:`Rex walks around the yard. He smells the flowers. He looks at the sky. Then he sees a butterfly. Rex runs after the butterfly. The butterfly flies over the fence. Rex wants to follow it, but the fence is too high. Rex stops. He looks around. He sees a small hole under the fence. Rex goes through the hole. Now he is on the street! Rex walks along the street. He sees a big truck. He sees a red car. He sees people walking. Rex is a little scared. He does not know this street. He wants to go home. But where is home? Rex is lost.`, choices:[{t:`Ask for help`,n:`s6`},{t:`Try to find the way home alone`,n:`s7`}]},
 s5:{text:`Leo and Anna play with Rex in the yard. Leo throws the ball, and Rex catches it. Anna gives Rex a small treat. Rex eats it and wags his tail. They play for a long time. Then Leo says: "Rex, you are the best dog." Rex barks: "Woof!" He is happy. In the evening, the family gives Rex a good dinner. Rex eats and then sleeps near the fireplace. He dreams about playing with Leo and Anna. Rex is happy because he has a family that loves him.`, ending:true},
 s6:{text:`Rex sits on the sidewalk. He is scared. A kind woman sees him. "Little dog, are you lost?" she asks. Rex wags his tail sadly. The woman looks at his collar. There is a phone number on it. The woman calls the number. It is Rex's family! Soon, Leo and Anna come with their father. "Rex!" they shout. Rex runs to them. He is so happy. Leo hugs him. "Don	 run away again, Rex," says Leo. Rex licks Leos hand. They all go home together. Rex learned that it is not good to run away.`, choices:[{t:`Go home with your family`,n:`s9`},{t:`Play with Leo and Anna`,n:`s5`}]},
 s7:{text:`Rex tries to find the way home. He walks and walks. He sees a park. He remembers the park near his house. He goes to the park. He sees the big tree where he plays. He goes past the tree. He sees the red house with the white door. That is his house! Rex runs to the door. He barks: "Woof! Woof!" Leo and Anna open the door. "Rex! You are back!" they shout. Rex jumps into their arms. He is so happy. He is home. Leo says: "We were so worried, Rex." Rex wags his tail. He is happy to be home.`, choices:[{t:`Play with the kids at home`,n:`s5`},{t:`Sleep happily at home`,n:`s9`}]},
 s8:{text:`The family stays home. Leo reads a book, and Anna draws a picture. Rex sits between them. He is calm and happy. He is not sad anymore because Leo and Anna are home. When it is time for bed, Rex sleeps near Leo's bed. He feels safe. He knows his family loves him.`, ending:true},
 s9:{text:`The next morning, Leo and Anna wake up. Rex is already at their door. He wags his tail. "Good morning, Rex!" says Leo. Rex barks happily. After breakfast, Leo and Anna take Rex for a walk. Rex runs and jumps. He is so happy. They go to the park. Rex plays with other dogs. He makes new friends. Leo and Anna watch and laugh. On the way home, Leo says: "Rex, you are the best dog in the world." Rex licks Leos hand. When they come home, they give Rex a big bowl of food. Rex eats and then sleeps. He is a happy dog.`, ending:true},
},
quiz:[

emoji:'🎈',title:'My Red Balloon',start:'s1',
segs:{
 s1:{text:`It is Leo's birthday. He is six years old. His mother gives him a big red balloon. The balloon is round and bright red. It has a long string. Leo is very happy. He holds the string and walks with the balloon. The balloon goes up and down. It dances in the air. Leo loves his red balloon.

Leo goes outside. The wind is blowing. Leo walks to the park. He wants to show his balloon to his friends. He holds the string very tight. The balloon is big and beautiful. Leo is proud of his red balloon. He thinks: "I will play with my balloon all day." But the wind is strong. What will happen?`, choices:[{t:'Go to the park to show your friends',n:'s2'},{t:'Play with the balloon in the yard',n:'s3'}]},
 s2:{text:`Leo goes to the park. His friends Mia and Sam are there. "Look at my red balloon!" shouts Leo. Mia and Sam look. "Wow, it is so big!" says Mia. Leo plays with the balloon. He throws it up, and it floats down. He catches it. Mia and Sam want to play too. Leo lets them hold the string. They all play together. It is fun. Then the wind blows very strong. The balloon pulls the string. Leo holds it tight. But the wind is stronger. The string slips from Leo\s hand. The balloon flies up into the sky!`, choices:[{t:'Run after the balloon',n:'s4'},{t:'Ask a grown-up for help',n:'s5'}]},
 s3:{text:`Leo stays in the yard. He plays with his red balloon. He throws it up high. The balloon goes up, up, up. Then it comes down. Leo catches it. He does it again. He laughs. The balloon is fun. Then Leo sees a bird. The bird is black. The bird looks at the red balloon. The bird flies near the balloon. Leo is afraid the bird will pop his balloon. He holds the balloon close. The bird flies away. Leo is happy. He plays with his balloon more.`, choices:[{t:'Go to the park to your friends',n:'s2'},{t:'Keep playing in the yard',n:'s10'}]},
 s4:{text:`Leo runs after the balloon. The balloon flies up and up. It goes over the trees. It goes over the houses. Leo runs and runs. But the balloon is too high. Leo can not reach it. He is sad. He looks at the balloon in the sky. It becomes smaller and smaller. Then it is a small red dot. Then it is gone. Leo is very sad. He wanted to keep his balloon. He sits on the grass and looks at the sky. His friends come to him. "Don\t be sad, Leo," says Mia. "We can help you."`, choices:[{t:'Accept your friends\' help',n:'s6'},{t:'Go home sad',n:'s7'}]},
 s5:{text:`Leo asks a man in the park for help. "Excuse me, my balloon flew away," says Leo. The man looks up. The balloon is very high. "I am sorry, boy," says the man. "I can not reach it." Leo is sad. Then the man says: "But I have an idea. Let\s wait. Maybe the wind will bring it down." Leo waits. He looks at the sky. The balloon moves with the wind. It goes behind a big tree. Leo runs to the tree. But the balloon is not there. It flew over the houses. Leo is sad. He walks home slowly.`, choices:[{t:'Tell Mom about the balloon',n:'s7'},{t:'Ask Mia for help',n:'s6'}]},
 s6:{text:`Mia says: "I have a red balloon at home. I can give it to you." Leo is happy. "Really?" he asks. "Yes," says Mia. "But it is smaller than yours. Is that okay?" Leo smiles. "Yes, thank you!" he says. Mia runs home and comes back with a red balloon. It is smaller, but it is red and beautiful. Leo takes it. He holds the string. "Thank you, Mia!" he says. They play together with the balloon. Leo is happy again. He learned that friends are kind and help you when you are sad.`, choices:[{t:'Play with friends and the balloon',n:'s9'},{t:'Go home when the evening comes',n:'s11'}]},
 s7:{text:`Leo goes home. He is sad. His mother sees him. "What is wrong, Leo?" she asks. Leo tells her about the balloon. "The wind took it away," he says. His mother hugs him. "I am sorry, Leo," she says. "But I have a surprise for you." She goes to the closet and brings a box. In the box there are many balloons: red, blue, yellow, and green. "Wow!" says Leo. His eyes are big. "You can have them all," says his mother. Leo is very happy. He takes the red balloon and the blue balloon. He plays with them. He is happy again.`, choices:[{t:'Play with your new balloons',n:'s8'},{t:'Show Dad your new balloons',n:'s9'}]},
 s8:{text:`Leo plays with his balloons. He has a red one, a blue one, and a yellow one. He ties them together. Now he has a big bunch of balloons. He runs outside. His friends see him. "Wow, Leo! You have many balloons!" says Sam. Leo smiles. "Yes! The wind took one, but now I have three!" They all play together. Leo throws the balloons up. They float in the sky. It is beautiful. Leo is happy. He learned that even when you lose something, you can find new joy. And friends make everything better.`, ending:true},
 s10:{text:`Leo plays with his red balloon all afternoon. He has so much fun. In the evening, his mother calls him for dinner. Leo takes his balloon inside. He puts it near his bed. "Tomorrow I will show it to my friends," he thinks. He smiles. The red balloon is his favorite gift. Leo falls asleep looking at the balloon.`, ending:true},
 s11:{text:`Leo and his friends play with the balloon until the evening. Then Leo goes home. He tells his mother about Mia's kindness. Mother smiles. "You have good friends, Leo," she says. Leo nods. He puts the balloon near his bed. He is happy. He learned that a friend's gift is precious.`, ending:true},
 s9:{text:`In the evening, Leo\s father comes home. He sees the balloons. "Wow, Leo! You have many balloons!" he says. Leo tells him about the red balloon and the wind. Father says: "That is sad. But look, you have new balloons now." Leo smiles. "Yes, and Mia gave me one too," he says. Father says: "You have good friends, Leo." Leo nods. Then father takes one balloon and ties it to Leo\s wrist. "Now it can not fly away," he says. Leo laughs. He plays with the balloons. He is happy. He learned that even when you lose something, good things can come.`, ending:true},},
quiz:[

]},

emoji:`🧺`,title:`Family Picnic`,start:`s1`,
segs:{
 s1:{text:`It is a sunny Sunday. The sky is blue. There are no clouds. Mother says: "Let's go on a picnic today!" Emma and Max are very happy. They love picnics. Father takes the big basket. Mother puts sandwiches, apples, and juice in the basket. Emma takes a blanket. Max takes his favorite toy car. They all get in the car and go to the park.

The park is big and green. There is a lake with ducks. There are tall trees. There is a big field of grass. The family finds a nice place under a big tree. Mother puts the blanket on the grass. Father puts the basket on the blanket. Emma and Max run around. They are happy. What should the family do first?`, choices:[{t:`Eat first`,n:`s2`},{t:`Play first`,n:`s3`}]},
 s2:{text:`The family sits on the blanket. Mother opens the basket. There are sandwiches with cheese and tomato. There are red apples. There is cold juice. Everyone is hungry. They eat the sandwiches. "Mmm, they are tasty!" says Max. He eats two sandwiches. Emma eats an apple. Father drinks juice. Mother smiles. "I am glad you like the food," she says. After eating, Max wants to play. "Can we play ball?" he asks. Father says: "Yes, let's play."`, choices:[{t:`Play ball`,n:`s4`},{t:`Go look at the ducks`,n:`s5`}]},
 s3:{text:`Emma and Max run on the grass. They play tag. Max runs fast, but Emma catches him. They laugh. Then they play with Max's toy car. The car goes on the grass. They push it and run after it. It is fun. Then Emma sees a butterfly. It is yellow. She runs after it. The butterfly flies to the flowers. Emma looks at the flowers. They are red and white. She picks one small flower. Then Max says: "I am hungry!" Mother says: "Let's eat then." They go to the blanket.`, choices:[{t:`Sit down and eat`,n:`s2`},{t:`Go feed the ducks`,n:`s5`}]},
 s4:{text:`Father takes the ball. They play ball on the grass. Father throws the ball to Emma. Emma catches it. She throws it to Max. Max misses the ball. The ball rolls to the lake! Max runs after it. But the ball goes into the water. Max is sad. "My ball is in the lake!" he says. Father says: "Don't worry. I will get it." Father takes a long stick. He pulls the ball to the shore. He gives it to Max. Max is happy. "Thank you, Dad!" he says. They play ball again.`, choices:[{t:`Go feed the ducks`,n:`s5`},{t:`Keep playing ball`,n:`s6`}]},
 s5:{text:`The family goes to the lake. There are ducks in the water. They are white and grey. Max wants to feed them. Father gives Max a small piece of bread. Max throws it to the ducks. The ducks swim fast. They eat the bread. They say "quack, quack!" Max laughs. Emma throws bread too. A big duck comes near. It is not afraid. Emma is happy. Then the ducks swim away. The family watches them. The lake is beautiful. The water is blue and clean.`, choices:[{t:`Go back to the blanket`,n:`s7`},{t:`Play ball again`,n:`s6`}]},
 s6:{text:`The family plays ball more. Emma and Max run and laugh. Father throws the ball high. Max jumps and catches it. "Good job, Max!" says Father. Then Emma kicks the ball. It goes far. Max runs after it. They play for a long time. Then they are tired. They sit on the blanket. Mother gives them juice. They drink. The juice is cold and sweet. Emma says: "This is the best day." Mother smiles. "I am happy you are having fun," she says.`, choices:[{t:`Eat and rest`,n:`s7`},{t:`Go feed the ducks`,n:`s5`}]},
 s7:{text:`The family rests on the blanket. They eat the rest of the food. They eat apples and sandwiches. They drink juice. Then they lie on the blanket and look at the sky. They see clouds. The clouds look like a rabbit and a ship. Max says: "I see a dragon!" Emma laughs. "No, it is a rabbit!" They laugh together. The sun is warm. The wind is soft. Emma feels happy. She thinks: "I love picnics with my family."`, choices:[{t:`Pack up and drive home`,n:`s9`},{t:`Stay until the evening`,n:`s8`}]},
 s8:{text:`The family stays at the park until the evening. They watch the sunset. The sky is pink and orange. Max falls asleep on the blanket. Father carries him to the car. Emma looks at the first stars. She is happy. She thinks: "I love my family." It was a perfect picnic day.`, ending:true},
 s9:{text:`The next day, Emma draws a picture. She draws the picnic, the ducks, and the big tree. She shows it to her mother. "It is beautiful, Emma!" says mother. "Can we put it on the fridge?" Emma nods. They put the picture on the fridge. Max looks at it. "I want to draw too!" he says. He draws a big duck. Everyone laughs. Emma is happy. She thinks about the picnic. It was a wonderful day. She hopes they will go on another picnic soon. Mother says: "We can go again next Sunday if the weather is nice." Emma and Max are very happy. They can not wait.`, ending:true},
},
quiz:[
 {q:`Where does the family go?`,o:[`To the park for a picnic`,`To the store`,`To school`],a:0},
 {q:`What happens to the ball?`,o:[`It rolls into the lake`,`It pops`,`It flies away`],a:0},
 {q:`What do the children feed to the ducks?`,o:[`Bread`,`Sandwiches`,`Apples`],a:0},
 {q:`What do the clouds look like?`,o:[`A rabbit and a ship`,`A cat and a dog`,`A house and a tree`],a:0},
 {q:`How does Emma feel at the end?`,o:[`Happy`,`Sad`,`Angry`],a:0},
]
},

emoji:'🦁',title:'A Day at the Zoo',start:'s1',
segs:{
 s1:{text:`It is a bright morning. Leo and Anna go to the zoo with their father. Leo is very excited. He loves animals. Anna loves animals too. They buy tickets and go inside the zoo. There are many animals. There are lions, monkeys, elephants, and giraffes. There are birds and fish. Leo wants to see everything.

First, they see the monkeys. The monkeys are funny. They jump from branch to branch. They make funny faces. Leo laughs. One monkey takes a banana and eats it. Anna laughs too. "Look, Leo! The monkey is eating a banana!" she says. Leo watches the monkey. The monkey is fast. Then father says: "Where do you want to go next?" Leo thinks. There are so many animals. What should they see next?`, choices:[{t:'Go to the lions',n:'s2'},{t:'Go to the elephants',n:'s3'}]},
 s2:{text:`They go to the lions. The lions are big and strong. They have golden fur. They have big manes. One lion is sleeping. Another lion walks around. Leo looks at the lion. "The lion is so big!" he says. Father says: "The lion is the king of animals." Leo is impressed. He watches the lion. The lion opens its mouth and yawns. Leo laughs. Then the lion roars: "Rrrr!" It is loud. Leo is a little scared, but also excited. "Wow!" he says. "That was amazing!"`, choices:[{t:'Go to the giraffes',n:'s4'},{t:'Go to the elephants',n:'s3'}]},
 s3:{text:`They go to the elephants. The elephants are very big. They have long trunks and big ears. One elephant takes water with its trunk and sprays it. The water goes up like a fountain. Leo and Anna laugh. "Look! The elephant is playing with water!" says Anna. The elephant is happy. It flaps its ears. Leo wants to touch the elephant, but father says: "No, Leo. We must not touch the animals." Leo nods. He watches the elephant. The elephant is gentle and kind. Leo likes the elephant.`, choices:[{t:'Go to the giraffes',n:'s4'},{t:'Go to the birds',n:'s5'}]},
 s4:{text:`They go to the giraffes. The giraffes are very tall. They have long necks and long legs. They eat leaves from tall trees. Leo looks up. The giraffe is very high. "The giraffe is the tallest animal!" says Leo. Father says: "Yes, the giraffe has a very long neck." The giraffe looks at Leo. It blinks its big eyes. Leo waves. The giraffe moves its head. Anna says: "I like the giraffe. It is so elegant." They watch the giraffes for a while.`, choices:[{t:'Go to the birds',n:'s5'},{t:'Go get some ice cream',n:'s6'}]},
 s5:{text:`They go to the birds. There are many birds. There are red birds, blue birds, and yellow birds. There is a big parrot. The parrot is green and red. It can talk! "Hello! Hello!" says the parrot. Leo and Anna laugh. "The parrot can talk!" says Leo. The parrot says "Hello" again. Anna says "Hello" back. The parrot shakes its head. It is very funny. There are also penguins. The penguins walk slowly. They look like little men in black coats. They slide on the ice. Leo and Anna watch the penguins. They are so cute.`, choices:[{t:'Go get some ice cream',n:'s6'},{t:'Go to the fish',n:'s7'}]},
 s6:{text:`Leo is hungry. "Dad, can we get ice cream?" he asks. Father says: "Yes, let's get some." They go to the ice cream shop. There is chocolate ice cream, strawberry ice cream, and vanilla ice cream. Leo takes chocolate. Anna takes strawberry. Father takes vanilla. They eat the ice cream. It is cold and sweet. Leo is happy. "This is the best ice cream!" he says. Anna laughs. "You say that every time," she says. They sit on a bench and eat. The sun is warm. It is a nice day.`, choices:[{t:'Go to the fish',n:'s7'},{t:'Go home',n:'s9'}]},
 s7:{text:`They go to the fish. There is a big aquarium. There are many fish. There are orange fish, blue fish, and silver fish. There is a big fish with sharp teeth. Father says: "That is a shark. But it is small." Leo looks at the shark. It swims around. There are also colorful fish. They look like little jewels. Anna says: "The fish are so beautiful." They watch the fish. The fish swim in the water. It is calm and quiet. Leo likes watching the fish.`, choices:[{t:'Go home',n:'s8'},{t:'Go home and tell Mom',n:'s9'}]},
 s8:{text:`The day at the zoo is over. Leo and Anna are tired but happy. They saw many animals. They saw monkeys, lions, elephants, giraffes, birds, penguins, and fish. They ate ice cream. It was a wonderful day. On the way home, Leo says: "Dad, I love the zoo. Can we come again?" Father smiles. "Yes, we can come again," he says. Anna says: "I want to see the giraffes again." Leo says: "I want to see the lions again." They laugh. When they come home, they tell their mother about the zoo. Then they go to bed. They dream about the animals. It was a perfect day.`, ending:true},
 s9:{text:`When they come home from the zoo, Leo and Anna tell their mother about everything. "We saw a lion!" says Leo. "And a giraffe!" says Anna. "And a talking parrot!" they both say. Mother smiles. "That sounds wonderful," she says. Leo shows the pictures he drew of the animals. He drew a lion and an elephant. Anna drew a giraffe and a penguin. Mother puts the pictures on the wall. "Now we can see the animals every day," she says. Leo and Anna are happy. They go to bed and dream about the zoo. It was a perfect day.`, ending:true},},
quiz:[
 {q:'What animals do the children see first?',o:['Monkeys','Lions','Elephants'],a:0},
 {q:'Which animal is called the king of animals?',o:['The lion','The elephant','The giraffe'],a:0},
 {q:'What can the parrot do?',o:['Talk','Swim','Fly very high'],a:0},
 {q:'What ice cream does Leo take?',o:['Chocolate','Strawberry','Vanilla'],a:0},
 {q:'Which animal is the tallest?',o:['The giraffe','The elephant','The shark'],a:0}
]},

emoji:`🐈`,title:`The Lost Kitten`,start:`s1`,
segs:{
 s1:{text:`One rainy day, Emma is at home. She looks out the window. The rain is falling. The drops hit the window. Emma is a little bored. Then she hears a small sound. It sounds like "meow." Emma listens. She hears it again: "meow." Emma goes to the door. She opens it. On the step there is a small kitten! The kitten is wet and cold. It is grey with white paws. It looks at Emma with big eyes. "Meow," it says again. Emma is surprised. "Oh, you poor little kitten!" she says. "You are all wet. Come in."`, choices:[{t:`Let the kitten in and warm it`,n:`s2`},{t:`Call Mom`,n:`s3`}]},
 s2:{text:`Emma takes the kitten inside. She finds an old towel. She dries the kitten. The kitten is warm now. It purrs. Emma gives it a small bowl of milk. The kitten drinks the milk. It is hungry. After drinking, the kitten is happy. It walks around the room. It looks at everything. Emma smiles. "You are a cute kitten," she says. The kitten says "Meow." Emma wants to keep the kitten. But maybe it has a home. What should Emma do?`, choices:[{t:`Look for the kitten's owner`,n:`s4`},{t:`Keep the kitten`,n:`s5`}]},
 s3:{text:`Emma calls her mother. "Mom, come here! There is a kitten at the door!" Mother comes. She looks at the kitten. "Oh, the poor little thing," she says. "It is wet and cold." Mother helps Emma dry the kitten. They give it milk. The kitten drinks and purrs. Mother says: "We must find out who owns this kitten. Maybe someone is looking for it." Emma nods. She wants to help the kitten. They will look for the owner.`, choices:[{t:`Look for the kitten's owner`,n:`s4`},{t:`Ask Mom to keep the kitten`,n:`s5`}]},
 s4:{text:`Emma and her mother ask the neighbors. They go to the house next door. They ask: "Do you have a kitten?" The neighbor says: "No, we don't have a cat." They go to another house. They ask again. The people say: "No, we don	 have a kitten." Emma is sad. Nobody knows the kitten. Then they see a poster on a tree. The poster has a picture of a kitten. It says: "Lost kitten. Grey with white paws. Please call." Emma reads the poster. The kitten on the poster looks just like the kitten! There is a phone number. Emmas mother calls the number.`, choices:[{t:`Call the number on the poster`,n:`s6`},{t:`Keep the kitten if nobody answers`,n:`s8`}]},
 s5:{text:`Emma wants to keep the kitten. She asks her mother: "Mom, can we keep the kitten?" Mother thinks. She says: "Emma, maybe the kitten has a family that loves it. We must look for its owner first. If nobody wants it, we can keep it." Emma nods. She understands. She wants to be fair. They will look for the owner. If nobody comes, the kitten will stay with them. Emma hopes nobody comes, but she also wants the kitten to be happy.`, choices:[{t:`Look for the kitten's owner`,n:`s4`},{t:`Keep the kitten if nobody comes`,n:`s8`}]},
 s6:{text:`A woman answers the phone. "Hello?" she says. Emmas mother says: "Hello, we found a grey kitten with white paws. Is it yours?" The woman is happy. "Oh yes! That is my kitten! Her name is Snowball. She ran away yesterday. I was so worried!" The woman comes to Emmas house. She sees the kitten. "Snowball!" she cries. The kitten runs to her. It is happy. The woman thanks Emma and her mother. "Thank you so much for taking care of her," she says. Emma is a little sad, but she is happy the kitten has a home.`, choices:[{t:`Say goodbye to the kitten`,n:`s7`},{t:`Visit Snowball next week`,n:`s9`}]},
 s7:{text:`The woman takes Snowball home. Before she leaves, she says: "You are a kind girl, Emma. Thank you." Emma pets Snowball one last time. "Goodbye, Snowball," she says. "Be a good kitten." The kitten says "Meow." Emma smiles. She is a little sad, but she is happy that Snowball found her family. Emmas mother hugs her. "You did a good thing, Emma," she says. "You helped a kitten find its home." Emma feels proud. She did the right thing.`, choices:[{t:`Go home`,n:`s9`},{t:`Watch them go home`,n:`s10`}]},
 s8:{text:`Emma's mother calls the number. But nobody answers. The next day, they call again. Still nobody answers. Emma looks at the kitten. "Can we keep it now?" she asks. Mother smiles. "Yes, I think the kitten is ours now." Emma is so happy. She names the kitten Snowball. Snowball purrs. Emma hugs her. She has a new friend.`, ending:true},
 s10:{text:`Emma waves goodbye. Snowball and the woman go home. Emma closes the door. She is a little sad, but her mother hugs her. "You did a good thing, Emma," she says. Emma smiles. She knows Snowball is happy. In the evening, Emma draws a picture of Snowball. She puts it on the wall. She helped a kitten find its home. Emma feels proud.`, ending:true},
 s9:{text:`The next weekend, Emma visits Snowball. The woman is happy to see her. "Snowball, Emma is here!" she calls. Snowball runs to Emma. She purrs and rubs against Emmas legs. Emma pets her. "Hello, Snowball!" she says. They play together. Snowball chases a little ball. Emma laughs. The woman gives Emma cookies and milk. They have a nice time. Before Emma leaves, she says: "I will come again, Snowball." Snowball says "Meow". Emma walks home happy. She has a new friend. She learned that helping others can bring you new friends and joy. She smiles all the way home.`, ending:true},
},
quiz:[
 {q:`Where does Emma find the kitten?`,o:[`At the door`,`In the kitchen`,`Under the bed`],a:0},
 {q:`What color is the kitten?`,o:[`Grey with white paws`,`Black`,`Orange`],a:0},
 {q:`What does Emma give the kitten to drink?`,o:[`Milk`,`Water`,`Juice`],a:0},
 {q:`What is the kitten's name?`,o:[`Snowball`,`Kitty`,`Luna`],a:0},
 {q:`What does the woman give Emma?`,o:[`Chocolates`,`A kitten`,`A book`],a:0},
]
}

emoji:'🗺️',title:'The Lost Map',start:'s1',
segs:{
 s1:{text:`It was a rainy Saturday afternoon. Mia and her older brother Tom were bored. They had already played every game they knew. They had watched two cartoons. They had eaten all the cookies. "I am so bored," said Mia, lying on the floor. "Me too," said Tom. "I wish something exciting would happen."

Just then, their mother called from the stairs. "Children! I need help cleaning the attic!" she shouted. Tom and Mia looked at each other. The attic was old and dusty, full of boxes and old things. But it was something to do. "Coming, Mom!" they shouted together.

The attic was dark and full of cobwebs. There were old chairs, broken lamps, and many boxes. Tom and Mia started to sort the boxes. In one box, they found old clothes. In another, they found old books. Then Mia opened a small brown box. Inside, there was a piece of old yellow paper. It had a drawing on it. It looked like a map. There was a big X in the middle. "Tom, look at this!" said Mia. "It looks like a treasure map!" Tom took the paper and looked at it carefully. The map showed a park, a river, and a big old tree. The X was near the tree. "This is amazing!" said Tom. "We have to follow this map!"`, choices:[{t:'Follow the map right now',n:'s2'},{t:'Show the map to Mom first',n:'s3'}]},
 s2:{text:`Tom and Mia ran downstairs with the map. They put on their jackets and boots. It was still raining, but they did not care. They had a treasure to find! They ran to the park. The park was empty because of the rain. The grass was wet. The trees were dripping. Tom looked at the map. "We need to find the river first," he said.

They walked to the river. The river was full and fast after the rain. They followed the river for a while. Then Tom looked at the map again. "Now we need to find the big old tree," he said. They looked around. There were many trees. "Which one is the big old tree?" asked Mia. Tom pointed to a very large tree near the river. It had thick branches and a wide trunk. It looked very old. "That one!" said Tom. They walked to the tree. The X on the map was right at this tree. "We are here!" said Mia. She was excited. "Now what?"`, choices:[{t:'Dig under the tree',n:'s4'},{t:'Look inside the hollow tree',n:'s5'}]},
 s3:{text:`Tom and Mia decided to show the map to their mother first. They ran downstairs. "Mom, look what we found!" said Mia. She showed the map to her mother. Mother looked at it carefully. She smiled. "This looks like a map of the old park near the river," she said. "People say that many years ago, a treasure was hidden there. But nobody ever found it. It is probably just a legend." Tom and Mia looked at each other. Their eyes were big. "Can we go look for it?" asked Tom. Mother thought for a moment. "The rain will stop soon," she said. "You can go after lunch. But be careful, and come back before dark." Tom and Mia were very happy. They could not wait for lunch to end.`, choices:[{t:'Go to the park after lunch',n:'s2'},{t:'Stay home and play games',n:'s10'}]},
 s4:{text:`Tom found a strong stick and started to dig under the tree. The ground was wet and soft. He dug and dug. Mia watched. After a few minutes, the stick hit something hard. "I found something!" shouted Tom. He dug faster. Soon they saw a small metal box. It was old and rusty. Tom pulled it out of the ground. Mia's hands were shaking. "Open it!" she said.

Tom tried to open the box, but it was stuck. He pulled and pulled. Finally, the lid opened with a loud "pop!" Inside the box, there was a small piece of paper. Tom took it out. On the paper, there was writing. It said: "The real treasure is not gold. It is the friends you make on the way. Keep looking, and you will find it." Tom and Mia read the note. They looked at each other. "What does it mean?" asked Mia. Tom shrugged. "I don't know," he said. "But there must be more to find."`, choices:[{t:'Search for more clues',n:'s6'},{t:'Go home and tell Mom',n:'s7'}]},
 s5:{text:`Instead of digging, Mia looked at the tree more carefully. She saw a big hole in the trunk, near the bottom. It was dark inside. "Tom, look! There is a hole in the tree!" she said. Tom came closer. He put his hand inside the hole. He felt something. It was cold and metal. He pulled it out. It was a small metal box! "Wow!" said Tom. "You found it!" Mia was very proud.

They tried to open the box. It was stuck. Tom pulled hard, and the lid opened. Inside, there was a small piece of paper. On it, there was writing. It said: "The real treasure is not gold. It is the friends you make on the way. Keep looking, and you will find it." Tom and Mia read the note. They were confused. "What does this mean?" asked Mia. "I don't know," said Tom. "But there must be more to find."`, choices:[{t:'Search for more clues',n:'s6'},{t:'Go home and tell Mom',n:'s7'}]},
 s6:{text:`Tom looked at the note again. "There must be another clue," he said. He turned the paper over. On the other side, there was a small drawing. It showed a bridge. Under the bridge, there was a circle. "A bridge!" said Mia. "There is an old bridge over the river!" They ran to the bridge. It was an old wooden bridge. It crossed the river. Tom and Mia walked under the bridge. It was dark and wet there. They looked around. Mia saw something shiny in the corner. "Tom, look!" she said. She picked it up. It was a small key! It was old and made of brass. "A key!" said Tom. "But what does it open?"

They looked at the key. It was small. "Maybe it opens a box," said Mia. "But we already found the box." Tom thought. "Maybe there is another box somewhere," he said. They looked at the map again. The map showed the park, the river, and the tree. But there was also a small drawing in the corner of the map. It looked like a house. "What is this?" asked Mia. "Maybe it is the old house near the park," said Tom. "Let's go there!"`, choices:[{t:'Go to the old house',n:'s8'},{t:'Return to the tree and search',n:'s9'}]},
 s7:{text:`Tom and Mia decided to go home and show the note to their mother. They ran home, wet and tired. "Mom! Look what we found!" shouted Mia. She showed the note to her mother. Mother read it. "The real treasure is not gold. It is the friends you make on the way," she read. She smiled. "This is a beautiful message," she said. "It means that the most important thing is not money or things. It is the people you love and the adventures you share." Tom and Mia thought about this. "So there is no gold?" asked Tom. "Maybe not," said mother. "But you found something better. You had an adventure together. And you learned something important." Tom and Mia smiled. They had a great adventure, even without gold. They put the map and the note in a safe place. It was a treasure they would always keep.`, ending:true},
 s8:{text:`Tom and Mia walked to the old house near the park. It was an old, empty house. Nobody lived there. The windows were broken. The door was locked. Tom tried the door. It would not open. "The key!" said Mia. "Maybe the key opens this door!" Tom took the small key and put it in the lock. It fit! He turned it. The lock clicked. The door opened slowly. Tom and Mia went inside. The house was dark and dusty. There were old furniture and cobwebs. "It is scary," said Mia quietly. "Don't worry," said Tom. "We are together."

They looked around. In the corner, there was an old desk. On the desk, there was a small box. It was locked. "The key must open this box!" said Mia. Tom put the key in the box's lock. It fit! He opened it. Inside, there was a letter and a small bag. Tom opened the letter. It said: "Dear finder, you have found my treasure. It is not gold. It is this: the stories of my life. I hope you enjoy them. — Old Mr. Brown." Tom opened the bag. Inside, there were many old photographs and letters. They were stories of a man's life. Tom and Mia looked at the photos. They showed a young man, a family, and a happy life. "This is the treasure," said Mia softly. "His memories." Tom nodded. "This is better than gold," he said. They took the box home and showed it to their mother. She was amazed. They learned that the best treasures are memories and stories.`, ending:true},
 s9:{text:`Tom and Mia went back to the big tree. They looked around for more clues. Mia saw a small stone near the tree. It was different from the other stones. It was smooth and round. She moved it. Under the stone, there was a small metal box! "Tom! Look!" she shouted. Tom ran to her. They opened the box. Inside, there was a letter and a small bag. Tom opened the letter. It said: "Dear finder, you have found my treasure. It is not gold. It is this: the stories of my life. I hope you enjoy them. — Old Mr. Brown." Tom opened the bag. Inside, there were many old photographs and letters. They were stories of a man's life. Tom and Mia looked at the photos. They showed a young man, a family, and a happy life. "This is the treasure," said Mia softly. "His memories." Tom nodded. "This is better than gold," he said. They took the box home and showed it to their mother. She was amazed. They learned that the best treasures are memories and stories.`, ending:true},
 s10:{text:`Tom and Mia thought about the legend. "Maybe the treasure is not real," said Tom. "Maybe it is just a story." Mia nodded. "We can look for it another day," she said. Mother made hot chocolate, and they played board games all afternoon. It was a cozy day. The map stayed safe in the drawer, waiting for another rainy-day adventure.`, ending:true},
},
quiz:[
 {q:'Where do the children find the map?',o:['In the attic','In the park','In the river'],a:0},
 {q:'What does the map show?',o:['A park, a river, and a big tree','A city','A school'],a:0},
 {q:'What is in the first metal box?',o:['A note with a message','Gold coins','A toy'],a:0},
 {q:'What does the note say?',o:['The real treasure is friends, not gold','Find the gold under the tree','Go home now'],a:0},
 {q:'What is the real treasure?',o:['Memories and stories','Gold','Jewels'],a:0}
]},

emoji:`🌷`,title:`The Magic Garden`,start:`s1`,
segs:{
 s1:{text:`Lily lived in a small house at the edge of the town. Behind her house, there was an old wooden fence. Behind the fence, there was a big, wild garden. Nobody had taken care of it for many years. The grass was tall. The bushes were wild. There were old trees with thick branches. Lily often looked at the garden from her window. She thought it was mysterious. "I wonder what is in there," she said to her cat, Whiskers.

One sunny morning, Lily found a small hole in the fence. It was just big enough for her to go through. She looked through the hole. She saw green grass and flowers. Lily was curious. She decided to go into the garden. She pushed through the hole carefully. The garden was quiet and peaceful. The birds were singing. The sun was warm. Lily walked slowly. She saw many flowers. Some were red, some were yellow, some were purple. They were beautiful. "This is amazing!" said Lily. She felt like she was in a different world.`, choices:[{t:`Go deeper into the garden`,n:`s2`},{t:`Go back and call a friend`,n:`s3`}]},
 s2:{text:`Lily walked deeper into the garden. The trees were tall. The path was small and made of old stones. She followed the path. After a while, she came to a clearing. In the middle of the clearing, there was a small pond. The water was clear and blue. Around the pond, there were many beautiful flowers. Lily sat near the pond. She looked at the water. She saw her reflection. She also saw something else. At the bottom of the pond, there was something shiny. It looked like a small golden key! "A key!" said Lily. "How did it get there?" She wanted to get it. But the water was deep. She thought. "Maybe I can use a stick," she said. She found a long stick. She put it in the water. But the key was too deep. She could not reach it. "What should I do?" she asked herself.`, choices:[{t:`Take off your shoes and wade in`,n:`s4`},{t:`Search around the pond`,n:`s5`}]},
 s3:{text:`Lily ran back to her house. She called her best friend, Sam. "Sam! Come quickly!" she shouted. "I found a magic garden behind my house!" Sam came running. He was excited. "A magic garden? Really?" he asked. "Yes! Come, I will show you!" said Lily. They went through the hole in the fence together. They walked into the garden. Sam was amazed. "Wow! This is beautiful!" he said. "I have never seen flowers like these." They walked together along the small path. They came to a clearing with a pond. The water was clear and blue. Around the pond, there were many flowers. "Look at this place!" said Sam. "It is like a fairy tale." Lily smiled. She was happy to share the garden with her friend.`, choices:[{t:`Explore the garden together`,n:`s2`},{t:`Look around the pond together`,n:`s5`}]},
 s4:{text:`Lily took off her shoes and socks. She carefully put her foot into the water. The water was cold. She felt the bottom with her foot. She could not find the key. She moved her foot around. Then she felt something hard. It was the key! She used her toes to pick it up. She lifted her foot out of the water. The key was in her hand. It was small and golden. It was beautiful. "I found it!" she shouted. She looked at the key. "But what does it open?" she wondered. She looked around. There was an old stone in the middle of the clearing. On the stone, there was a small hole. The hole looked like a keyhole. "Maybe the key opens this!" said Lily. She put the key in the hole. It fit! She turned it. Suddenly, there was a soft sound. The stone moved. Under the stone, there was a small box. Lily opened the box. Inside, there was a note. It said: "Welcome to the magic garden. You have found the key. Now the garden will always bloom for you." Lily smiled. She understood. The garden was magic. And now it was hers to enjoy.`, ending:true},
 s5:{text:`Lily decided to look around the pond. Maybe there were other interesting things. She walked around the pond. She looked at the flowers. They were very beautiful. Then she saw something. Behind a big bush, there was a small door. It was made of wood. It was old. On the door, there was a keyhole. "A door!" said Lily. "Maybe the key from the pond opens this door!" But she could not get the key from the pond. She thought. "Maybe I can find another way." She looked at the door. It was locked. She tried to open it. It would not move. She was sad. "I wish I could open this door," she said. Then she had an idea. She went back to the pond. She found a long, strong branch. She put it in the water. She moved it slowly. She tried to catch the key. After a few tries, she caught it! She pulled it out. It was a small golden key. She ran back to the door. She put the key in the keyhole. It fit! She turned it. The door opened slowly. Behind the door, there was a beautiful room. It was full of flowers and plants. In the middle, there was a small fountain. The water was clear. Lily smiled. "This is a magic place," she said. She went inside. She felt happy. She had found a secret garden room.`, ending:true},
},
quiz:[
 {q:`What did Lily find in the fence?`,o:[`A small hole`,`A big door`,`A window`],a:0},
 {q:`What did she see in the pond?`,o:[`A golden key`,`A fish`,`A coin`],a:0},
 {q:`What did the key open?`,o:[`A secret door or box`,`A house`,`A car`],a:0},
 {q:`Who did Lily meet in the garden?`,o:[`A boy named Max`,`A witch`,`An old man`],a:0},
 {q:`What did Lily learn?`,o:[`Friends are the best discovery`,`Gold is valuable`,`Gardens are boring`],a:0},
]
},

emoji:'🌳',title:'The Secret Treehouse',start:'s1',
segs:{
 s1:{text:`It was a sunny Saturday morning in the small town of Greenfield. The sun was shining brightly, and the sky was blue and clear. Leo and his sister Mia were sitting on the porch of their house. They were feeling bored. There was nothing interesting to do. "What can we do today?" Leo asked. He was ten years old, and he loved adventures. Mia thought for a moment. She was eight years old, and she was very smart. "Let's go to the forest behind our garden," she said. "We can look for interesting things there. Maybe we can find some animals or beautiful stones." Leo smiled. He liked the idea. "That sounds great!" he said. The two children put on their shoes and walked to the big old forest behind their house.

The forest was big and quiet. It was full of tall trees, and the sun made pretty shadows on the ground. The air smelled fresh and green. The children walked along a small path. They saw many interesting things. They saw a red squirrel running up a tree. They saw a butterfly with blue wings. They heard birds singing. Leo and Mia walked for some time. Suddenly, Leo stopped. "Look!" he said. He pointed to a very big, old tree. It was the biggest tree in the forest. It had a thick trunk and strong branches. And between the branches, there was a small, flat place, like a natural platform. "That tree is perfect for a treehouse!" Leo said. His eyes were shining with excitement. Mia looked up. She could see the branches. They were strong and thick. "Yes!" she said. "We can build a secret treehouse there. Nobody will see it from the road. It will be our secret place." The children felt very excited. They decided to build the best treehouse in the world. They ran home to tell their parents about their plan.`, choices:[{t:'Ask your parents for permission',n:'s2'},{t:'Build it in secret',n:'s3'}]},
 s2:{text:`Leo and Mia ran home and found their mother in the kitchen. She was making lunch. "Mom, can we build a treehouse in the big tree in the forest?" Leo asked. He was a little nervous. Their mother smiled. "That sounds like a great idea," she said. "But you must be careful. The tree is high, and you are still young. Ask your father to help you with the first steps. He knows how to build things." The children were very happy. They ran to find their father. He was in the garage, fixing his bicycle. "Dad, can you help us build a treehouse?" Mia asked. Their father thought for a moment. "I can help you," he said. "But you must promise to be careful. You must not climb too high. And you must always tell me where you are going." The children promised. Their father smiled and showed them how to use a hammer and a saw. He also gave them some old wooden boards. "You can use these," he said. "They are old, but they are strong. Be careful with the tools. Do not run with them." The children thanked him. They started to collect more materials. They found old ropes, nails, and a piece of strong cloth. They were ready to start their project. They felt very happy.`, choices:[{t:'Go build the treehouse',n:'s4'},{t:'Build a birdhouse instead',n:'s10'}]},
 s3:{text:`Leo and Mia decided to build the treehouse without telling their parents. They thought it would be a big surprise. They wanted to show their parents the finished treehouse. They took some tools from the garage: a hammer, a saw, and some nails. They also took an old blanket and some rope. The children went to the big tree. Leo climbed up first. He was a good climber. He moved carefully from branch to branch. He looked at the branches and said, "This place is perfect. We can put the floor here." Mia passed the boards up to him. Leo placed them on the branches. It was not easy. The boards were heavy, and the branches were high. Leo had to be very careful. He worked slowly.

After an hour, they had a small, flat floor. "Great!" Mia said. "Now we need walls." They worked together. Mia held the boards, and Leo fixed them with nails. They made three walls. The fourth side was open, so they could see the forest. They put the old blanket on top as a roof. The treehouse was small, but it was theirs. "We need a secret sign," Mia said. She drew a small star on the wall with a piece of chalk. "Now it is our secret place." They sat inside and looked at the trees. They felt very proud. They had built something with their own hands. "We must come here every day," Leo said. "Yes," Mia agreed. "This is our special place." They stayed there for a long time, looking at the forest and listening to the birds.`, choices:[{t:'Keep furnishing the treehouse',n:'s4'},{t:'Tell Mom and Dad the secret',n:'s11'}]},
 s4:{text:`The next day, Leo and Mia went back to their treehouse. They wanted to make it more comfortable. Leo brought a small old chair from the garage. Mia brought a little box with cookies and a bottle of water. They climbed up and sat inside. The treehouse looked nice. The sun came through the leaves, and the birds were singing. "I love this place," Mia said. "It is so quiet here. I can hear the wind in the leaves." Leo nodded. "We can come here every day after school," he said. "We can read books here. We can play games. We can just sit and talk." Mia smiled. "Yes," she said. "This is our place."

Suddenly, they heard a noise below. Someone was walking in the forest. The children looked at each other. "Who is there?" Leo asked quietly. They looked down and saw a boy about their age. He had red hair and a friendly face. He was looking at their treehouse with big eyes. "Wow!" the boy said. "Is this your treehouse? It is amazing!" Leo and Mia were surprised. They did not expect to see anyone in the forest. "Who are you?" Mia asked. "My name is Tom," the boy said. "I live in the blue house on the other side of the forest. I often walk here. I like to watch the animals. I saw your treehouse from the path. It looks wonderful." The children thought for a moment. Should they let Tom come up? Tom looked kind and friendly. He had a nice smile. "You can come up," Leo said. "But you must promise to keep it a secret. This is our secret treehouse." Tom smiled. "I promise!" he said. "I will not tell anyone." He climbed up carefully and sat with them. They ate cookies together and talked. Tom told them about the animals in the forest. He knew many interesting things. He knew where the rabbits lived. He knew the names of many birds. He could even imitate the sound of a cuckoo. The children were happy to have a new friend. They spent the whole afternoon together.`, choices:[{t:'Welcome Tom into the group',n:'s5'},{t:'Ask Tom to leave',n:'s6'}]},
 s5:{text:`Tom became a good friend of Leo and Mia. Every day after school, the three children met at the treehouse. They called it "The Secret Club." They made a secret password. Only they knew it. The password was "Green Star." To enter the treehouse, you had to say the password. They also made a flag with a star on it. They put the flag on the top of the treehouse. It was beautiful. The flag moved in the wind, and it looked very nice.

The children did many fun things together. They read books, played games, and told stories. Tom taught them how to recognize different birds by their songs. He showed them how to find animal tracks on the ground. Leo showed them how to make small toys from wood. He made a small boat and a little bird. Mia made a little garden in a box near the tree. She planted some flowers. Every day, she watered them. The flowers grew and became very beautiful. The treehouse became their favorite place in the world.

One day, Tom said, "I have an idea. Let's make a rope ladder. Then we can climb up and down more easily. It will be safer than climbing the branches." Leo and Mia liked the idea. They worked together. They found a strong rope and some small sticks. Tom tied the sticks to the rope. After two hours, the ladder was ready. Leo tested it. It was strong. He climbed up and down twice. "Wonderful!" Mia said. "Now we can invite our friends to visit us." But Leo shook his head. "No," he said. "This is a secret treehouse. Only the three of us can come here. That is the rule." Tom and Mia agreed. The secret was safe. They promised to never tell anyone about the treehouse.`, choices:[{t:'Continue the story',n:'s7'},{t:'Keep the secret forever',n:'s12'}]},
 s6:{text:`Leo looked at Tom and said, "Sorry, but this is our secret place. We don't want anyone else to know about it. It is just for our family." Tom's smile disappeared. He looked sad. "I understand," he said quietly. "I will not tell anyone. I promise." He turned and walked away. Mia felt bad. She looked at Leo. "Maybe we should have let him stay," she said. "He looked so sad." Leo thought for a moment. "Maybe you are right," he said. "But I am afraid he will tell other children. Then everyone will come here." The children sat in silence. The treehouse did not feel as happy as before. The afternoon was quiet, and the birds were not singing.

The next day, Leo and Mia went back to the forest. They saw Tom sitting under a tree not far from their treehouse. He was drawing something in a notebook. Mia walked to him. "Hi, Tom," she said. "What are you drawing?" Tom showed her the notebook. He was drawing the treehouse. It was a very good drawing. He had drawn every branch and every board. "I love this tree," Tom said. "I come here to draw. I draw the animals and the trees. This is my favorite place in the forest." Mia looked at the drawing. "It is a beautiful drawing," she said. "I am sorry about yesterday. We were wrong. You can come to our treehouse if you want. We want you to be our friend." Tom's face lit up. "Really?" he asked. "Yes," Leo said. "We want you to be our friend. You are kind, and you know many things about the forest." Tom was very happy. He climbed up with them, and they spent the whole afternoon together. They talked, laughed, and played. Tom showed them his drawings. Leo and Mia showed him their treehouse. The treehouse was not a secret anymore, but it was a place of friendship. And that was even better.`, choices:[{t:'Continue the story',n:'s7'},{t:'Form the Secret Club together',n:'s5'}]},
 s7:{text:`Weeks passed. The treehouse became stronger and more beautiful. The children added a small shelf for their books. They also made a little table from an old box. They put a small lantern inside for the evening. They found an old carpet and put it on the floor. The treehouse was their cozy home in the trees. It was warm and nice. The children spent many happy hours there.

One evening, a big storm came. The wind was very strong, and the rain was heavy. The thunder was loud. Leo and Mia were at home. They looked out of the window. "I hope our treehouse is okay," Mia said. She was worried. Leo looked worried too. "Me too," he said. "The wind is very strong. I hope the tree is strong enough." The storm lasted all night. The wind was howling, and the rain was hitting the windows. In the morning, the sun was shining again. The sky was blue and clean. The children ran to the forest to check their treehouse.

When they arrived, they saw that one wall of the treehouse had fallen down. The roof was also broken. Some boards were on the ground. The blanket was wet. "Oh no!" Mia cried. "Our treehouse is broken!" Her eyes were full of tears. Leo looked at the damage. "We can fix it," he said. "We have tools and materials. We can make it even better. Do not cry, Mia. We can do it." Mia felt a little better. "You are right," she said. "Let's start." They began to collect the boards. Soon, Tom came too. He saw the damage and said, "I will help you. We can fix it together. Three hands are better than two." The three friends worked hard. They fixed the wall and made a new, stronger roof. They also added a small window. Now the treehouse had a window with a view of the forest. The children were proud of their work. The treehouse looked better than before.`, choices:[{t:'Celebrate the repair',n:'s8'},{t:'Have a sleepover',n:'s9'}]},
 s8:{text:`After fixing the treehouse, the children decided to celebrate. They brought some lemonade and cookies. They also brought a small cake from Mia's mother. They sat inside the treehouse and looked at the forest. The sun was setting, and the sky was orange and pink. The birds were singing their evening songs. "This is the best day," Mia said. "We fixed our treehouse, and we have each other." Tom smiled. "I am happy to be your friend," he said. "You are the best friends I have ever had." Leo looked at his friends. "Me too," he said. "The treehouse is not just a house. It is our special place. It is a place where we are happy." The children made a promise. They promised to always take care of the treehouse and to always be friends. They promised to meet there every week, even when they grow up.

From that day on, the treehouse was their favorite place. They went there every day. They read books, played games, and watched the stars at night. They watched the sunsets. They listened to the birds. They told each other their secrets. The treehouse was a place of joy, friendship, and adventure. And it was their secret, too. The end.`, ending:true},
 s9:{text:`"Let's sleep in the treehouse tonight!" Leo said. Mia and Tom looked at each other. "Really?" Mia asked. Her eyes were big. "Yes!" Leo said. "We can bring sleeping bags and a flashlight. It will be a big adventure. We can look at the stars from the window." Tom was excited. "I will ask my parents," he said. "I think they will say yes." The children went home and asked their parents. Their parents agreed, but they said they must be careful. "The treehouse is strong now," Leo said. "We fixed it. It will be fine." Their parents smiled. "Okay," they said. "But be careful. And call us in the morning."

In the evening, the children came to the treehouse with sleeping bags, pillows, and a flashlight. They climbed up and made their beds. They put the lantern on the table. The treehouse looked cozy and warm. They talked, laughed, and told stories. Tom told a funny story about his cat. The cat always slept in his shoes. Mia told a story about a princess and a dragon. Leo told a story about a brave knight who saved a castle. They laughed a lot.

Then, they looked at the sky through the window. The stars were bright. The moon was big and round. "Look!" Mia said. "I see a shooting star!" She closed her eyes and made a wish. "What did you wish for?" Tom asked. "I can't tell you," Mia said. "It's a secret. If I tell you, it will not come true." They all laughed. Slowly, they fell asleep. The wind was soft, and the leaves were whispering. It was the most wonderful night of their summer. In the morning, they woke up to the sound of birds. The sun was warm. They felt happy and full of energy. "Let's do this again!" Leo said. "Yes!" his friends said. "Next week!" The treehouse became their place for many adventures. They slept there many times. They watched the stars. They told stories. They were the best of friends. The end.`, ending:true},
 s10:{text:`Leo and Mia looked at the tall tree. "It is very high," said Mia. "What if we fall?" Leo nodded. "Mom said to be careful. Maybe a treehouse is too dangerous." They decided to build a small birdhouse instead. Dad helped them hang it on a low branch. Every morning, birds came to visit. It was a small project, but it made them happy. They promised to build the treehouse when they were older.`, ending:true},
 s11:{text:`In the evening, Leo and Mia told their parents about the secret treehouse. At first, Mom and Dad were surprised. Then they were proud. "You built it yourselves? That is amazing!" said Mom. Dad climbed up and checked the treehouse. "It is well built," he said. "But you must always be careful up there." The children promised. Now the treehouse was not a secret anymore, but it was even better. They could share it with their family.`, ending:true},
 s12:{text:`The three friends never told anyone about the treehouse. For years, it was their hidden place. They grew up, but the memory stayed. Sometimes, when nobody was looking, they still climbed the old tree and sat inside. The treehouse held their best memories. And the secret made it magic.`, ending:true},
},
quiz:[
 {q:'Where did Leo and Mia want to build the treehouse?',o:['In their garden','In the forest behind their house','Near the school'],a:1},
 {q:'Who helped the children fix the treehouse after the storm?',o:['Their father','Tom','The teacher'],a:1},
 {q:'What did the children put on the roof of the treehouse?',o:['A blanket','A big piece of wood','A flag'],a:0},
 {q:'What did the children do in the treehouse?',o:['They did homework','They read books and played games','They watched TV'],a:1},
 {q:'What happened to the treehouse during the storm?',o:['It fell down completely','One wall fell down and the roof broke','Nothing happened'],a:1},
]
},
