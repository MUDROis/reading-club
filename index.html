segs:{
 s1:{text:`Maya and her older brother Leo had always suspected that the abandoned lighthouse on the cliff hid a secret, yet nobody in the village believed them. Old fishermen laughed at the idea. The baker shrugged. Even their grandmother said the lighthouse was just a ruined tower full of seagull nests. But Maya noticed things other people missed: the small light that sometimes flickered in the upper window on stormy nights, and the strange humming sound that came from the rocks when the wind blew from the sea.

"There is something alive in there," she whispered one evening. Leo rolled his eyes. "It is an old tower, Maya. Nothing lives there except spiders." "Then why does it hum?" she asked. Leo had no answer.

One stormy evening, when the wind howled like a wounded animal and the rain hammered against the windows, the humming grew louder than ever. Maya and Leo decided to investigate on their own. They took a flashlight, an old key ring, and a rope, and they walked along the cliff path in the dark. The lighthouse door was locked, but Leo found a broken side window. They climbed inside and started up the rusty spiral staircase, which creaked under every step. Dust filled their noses, and cobwebs brushed their faces. At the top, behind an old curtain, they found a trapdoor that seemed to have been recently opened. Beneath it, a narrow tunnel led to a hidden room full of dusty boxes and old maps. In the corner stood a strange machine with glowing buttons, humming quietly as if it were alive. The siblings exchanged a nervous glance, realising that their curiosity had just landed them in the middle of something far bigger than a childish game.`,
  choices:[{t:'Press the glowing button',n:'s2'},{t:'Look through the dusty boxes',n:'s3'}]},
 s2:{text:`Maya stepped closer to the machine. It was covered in brass dials and copper wires, and its glass front glowed with a soft blue light. "What do you think it is?" she asked. "I do not know," said Leo, "but it looks like a radio from an old ship." Maya's finger hovered over the biggest button. "Should we press it?" she whispered. Before Leo could answer, she pressed it. Leo grabbed her arm too late. The light on the machine pulsed once, twice, like the heartbeat of something waking up.

As soon as she did, a low rumble shook the entire tower, and the machine began to project a strange map onto the wall. The map showed the coastline with a red cross marking a spot deep beneath the sea, and numbers were blinking next to it. Leo realised that the machine was a kind of transmitter, sending a signal to some unknown receiver far away. "Maya, this thing is calling someone," he said slowly. "We have to stop it."

Suddenly, footsteps echoed from the tunnel below, and a gruff voice shouted something in a language they did not understand. Panic swept over them. Maya's heart pounded, and her hands felt cold. But then she noticed a small lever marked with the word "off" and reached for it without hesitation.`,
  choices:[{t:'Pull the lever and stop the signal',n:'s4'},{t:'Hide behind the crates and wait',n:'s5'}]},
 s3:{text:`Leo carefully opened the largest box and found a collection of old photographs showing the lighthouse from decades ago, with a young woman standing proudly beside it. She wore a long coat and held a lantern, and her face was kind but serious. "This must be the keeper," said Maya softly. "She looks like she loved this place."

Underneath the photos lay a leather-bound diary, its pages yellowed but still readable. The diary belonged to the woman, whose name was Clara, and she had been the lighthouse keeper for thirty years. Leo read a page aloud. Clara wrote about lonely winters, about the ships saved by her light, and about a valuable treasure she had hidden to protect it from smugglers. According to her notes, the treasure was buried in a cave that could only be reached at low tide, and the machine was actually a device that opened the cave's entrance.

"Listen to this," said Leo, reading faster. "The machine is not a radio at all. It sends a special signal that unlocks a hidden door in the cliff." Maya gasped, realising that the "strange machine" was not dangerous at all but the key to an incredible discovery. She looked at the diary, then at the humming machine, and her eyes grew wide. "Leo," she whispered, "we have to find that cave."`,
  choices:[{t:'Follow the diary\'s trail to the cave',n:'s6'},{t:'Tell the village about the treasure right away',n:'e4'}]},
 s4:{text:`Maya pulled the lever firmly, and the machine fell silent, plunging the room into darkness. The footsteps in the tunnel stopped abruptly, followed by confused murmurs and then retreating steps. The siblings waited in the dark for what felt like an eternity before daring to move. Their flashlight beam trembled across the dusty floor. "Do you think they are gone?" whispered Maya. "I hope so," said Leo.

They crept back down the tunnel, through the trapdoor, and down the spiral staircase, holding their breath at every creak. When they finally pushed open the heavy door and emerged into the stormy night, they froze. The coast guard was waiting outside, lights flashing, having been alerted by the strange signal. A tall officer stepped forward and shone a lamp into their faces. "What are you two doing here?" he asked sternly. Maya opened her mouth, but no words came out. Leo pulled her closer, his heart hammering against his ribs.`,
  choices:[{t:'Talk to the rescue officer',n:'s7'},{t:'Go home in silence',n:'e1'}]},
 s5:{text:`The siblings crouched behind the boxes, holding their breath as heavy boots climbed the stairs. The footsteps grew louder and louder, and dust fell from the ceiling. A tall man in a raincoat entered the room, water dripping from his hood. He walked straight to the machine and tapped its glass front. "Odd," he muttered. "The signal was interrupted." He checked the dials, pressed a few buttons, and shook his head. Then, to their relief, he did not look in their direction and left after a few tense minutes. His boots thumped back down the stairs, and soon the room was quiet again.

When the coast was clear, Maya and Leo crept out, their hearts pounding with relief. They peeked through the broken window and saw the man walking towards the beach with a radio in his hand. "He knew about the machine," whispered Leo. "Who is he?" Maya shook her head. They decided that the lighthouse held too many dangers for two curious kids and promised to return only with adults. But first, Maya wanted to see where the stranger was going.`,
  choices:[{t:'Follow the stranger to the beach',n:'s8'},{t:'Promise to come back only with adults',n:'e2'}]},
 s6:{text:`The next morning, the storm was gone and the sky was clear. At low tide, the siblings followed the diary's directions along the wet sand and past slippery black rocks. The sea had pulled back, leaving pools of clear water and strands of seaweed. "Clara wrote that the entrance looks like a whale's mouth," said Leo, checking the pages. They had to hurry, because the tide would not wait for them, and every minute mattered. The rocks were slippery, and more than once Maya almost fell into a cold pool of seawater.

After twenty minutes, they found it: a dark opening in the cliff, half-covered by seaweed and dripping with water. Maya switched on her flashlight, and they stepped inside. The cave smelled of salt and old stone, and the silence was deep and strange. Deeper in, behind a curtain of hanging moss, they saw a wooden chest with iron bands. It was ancient, half buried in sand. "We found it," breathed Maya. "We actually found it." They knelt beside the chest. The lock was rusted, but Leo hit it with a rock until it snapped. Slowly, carefully, they opened the lid.`,
  choices:[{t:'Open the chest in the cave',n:'s9'},{t:'Call the museum right away',n:'s10'}]},
 s7:{text:`The officer knelt so his face was level with theirs. "That machine upstairs is an old distress beacon," he said. "It belonged to a ship called the Sea Witch, which sank near this coast in 1906. The beacon was salvaged and mounted in the lighthouse as a memorial. For years it stayed silent. Tonight, the storm must have triggered it, and our station received its signal."

Maya remembered the red cross on the map. "And the red cross on the wall?" she asked. The officer smiled. "That is the exact place where the Sea Witch went down. The beacon shows it so rescue teams know where to search." Leo swallowed. "So we really called you here?" "You did," said the officer, "and you did the right thing by stopping the signal before it confused our crews. You acted bravely, kids." Maya and Leo exchanged a proud glance. "Would you like to see our rescue boat?" the officer asked.`,
  choices:[{t:'Agree to see the rescue boat',n:'s11'},{t:'Go home with the rescuers',n:'e1'}]},
 s8:{text:`The man walked quickly along the narrow path to a small cove, where a grey motorboat was tied to a rock. Maya and Leo hid behind a boulder and watched. The man climbed into the boat, picked up a radio, and spoke into it. "Lighthouse lamp room secure," he said. "It was a false alarm. The old auto-transmitter got stuck during the storm and started sending. Everything is fine now."

He listened for a moment, then laughed. "Yes, some kids probably broke in. Twelve-year-olds love mysteries. We will tell the village to keep an eye on the tower." The siblings looked at each other. Maya felt her face turn hot. "He knows about us," she whispered. The man started the engine, and the boat moved away across the grey water. Maya and Leo walked home slowly, feeling foolish but also relieved that nothing bad had happened.`,
  choices:[{t:'Tell your parents everything',n:'s12'},{t:'Quietly promise never to break in again',n:'e2'}]},
 s9:{text:`Inside the chest, gold coins glittered among silver cups, jewelled brooches, and rolls of old parchment. Maya picked up a coin and rubbed it on her sleeve. "These are incredibly old," she said. Leo unrolled one of the parchments. It was a list of cargo, written in faded ink, with the words "The Star of Lisbon" printed at the top. "This is from a trade ship," he said slowly. "A ship that disappeared over a hundred years ago."

They sat in the cave and read more documents. Clara's diary mentioned that the museum had searched for this lost cargo for decades. Maya looked at the glittering pile and felt her heart beat fast. A part of her wanted to take just one coin and hide it in her pocket. Another part knew that this treasure belonged to history, not to them. "We cannot keep any of this," she said at last. "It belongs to everyone." Leo nodded, though his eyes lingered on the gold.`,
  choices:[{t:'Leave everything and call the museum',n:'s10'},{t:'Take one coin as a souvenir',n:'s13'}]},
 s10:{text:`Maya ran back to the village while Leo stayed to guard the cave. She found the museum's phone number in the old telephone book and called the director, Mrs. Ortiz, who listened without interrupting. When Maya finished her story, there was a long silence. Then Mrs. Ortiz gasped. "The Star of Lisbon?" she said. "We have searched for that cargo for over a century!"

Within an hour, the director and two historians drove to the beach. They explored the cave, examined the chest, and carefully packed every coin and cup. Mrs. Ortiz turned to the children with shining eyes. "You have made one of the greatest discoveries in this region's history," she said. "The treasure is priceless. And because you called us instead of keeping it, you have shown true honesty." She invited them to the museum's grand opening of the new exhibition, where their names would be on a golden plaque.`,
  choices:[{t:'Agree to come to the exhibition opening',n:'e3'},{t:'Decline politely and stay out of the spotlight',n:'e5'}]},
 s11:{text:`The rescue boat was moored in the harbour — a sturdy orange vessel with ropes coiled neatly on the deck. The officer, whose name was Captain Reyes, showed them the radio room and the sonar screen. "Every mariner on this coast owes a debt to your lighthouse," he said. "Its keeper, Clara, once rowed out alone in a storm to save the crew of a sinking fishing boat. She was a hero." Maya looked at the calm sea and tried to imagine Clara rowing through the storm alone, her lantern swinging in the dark.

Maya felt a shiver of pride. "So the lighthouse was never haunted," she said. Captain Reyes laughed. "Only by the memory of brave people." As the sky cleared and the stars came out, Maya and Leo walked home along the cliff path with the captain's flashlight guiding them. They felt warm and happy. They had not found treasure or solved every mystery, but they had helped real heroes and learned the true story of their silent lighthouse.`,
  choices:[{t:'Say goodbye and go home',n:'e1'},{t:'Ask Captain Reyes to tell more about Clara',n:'e6'}]},
 s12:{text:`At home, Maya and Leo sat at the kitchen table and told their parents everything, from the humming machine to the man on the beach. Instead of scolding them, their father took a deep breath. "You were reckless," he said, "but you were also honest. That matters."

The next day, the harbour technician, whose name was Tom, knocked on their door with a toolbox. "You saved us a lot of trouble," he said with a grin. "If that old transmitter had kept sending, it could have confused real rescue calls." He showed the children how the machine worked, explaining that the lever they had pulled had simply disconnected the battery. "You did the right thing," Tom said. "But next time, call an adult before you break into lighthouses." Maya and Leo laughed and nodded. They helped Tom carry his tools down to his truck and waved as he drove away. That evening, they felt proud, wiser, and strangely peaceful.`,
  choices:[{t:'Help Tom and wave him off',n:'e2'},{t:'Ask Tom to show you the transmitter',n:'e7'}]},
 s13:{text:`That night, Maya could not sleep. The gold coin burned in her pocket like a small, heavy sun. She thought about the museum, about history, and about Clara's diary, which said that the treasure must always belong to the people. In the morning, she woke Leo early. "We have to give it back," she said. Leo groaned, but he understood.

They ran to the beach and found Mrs. Ortiz still packing the chest. Maya held out the coin, her face red. "I am sorry," she said. "I took this last night. I could not sleep. It belongs here." Mrs. Ortiz looked at the coin for a long moment. Then she smiled. "Honesty like yours is rarer than gold," she said. "Keep it. Not as treasure, but as a reminder that doing the right thing is its own reward." The children hugged her, and later, at the grand opening, everyone heard the story of the girl who returned the coin. Maya wore it on a string around her neck, and it reminded her every day how good it felt to be honest.`,
  choices:[{t:'Come to the exhibition opening',n:'e3'},{t:'Insist on returning the coin to the chest',n:'e8'}]},
 e1:{text:`The officer clapped Leo on the shoulder. "Tonight, you two did a grown-up's job," he said. "You stopped a false alarm before it wasted hours of rescue time."

The next week, the village council held a small ceremony at the lighthouse. Maya and Leo received a certificate of bravery, and the mayor announced that the old tower would be restored as a monument to the sea's heroes. The strange transmitter was carefully removed and placed in the harbour museum, where its story was told to visitors. The lighthouse, silent no more, stood above the village like a proud old friend. Maya and Leo often returned to climb its stairs and watch the sea. They learned that courage, honesty, and quick thinking can make ordinary kids into heroes. The adventure ended with a warm feeling of pride, knowing they had helped without even meaning to.`,
  ending:true},
 e2:{text:`Maya and Leo walked home with heavy, relieved hearts. Their parents noticed their pale faces and asked what had happened. The children told them everything, and their parents listened without anger. "You were brave," said their mother, "but you were also lucky. The sea and the cliffs are dangerous places at night." The siblings promised never to explore the lighthouse alone again.

A few days later, the village patrol began checking the tower, and the strange man in the raincoat turned out to be a harbour technician who reported that the old transmitter had simply been stuck. The secret of the silent lighthouse remained partly unsolved, but Maya and Leo had learned a valuable lesson about caution and patience. Sometimes, the bravest choice is knowing when to step back and ask for help. They slept well that night, glad that the adventure had ended safely.`,
  ending:true},
 e3:{text:`The grand opening of the museum exhibition was the happiest day of the summer. Maya and Leo stood beside Mrs. Ortiz as she cut the golden ribbon, and photographers took their picture for the local newspaper. The treasure of the Star of Lisbon glowed under glass, and a sign told the whole story of the silent lighthouse and the cave that hid the lost cargo.

The museum gave the siblings a small reward and a framed certificate, and their names were engraved on a plaque. The lighthouse, once silent and forgotten, became the most famous landmark in the region. Tourists came to see it, and the village opened a small café nearby. Maya and Leo were celebrated as clever young explorers, and every time they passed the lighthouse, they smiled, remembering the stormy night when curiosity led them to a real treasure.`,
  ending:true},
 e4:{text:`Maya and Leo rushed to the village square, waving the diary and shouting about the treasure. The villagers gathered, sceptical at first, but the evidence was too convincing to ignore. The diary's maps matched the cliffs exactly, and old Clara's name was known to the oldest residents. A team of divers and historians was assembled, and within a week they found the cave and the chest. The treasure turned out to be a collection of ancient artefacts from a sunken trade ship, and the whole village celebrated with a feast.

Maya and Leo were given the honour of cutting the ribbon at the new museum exhibit. They learned that sharing a discovery can bring a whole community together, and that generosity often brings greater rewards than secrecy. The lighthouse, now a tourist attraction, stood proudly above the village as a symbol of their adventure.`,
  ending:true},
 e5:{text:`Maya thanked Mrs. Ortiz but shook her head. "The treasure is its own reward," she said. "We don't need our names on a plaque." The children went home, and the exhibition opened without them. But the museum director did not forget. She named the exhibition hall "The Cave Readers" and hung a small sign thanking "two brave children from the village". Maya and Leo saw it from the street through the glass and smiled. Sometimes the quietest heroes are the ones who choose not to be seen.`, ending:true},
 e6:{text:`Captain Reyes laughed warmly. "Clara has a hundred stories," he said, and he told them about the winter she rowed through the storm to save the crew of the fishing boat, about the lantern she kept burning through the longest nights, and about how she trained every villager to read the weather. He even showed them a faded photograph of Clara on the tower stairs. Maya and Leo visited the harbour museum every weekend that summer, helping the curator label the old rescue equipment. By autumn, they knew more about the lighthouse than anyone in the village. And when the museum opened a small display about Clara, the plaque read: "Researched by Maya and Leo."`, ending:true},
 e7:{text:`Tom grinned and set his toolbox down. "Sure — let's see what you can learn." He explained the transmitter wire by wire, and by the end of the afternoon Maya could name every part. He gave them an old broken radio to take apart and rebuild. They fixed it by Friday. The harbour technician was so impressed that he invited them to the station's open day, where they showed visitors how a distress beacon works. Their parents beamed. "You turned a scary night into a useful skill," said their father. And Maya decided that somewhere deep inside, she wanted to be like Tom: someone who keeps the coast safe.`, ending:true},
 e8:{text:`Maya placed the coin back into the chest herself. "I want it to stay with the story," she said. Mrs. Ortiz studied her for a long moment and then smiled. "Then it will." At the opening, the coin glittered under the glass with all the others, and the plaque next to it read: "Returned by a girl who learned that honesty is its own treasure." Maya wore no coin around her neck, but she carried the lesson in her heart. Years later, when she became a historian, she often told the story of the girl who gave the gold back — and the museum curators always listened.`, ending:true},
},
quiz:[
 {q:'What did Maya and Leo find beneath the trapdoor?',o:['A hidden room with a strange machine','A treasure chest full of gold','A secret staircase to the beach'],a:0},
 {q:'Who wrote the diary found in the boxes?',o:['A young fisherman','The lighthouse keeper','A famous explorer'],a:1},
 {q:'Where was the treasure hidden according to the diary?',o:['In a cave that could only be reached at low tide','Under the lighthouse itself','In the village well'],a:0},
 {q:'Why did the coast guard come to the lighthouse on the stormy night?',o:['Because the old distress beacon sent a signal','Because the lighthouse was on fire','Because Maya called them on the phone'],a:0},
 {q:'What did the siblings receive from the museum for finding the treasure?',o:['A reward and an invitation to the grand opening','A new boat','Nothing at all'],a:0}
]
},
{
emoji:'🌲',title:'The Whispering Forest',start:'s1',
segs:{
 s1:{text:`Daniel was twelve years old, and every summer he visited his grandmother in her small wooden house at the edge of a vast, ancient forest. The house smelled of fresh bread and pine needles, and Daniel loved everything about it. His grandmother often told him that the forest was very old, much older than the village, and that it remembered things that people had long forgotten.
The forest was famous among the locals because of its strange whispering sounds. On quiet evenings, when the wind was still, you could hear soft voices coming from the trees, almost like a conversation far away. Some people said it was just the wind in the leaves. Others believed the trees themselves were talking to each other, sharing secrets that humans could not understand.
Grandmother always warned Daniel never to wander beyond the old oak tree at the edge of the woods. "The deep parts of the forest are enchanted," she would say. "They are beautiful, but they are also full of secrets. Stay close to the village, my boy."
One afternoon, Daniel went to collect mushrooms near the old oak. He found plenty of chanterelles under the fallen leaves and put them carefully into his basket. Then he noticed something strange: a narrow path he had never seen before, covered with soft green moss. Tiny mushrooms growing on the path glowed with a faint blue light, like little lanterns in the shade. Curiosity overwhelmed him, and despite his grandmother's warning, he decided to follow the path and see where it led.`, choices:[{t:'Follow the mysterious path',n:'s2'},{t:'Turn back and respect the warning',n:'s10'}]},
 s2:{text:`The path wound deeper into the forest, and the whispering grew louder with every step. Daniel felt as if the trees were watching him and talking about him in a language he almost understood. The moss was soft under his feet, and the air smelled like rain and wild honey.
After a while, Daniel saw a fox sitting on a fallen log, looking at him with calm, intelligent eyes. The fox did not run away. It tilted its head as if it were waiting for him to speak. Daniel stopped and stared. "Hello," he said quietly. "Are you real?"
The fox stood up, took a few steps along the path, and looked back at Daniel, as if inviting him to follow. The whispering of the forest seemed to grow softer, as if the trees were holding their breath. Daniel understood that he had to make a choice.
He could ask the fox about the whispering of the forest and learn its secrets. Or he could continue alone and discover the truth for himself. The path split into two directions. One led to a bright clearing, where Daniel could see the top of an enormous tree. The other followed the fox toward a sound he had not noticed before: the quiet sound of running water.`, choices:[{t:'Ask the fox about the forest whispers',n:'s3'},{t:'Go on alone to the clearing',n:'s4'}]},
 s3:{text:`Daniel followed the fox, and the animal led him to a quiet stream that ran between the old trees. The water was clear here near the shallow stones, but Daniel noticed strange dark patches floating on the surface, and the air smelled slightly bitter.
"Do you understand me?" Daniel asked the fox. The fox sat down, opened its mouth, and spoke in a soft, low voice. "I understand you, boy. I am one of the guardians of this forest, though not the greatest one. The whispers you hear are the voices of the trees. Today, they are speaking about you."
Daniel stepped back in surprise. "The trees are talking about me?"
"They are worried," said the fox. "They have watched you come closer to their heart. Our river is sick, and the forest is slowly losing its strength. Soon the whispers will stop forever, unless someone helps us."
"How can I possibly help?" Daniel asked.
"Go to the great tree in the clearing," said the fox. "It is the Guardian of the Forest. It will tell you what must be done. But if you want to see the truth with your own eyes, first look at the river downstream. See what the factory has done to our water."
The fox pointed its nose toward the direction of the strange sound. Daniel now had to decide: follow the fox to the clearing, or first go and look at the river with his own eyes.`, choices:[{t:'Follow the fox to the clearing',n:'s5'},{t:'First look at the river',n:'s6'}]},
 s4:{text:`Daniel chose to continue alone. The path led him through a thick grove of silver birches, and the whispering grew into a gentle, welcoming melody. Finally, he reached a large clearing where an enormous, ancient tree stood in the middle. Its trunk was wider than a house, its branches reached toward the sky like open arms, and its bark was covered with glowing symbols that pulsed like a heartbeat.
As Daniel approached, the ground trembled softly, and a warm, deep voice spoke from the tree. "Welcome, young visitor. I am the Guardian of the Forest. Few humans find their way to this clearing. You must have a kind heart, or the forest would not have let you pass."
Daniel swallowed and bowed his head. "The fox told me the forest is in trouble."
"It is true," said the Guardian. "A factory near the village has been poisoning our river. The water carries poison to our roots, and my children, the trees, are growing weak. The animals are thirsty, and many fish have died in the lower river."
"What can I do?" Daniel asked.
"I can give you a magical seed," said the Guardian. "If you plant it in the river's source, it will purify the water and heal the forest. But the task is serious, Daniel. You must promise to care for the river and to keep its secret."
Daniel had to decide. He could accept the seed right away and become the forest's helper. Or he could ask the Guardian for proof that the forest was really in danger.`, choices:[{t:'Accept the seed and help the forest',n:'s8'},{t:'Ask for proof',n:'e2'}]},
 s5:{text:`The fox led Daniel through the forest, telling him about the animals that lived there. "You will meet the deer family near the blueberry bushes," said the fox. "The hedgehog sleeps under the big rock. The owls watch from the tall pines. We all depend on the river, Daniel. We all drink from it."
Soon they reached the clearing with the enormous ancient tree. The fox bowed its head and sat down nearby, its tail curled around its paws. The tree spoke in its warm voice. "I have sent my friend the fox to guide you, Daniel. We know your name because the forest watches over all children who play at its edge."
"Is it true that the factory is poisoning the river?" Daniel asked.
"Yes," said the Guardian. "The factory makes paper, and it pours its waste into the water. For years, the forest has been drinking poison. I can give you a magical seed. If you plant it in the river's source, it will cleanse the water and save us all. But you must choose freely. No one, not even the forest, can force you to do this."
Daniel looked at the glowing symbols on the tree's trunk. He wanted to understand more about the factory and why it was hurting the forest. The Guardian seemed to read his thoughts and waited patiently for his answer.`, choices:[{t:'Accept the seed and help the forest',n:'s8'},{t:'Ask more about the factory',n:'s7'}]},
 s6:{text:`Daniel thanked the fox and followed the sound of water until the stream became a wider river. Then he saw the truth with his own eyes. The water here was dark and grey, and a thick foam floated on the surface. Near the bank, three fish lay dead, their silvery bodies dull and lifeless. A heron stood sadly at the water's edge, and it did not move even when Daniel came close.
"This is terrible," Daniel whispered. He knelt down and touched the water carefully. It felt warm and slimy. He understood now that the Guardian had not exaggerated. The river was sick, and the whole forest drank from it every day.
Daniel remembered the magical seed. If he planted it in the river's source, perhaps the water would become clear and clean again. But maybe he should first run home and tell his grandmother everything. She always knew what to do, and she would never laugh at his story.
The fox appeared beside him, silent as a shadow, and gently nudged his hand. "The choice is yours, boy," it said. "The forest trusts you. Whatever you decide, we will accept it."
Daniel looked from the grey water to the fox and felt the weight of the decision. The forest needed him, but so did his grandmother, who was waiting at home with warm tea and kind questions.`, choices:[{t:'Return to the Guardian for the seed',n:'s8'},{t:'Run home and tell grandmother',n:'s15'}]},
 s7:{text:`"Tell me about the factory," Daniel said to the Guardian. "Why does it hurt the forest?"
The Guardian sighed, and its symbols dimmed for a moment. "Many years ago, Daniel, the factory was small, and the river was strong. People made paper and built houses, and the forest gave them wood. It was a fair exchange between humans and nature. But the factory grew, and the pipes that carry its waste into the river became bigger and bigger. The owners forgot that the river is alive, just like the forest."
"Don't the people see what is happening?" Daniel asked.
"They see only money," said the Guardian softly. "But you, Daniel, can see beyond it. You can be the voice that the river does not have. The animals of the forest cannot speak to humans in their language. But you can carry our message."
Daniel felt a warm feeling growing in his chest. He wanted to help. He could take the magical seed and plant it in the river's source. Or he could run home first and ask his grandmother for advice. She always listened to him, and her stories about the forest were full of wisdom. The Guardian waited, its symbols glowing gently, as the evening shadows grew longer around them.`, choices:[{t:'Accept the seed',n:'s8'},{t:'Go home and ask for advice',n:'s15'}]},
 s8:{text:`"I will help you," Daniel said firmly. "Give me the seed."
The Guardian's trunk shimmered, and a small green seed fell into Daniel's open palm. It glowed softly, like a tiny star, and it was warm to the touch. "This seed comes from the first tree that ever grew in this forest," said the Guardian. "It contains the memory of pure water. Plant it in the source of the river, and it will grow into a healing tree whose roots will filter the poison."
Daniel closed his fingers around the seed and felt its warmth spread through his hand. "How do I find the source?"
"Follow the river upstream, against the current," said the Guardian. "It is a long walk through the pines, but the forest will protect you. And remember, Daniel: the seed must touch water within a day, or it will lose its magic forever."
Daniel nodded and put the seed carefully into his pocket, next to his heart. He could go straight to the river's source now, while the day was still bright and the path was clear. Or he could run home first and show the seed to his grandmother. Her house was not far away, and he wanted her to know about his wonderful adventure. The forest whispered around him, encouraging him to decide.`, choices:[{t:'Go to the river\'s source right away',n:'s12'},{t:'Show the seed to grandmother first',n:'s15'}]},
 s10:{text:`Daniel stopped at the very edge of the mysterious path. The glowing mushrooms blinked at him, as if inviting him to continue, but his grandmother's words echoed in his head: "Never wander beyond the old oak tree." He took a deep breath, turned around, and walked home, his heart beating fast.
The whispering faded behind him, and the forest seemed to grow quiet, almost sad. Daniel walked quickly through the familiar woods, his basket of mushrooms half full. When he entered the warm kitchen, his grandmother looked at his face and smiled knowingly. "You saw the path," she said. "And you chose to come back."
"How did you know?" Daniel asked, surprised.
"Because I saw it too, when I was your age," his grandmother said softly and sat down beside him. "I walked that same path once, on a summer afternoon just like this one. The forest spoke to me, and it offered me a choice, just as it offered one to you."
"What did you choose?" Daniel asked.
"I chose to come back, just like you," she said. "The forest tests the courage of those who enter it. Sometimes the wisest decision is to respect the unknown. The forest will remember that you listened."
That night, Daniel lay in bed feeling proud of his restraint, but he could not stop wondering about the glowing path. In the morning, he found a single glowing mushroom on his windowsill, as if the forest had left him a quiet thank-you.`, choices:[{t:'Plant the mushroom in the garden',n:'s13'},{t:'Return to the path the next day',n:'s14'}]},
 s12:{text:`Daniel walked upstream, following the river through the dense pines. The forest grew darker and cooler, but the path was clear, and the animals seemed to watch over him. Once, a deer crossed his path and paused, as if showing him the way. Another time, a squirrel threw a pinecone at him, and Daniel laughed out loud.
After an hour of walking, Daniel reached the source of the river: a clear spring hidden among grey rocks, where the water bubbled up from deep underground. The water here was still pure and cold, but Daniel knew that the poison would reach it soon if nothing changed.
He took the glowing seed from his pocket and knelt at the edge of the spring. Carefully, he pushed the seed into the soft mud at the bottom, right where the water began its long journey to the village. The moment the seed touched the water, it began to sprout. Green leaves unfolded before his eyes, and a small tree rose from the spring, its roots spreading through the water like silver threads.
The water began to sparkle, and the air smelled fresh and clean. Around Daniel, the forest rustled with relief, and the whispering turned into a joyful chorus. He watched the miracle with wide eyes, knowing that his task was done. Now he could return home and tell his grandmother the whole story. Or he could go to the factory and show the workers how beautiful the river could be when it was not poisoned.`, choices:[{t:'Go home and tell grandmother',n:'e1'},{t:'Go to the factory and show the clean river',n:'e6'}]},
 s13:{text:`Daniel carried the glowing mushroom carefully to his grandmother's garden and planted it near the sunflowers. To his astonishment, by the next morning the mushroom had grown into a beautiful, radiant flower with petals that shone like moonlight. It attracted butterflies, bees, and birds from all over the village. Within a week, the garden became the most magical place in the whole town.
Grandmother came out and looked at the flower with wonder in her eyes. "This is a gift from the forest," she said. "It is a sign that the forest has accepted your respect. It knows you chose wisdom over curiosity."
Daniel spent the rest of the summer sitting near the flower, listening to the distant whispers of the forest. He never entered the deep path again, but he often walked to the old oak tree and talked to the trees at the edge of the woods. He learned that sometimes the greatest adventures are the ones we choose not to take.
He could stay with his wonderful garden and enjoy its peace forever. Or he could return to the secret path one more time, to see if the forest had more surprises hidden for him. The flower seemed to glow a little brighter whenever he thought about the path.`, choices:[{t:'Keep the garden and enjoy the peace',n:'e3'},{t:'Return to the path',n:'s14'}]},
 s14:{text:`The next day, Daniel returned to the path. The glowing mushrooms were still there, blinking in the morning light, and the whispering of the forest welcomed him back. This time, he did not hesitate. He walked deeper and deeper, past the silver birches and the tall pines, until he reached the clearing with the enormous ancient tree.
"Welcome back, brave boy," said the Guardian of the Forest. "I was waiting for someone who had the courage to return. You respected our warning once, and now you have earned the right to learn our secrets."
"But I didn't do anything," Daniel said. "I was afraid."
"Courage is not the absence of fear," said the Guardian. "Courage is coming back despite it. I will entrust you with the magical seed that can heal our river. A factory upstream has been poisoning the water, and only this seed can save us."
Daniel took the glowing seed in his hand and felt its warmth. He could plant it in the river's source right away, following the Guardian's instructions. Or he could first return home and tell his grandmother that her grandson had spoken to the Guardian of the Forest and had been trusted with the forest's greatest treasure.`, choices:[{t:'Accept the seed and help the forest',n:'s8'},{t:'Thank the Guardian but leave the forest alone',n:'e4'}]},
 s15:{text:`Daniel ran home with the seed safe in his pocket, next to his heart. His grandmother was kneading dough in the kitchen when he burst through the door. "Grandmother! You won't believe what happened!" he shouted, out of breath.
He told her everything: the fox, the Guardian of the Forest, the sick river, the factory, and the magical seed. His grandmother listened quietly, her hands stopping their work. When he finished, she wiped her eyes and smiled. "So the Guardian has chosen you, Daniel. This is a great honour."
"You know about the Guardian?" Daniel asked in surprise.
"Oh yes," she said. "My grandmother told me the story when I was a girl. The Guardian appears only to those with pure hearts. And the seed is the forest's greatest treasure. When I was young, I walked to the source myself, but I was afraid to take the seed. I stepped back and let the forest choose another."
She looked at the seed, glowing in Daniel's hand. "Now I understand why I walked that path all those years ago. I was preparing the way for you, my dear. This evening, we will go to the source together. The forest has waited a long time for this moment."
That evening, grandmother and Daniel walked through the forest as the sun set. She held his hand, and the trees whispered around them like old friends. At the source of the river, they knelt together and planted the seed.`, choices:[{t:'Plant the seed together',n:'e5'},{t:'Plant the seed alone tonight',n:'e7'}]},
 e1:{text:`Daniel ran home as fast as he could, his heart singing with joy. He burst into the kitchen and told his grandmother everything: the fox, the Guardian, the magical seed, and the healing tree that now grew in the river's source.
His grandmother hugged him tightly, tears in her eyes. "I always knew you had a kind heart, Daniel," she said. "The forest chose well."
From that day on, the river became cleaner with every week that passed. The fish returned, the herons came back, and the whispering of the forest became a happy song. Daniel visited the Guardian every summer, and the tree in the spring grew tall and strong.
The villagers were amazed by the change in the river. They began to investigate the factory, and soon the factory installed filters and cleaned its pipes. Everyone in the village was grateful, and Daniel became known as the boy who talked to trees. He was proud, but he always said that the real heroes were the forest and the river, which never gave up.`, ending:true},
 e2:{text:`Daniel hesitated. "How do I know you are telling the truth?" he asked the Guardian. "The forest looks beautiful. Maybe the river is fine after all."
The Guardian did not answer with words. Instead, the glowing symbols on its trunk began to move, and images appeared in the air like living pictures. Daniel saw the river turning dark and grey. He saw fish gasping on the surface and ducks flying away from the poisoned water. He saw animals leaving the forest, carrying their babies to safer places. He even saw the factory pipes pouring thick black liquid into the river.
The last image showed the forest in winter: trees without leaves, silent, grey, and dead. Daniel felt his heart drop. "I believe you," he said quietly. "I'm sorry I doubted you."
"There is no shame in asking questions," said the Guardian gently. "A true helper checks the truth before acting. Will you take the seed now?"
"Yes," Daniel said. He took the glowing seed, ran to the river's source, and planted it in the cold, clear spring. The water began to sparkle at once, and the whispering of the forest changed into a joyful song. When he came home, his grandmother hugged him tightly. Later, the village noticed the clean river, investigated the factory, and forced it to install proper filters. Daniel became a local hero, and the forest sang its thanks to him for many years.`, ending:true},
 e3:{text:`Daniel chose to stay with his garden. Every morning he watered the radiant flower and watched the butterflies dance around it. Grandmother told him stories about the forest, and Daniel listened to the whispers from a distance, understanding them now as a gentle greeting.
One evening, the fox appeared at the garden fence. It looked at Daniel with its clever eyes and nodded, as if saying goodbye. Then it disappeared into the trees, and Daniel knew that the forest had blessed his choice.
Years passed. The flower never faded, and the garden became a legend in the village. People came to see it from other towns and even other countries. But Daniel always kept the secret: the flower was a gift from the whispering forest, a reward for respecting the unknown.
He grew up to be a gardener, and he taught every child in the village about nature. He often said that respect for nature is its own reward, and that some mysteries are better left untouched. The forest remained a friendly mystery for the rest of his life, and its whispers always sounded like a warm hello.`, ending:true},
 e4:{text:`Daniel bowed to the Guardian. "Thank you for trusting me," he said. "But I think I am not ready. My grandmother told me that the forest tests those who enter it, and I want to pass the test wisely. I will come back when I am older."
The Guardian's symbols glowed warmly. "That is a wise answer, Daniel. Patience is also a form of courage. The seed will wait for you."
Daniel returned home and told his grandmother everything. She smiled and hugged him. "You made the right choice, my boy. The forest will remember your respect."
Every year after that, Daniel returned to the path, but he never took the seed until he was sixteen. On that day, he planted it in the river's source and saved the forest. He became the forest's official protector and visited the Guardian every year, learning the secrets of the trees. The whispering never frightened him again, for he understood that it was the forest's way of speaking to those who truly listened.`, ending:true},
 e5:{text:`Together, Daniel and his grandmother planted the magical seed in the river's source. As the water touched the seed, a warm light spread across the spring, and a small tree rose from the water with silver leaves. The river sparkled, and the forest sighed with relief.
Grandmother laughed with joy, and Daniel saw tears on her cheeks. "I have waited fifty years to see this moment," she whispered. "Thank you, Daniel. You finished what I was too afraid to start."
The news of the miracle spread through the village. People came to see the shining tree, and soon everyone knew about the factory's poison. The village united and demanded changes. The factory installed filters, and the river healed completely.
Every year after that, Daniel and his grandmother visited the healing tree together. The tree grew tall, and its silver leaves whispered stories to anyone who listened. Daniel learned that sometimes the bravest thing we can do is share our adventure with the people we love. The forest, the river, and his grandmother became the closest friends of the boy who saved the whispering forest.`, ending:true},
 e6:{text:`Instead of going home, Daniel walked straight to the factory at the edge of the village. It was a large grey building with tall chimneys, and a pipe poured dark water into the river below Daniel's little healing tree.
Daniel found the manager in his office and told him the whole story. At first, the manager laughed and said that boys should not tell fairy tales to busy men. But Daniel did not give up. He took the manager to the river, showed him the sparkling clean water near the spring, and then walked with him downstream, where the water turned dark and poisonous right below the factory's pipe. The manager went pale.
"That water is killing the forest," Daniel said quietly. "But look how clean it becomes when it is not poisoned."
The manager studied the river for a long time. Then he called his engineers and ordered them to build a water treatment plant. Within a year, the factory's waste was clean, and the river recovered completely. The forest flourished, and the whispers became a grateful song. Daniel received a special award from the village, and the factory's director became one of the biggest supporters of the forest. Daniel had saved the forest twice: once with the seed, and once with the truth.`, ending:true},
 e7:{text:`That night, Daniel slipped out alone, holding the warm seed tight in his pocket. He knew the way — past the old oak, along the whispering path, up the stream to the source. At the spring, he knelt and pushed the seed into the soft mud. It sprouted at once, silver leaves unfolding in the moonlight. When he came home, his grandmother was waiting at the kitchen table with two cups of tea. "I knew you would go," she said calmly. "And I am proud of you. The forest chose well." Daniel hugged her. The river healed, the village cleaned the factory, and every year Daniel returned to the silver tree — but the first planting, alone under the stars, remained his most secret and sweetest memory.`, ending:true},
},
quiz:[
 {q:'Why was the forest famous among the locals?',o:['For its glowing mushrooms','For its strange whispering sounds','For its tall oak trees'],a:1},
 {q:'What did the Guardian of the Forest give Daniel?',o:['A golden key','A magical seed','A map of the forest'],a:1},
 {q:'What is poisoning the river in the story?',o:['The factory\'s waste','The old oak tree','The farmer\'s cows'],a:0},
 {q:'Who guided Daniel to the clearing on his first walk?',o:['A white rabbit','A friendly fox','An owl'],a:1},
 {q:'What did Daniel\'s grandmother do when she was a child?',o:['She walked the same path but was afraid to take the seed','She cut down a tree','She worked at the factory'],a:0}
]},

emoji:'⏰',title:'The Clever Clockmaker',start:'s1',
segs:{
 s1:{text:`In the old town of Berton, where the roofs were red and the streets smelled of fresh bread, there lived a young clockmaker named Felix. His small workshop stood near the market square, and its window was always full of beautiful clocks. People came from far away to admire them. Felix could make a clock that chimed like birdsong and another that played a tiny melody every hour. He was the most talented clockmaker in the entire region. Yet Felix was poor. The wealthy mayor of Berton always found a reason to pay him less than his work was worth. "Times are hard, Felix," the mayor would say with a smile, and he would take another masterpiece for almost nothing.

One autumn morning, the mayor climbed onto a wooden platform in the market square and made a grand announcement. A competition! Whoever could build a clock that never lost a single second in a whole year would win a fortune and the title of Royal Clockmaker. The crowd gasped. Felix knew this was nearly impossible, for even the best clocks gained or lost a few seconds each day. But his eyes lit up. He walked home slowly, thinking. He spent months studying the stars, the tides, and the movements of the sun, searching for a way to make time perfectly accurate. Then one night, an idea came to him like a flash of lightning.`,
  choices:[{t:'Build a clock based on the sun and stars',n:'s2'},{t:'Try to find a clever way to win',n:'s3'}]},
 s2:{text:`Felix decided to build a clock that would be corrected by nature itself. Every morning, he sat on his roof with a notebook, watching the sun rise and set. He drew diagrams of shadows at different hours. He learned how the sun's path changed with the seasons. The clock he designed had a brass face, silver hands, and a hundred tiny gears. On top of it sat a small sundial, connected to the mechanism by a clever system of levers. When the sun shone, the sundial's shadow told the true time, and the clock corrected itself silently. At night, Felix added a second correction: a dial that used the position of the North Star through a thin glass tube. It was a marvel of engineering. The gears adjusted automatically, and a glass dome protected the delicate parts from rain. It took Felix three months to finish. He polished every wheel, oiled every spring, and tested the clock for days. "If nature shows me the truth," he said, "my clock will never lie." Now he had to decide: should he test the clock in the square first, or take it straight to the competition?`,
  choices:[{t:'Test the clock in the town square',n:'s4'},{t:'Take the clock straight to the competition',n:'s5'}]},
 s3:{text:`For a week, Felix thought about cheating. He had heard stories of clockmakers who hid small electric motors inside their clocks. Such clocks never lost a second because they were not really clocks at all. "If the mayor pays unfair prices," Felix whispered one evening, "why should I play fair?" He even drew a plan of a clock with a hidden battery. But then he looked at his hands, covered with oil and brass dust, and remembered why he had become a clockmaker. A clock is a promise, he thought. It tells people the truth about time. If I build a lie, I will become like the mayor. Felix tore up the plan. "No," he said firmly. "Honesty is more important than winning. I will build the most honest clock I can."

That very day, a boy knocked on his door. His name was Leo, and he was twelve years old. He had watched Felix work for months through the window. "Please, sir," Leo said, "teach me to make clocks. I want to make things that are true." Felix smiled. He had never had an apprentice before. He looked at the boy's bright eyes and said, "You may stay, Leo. But you must promise to always tell the truth about your work." Leo nodded seriously.`,
  choices:[{t:'Work together with Leo',n:'s6'},{t:'Build the clock alone',n:'s7'}]},
 s4:{text:`The next day was bright and clear. Felix carried his new clock to the market square and placed it on a stone table. The townspeople gathered around, curious. Children stopped playing to watch the silver hands move. Old Mrs. Petrov brought her own pocket watch to compare. For five hours, the clock was perfect. At noon, the sundial on top cast a shadow exactly on the twelve, and the clock chimed twelve times. The crowd cheered. But as evening came, clouds covered the sky. The sundial could not see the sun, and the clock began to drift. By midnight, it was eleven seconds slow. Felix sighed and sat down beside his creation. "The sun is not enough," he admitted. "I need the stars too." He remembered his studies of the North Star, and an idea grew in his mind. He could add a special window in the clock's case, so that at night the star's light would guide a tiny pointer. It would be difficult, but Felix loved difficult things.`,
  choices:[{t:'Adjust the clock by the stars',n:'s8'},{t:'Leave the clock as it is',n:'s9'}]},
 s5:{text:`Felix decided not to waste any more time. The competition was only a week away, and his clock was already the finest he had ever made. He packed it carefully in a wooden case lined with velvet and carried it to the town hall on the day of the contest. When he saw the other competitors, his heart beat faster. Some had huge clocks with golden eagles on top. Others had tiny watches in crystal boxes. And in the centre of the hall stood the mayor's clock, tall and magnificent, sparkling with jewels. Felix swallowed. "May the best clock win," he said quietly. "And may the truth win too."`,
  choices:[{t:'Take part in the competition',n:'s10'},{t:'Test the clock in the square first',n:'s4'}]},
 s6:{text:`Leo proved to be a wonderful helper. He was small but quick, and his fingers could hold the tiniest screws without trembling. Felix taught him how to clean brass wheels with vinegar and salt, how to cut springs from steel wire, and how to listen to a clock's heartbeat with a wooden stethoscope. They worked from sunrise to sunset. Leo asked a thousand questions, and Felix answered every one. Sometimes they laughed so loudly that the neighbors knocked on the wall. The clock they built together was simple and strong. It had no tricks and no secrets. Every gear was visible through the glass back, so anyone could see how it worked. "This is the most honest clock in the world," said Leo proudly. Felix put his hand on the boy's shoulder. "No," he said. "It is the most honest clock because it was made by honest hands. Yours and mine." On the last evening, they polished the clock together, and Leo fell asleep on a pile of soft rags, dreaming of towers full of clocks.`,
  choices:[{t:'Take the honest clock to the competition',n:'s12'},{t:'Go to the competition with Leo',n:'s10'}]},
 s7:{text:`Felix worked alone, as he always had. He loved the quiet of his workshop, the smell of oil and metal, the soft ticking of a dozen clocks on the walls. He built his honest clock carefully, piece by piece. For weeks, he did not open the door for anyone. He ate bread and cheese at his workbench and slept only a few hours each night. The clock grew under his hands like a living thing. He gave it a case of warm walnut wood and a face like the moon. It was not the most beautiful clock in the town, and it was not the most accurate. But it was completely open. Anyone could open its back and see every gear, every spring, every screw. "If someone wants to know if I cheated," Felix said to himself, "they only need to look." He finished the clock late one night, wound it, and listened. Tick-tock. Tick-tock. It sounded like an honest heartbeat.`,
  choices:[{t:'Take the honest clock to the competition',n:'s12'},{t:'Test it in the square first',n:'s4'}]},
 s8:{text:`Felix spent three nights on the roof of his workshop, studying the stars through an old brass telescope. He marked the position of the North Star at different hours and compared it with the ticking of his clock. Then he built a small brass tube into the side of the clock's case. Through this tube, a thin beam of starlight fell on a tiny silver disc. When the disc turned, it nudged a lever, and the clock corrected itself by a second or two. It was a delicate system, and Felix broke it twice before it worked. "The stars never lie," he said, tightening the last screw. "If the sun hides behind clouds, the night sky will still tell the truth." He tested the clock for a whole week, day and night. In the morning, the sundial corrected it. At night, the stars corrected it. At the end of the week, the clock had lost only a fraction of a second. Felix smiled and hugged the clock like an old friend. "You are ready," he said. "Tomorrow, we go to the competition."`,
  choices:[{t:'Take the clock to the competition',n:'s10'},{t:'Test it in the square first',n:'s4'}]},
 s9:{text:`Felix decided not to touch the clock again. It was good and honest, and he was proud of it. "A clock cannot be perfect," he said. "But it can be true." He cleaned the glass dome, polished the brass, and checked that every wheel was oiled. Then he wrapped the clock in a soft cloth and placed it in a wooden box. On the morning of the competition, he put on his best coat, combed his hair, and carried the box to the town hall. He was nervous, but he held his head high. Whatever happened, he had built his clock with honor. No one could take that away from him.`,
  choices:[{t:'Take the clock to the competition',n:'s10'},{t:'Test it in the square first',n:'s4'}]},
 s10:{text:`The great hall of the town hall was full of people. The judges sat at a long table, wearing serious faces. There were three of them: a scholar with round glasses, a merchant with a gold chain, and an old lady who had once been a court astronomer. One by one, the competitors presented their clocks. The crowd oohed and aahed at every shiny machine. Then the mayor stepped forward with a grand smile. His clock was the tallest in the hall, covered with silver and blue enamel. It showed the phases of the moon, the days of the week, and even the names of the stars. "My clock," announced the mayor, "is powered by the newest science. It will never lose a second." Finally, it was Felix's turn. He placed his modest clock on the table and opened its glass back. "Here are all the gears," he said. "Anyone can see how it works. It corrects itself by the sun and, when the sun is hidden, by a memory of the stars." The judges nodded and examined it closely. Then the mayor raised his hand. "Your honours," he said, "a true test of accuracy must be fair. Let all clocks be judged in the dark chamber, where no clock can cheat by seeing the sun!" The crowd murmured. The judges agreed. The clocks were carried into a dark room with no windows. Felix's heart sank. Without the sun, his clock would be helpless.`,
  choices:[{t:'Prove the mayor\'s clock is a fake',n:'s11'},{t:'Demand the test in daylight',n:'s16'}]},
 s11:{text:`While the judges watched the clocks through a small window, Felix slipped closer to the mayor's tall clock. He had noticed something strange. The clock was silent. Every real clock ticks, but the mayor's clock made no sound at all. Felix touched the cold silver case and found a small seam, almost invisible. Carefully, he opened it. Inside there was no mechanism, no gears, no springs. Instead, there was a tiny electric motor and a hidden battery, glowing softly green. Felix gasped. The mayor's clock was not a clock at all. It was a machine, like a toy, that pretended to be a clock. Felix closed the case quickly. His heart was beating fast. He had proof, but what should he do with it? He could show the battery to the judges right now, in front of everyone. Or he could speak to the mayor privately first, to give him a chance to confess honestly.`,
  choices:[{t:'Expose the mayor in front of everyone',n:'e1'},{t:'First talk to the mayor alone',n:'e2'}]},
 s12:{text:`The day of the verdict arrived. The judges prepared to announce the winner. Everyone believed it would be the mayor. His clock had not lost a second in the dark chamber, while Felix's clock had slowly fallen behind. The mayor smiled and straightened his coat. Suddenly, the lights flickered. There was a loud buzz, and then the hall went dark. The electricity had gone out across the whole town. In the darkness, people cried out in surprise. Then a voice said: "Listen!" And everyone heard it. Tick-tock. Tick-tock. A steady, calm sound came from Felix's simple clock, which kept ticking as if nothing had happened. The mayor's magnificent clock was silent. Dead. Its hidden electric motor had stopped with the power. When the lights came back, the judges gathered around the mayor's clock. They opened its jewel-covered doors. Inside there was no mechanism, only wires and a battery. The mayor hung his head. "I confess," he whispered. "I wanted to win so badly that I built a lie." The hall erupted. Felix stood quietly, looking at his honest clock, which was still ticking on the table.`,
  choices:[{t:'Demand the mayor\'s disqualification',n:'e3'},{t:'Offer to fix the mayor\'s clock',n:'e4'}]},
 s16:{text:`Felix stepped forward and cleared his throat. "Your honours," he said, "I ask for a fair test in the light of day. My clock is corrected by the sun. The sun is not a trick; it is the oldest clock in the world. Let the clocks be judged in the market square, in the open air, where everyone can see them." The crowd cheered. The judges exchanged glances and nodded. The clocks were carried out into the square. The sun was bright. Felix's clock caught the light, and the little sundial on top swung into position, correcting the mechanism with a soft click. The mayor's clock, however, began to behave strangely. It had been wound with a key, but in the sunlight its hands started to quiver, and then they stopped entirely. The mayor turned pale. "It... it needs darkness," he stammered. The old astronomer stepped close and opened the mayor's clock. Inside lay the battery and the motor. The crowd gasped. The truth was out.`,
  choices:[{t:'Wait for the judges\' decision',n:'e5'},{t:'Demand the mayor\'s disqualification',n:'e3'}]},
 e1:{text:`Felix walked to the judges' table and opened the mayor's clock wide. Everyone saw the battery and the little motor. "This is not a clock," Felix said calmly. "It is an electric toy disguised as a clock. It never loses a second because it is not measuring time at all." The scholar gasped. The merchant turned red. The old astronomer laughed and shook her head. The mayor tried to explain, but the evidence was undeniable. The judges disqualified him on the spot. Then they turned to Felix. "The winner," announced the old astronomer, "is Felix the Clockmaker, whose clock was corrected by the sun and the stars, and whose hands are clean." The crowd exploded with joy. Felix received a heavy bag of gold coins and the golden medallion of the Royal Clockmaker. His workshop became famous across the land. People came from distant cities to buy his clocks. And every evening, Felix sat by his window, listening to his clocks tick, and thanked the stars for guiding him. He learned that cleverness is valuable, but honesty is priceless. True victory comes from doing the right thing.`,
  ending:true},
 e2:{text:`Felix waited until the hall was empty, then he tapped the mayor on the shoulder. The mayor flinched. "I know about the battery," Felix said quietly. The mayor's face went white. "Please," he begged, "don't tell anyone. I only wanted to win. I've spent all my money on that clock." Felix sighed. "You can still save your honour," he said. "Confess yourself, before I have to do it for you." The mayor trembled, then nodded. At the next meeting of the judges, the mayor stood up and confessed everything. He showed them the battery and the motor with his own hands. The judges were astonished, but they respected his confession. The mayor was fined and stripped of his title, but he was not thrown in prison, because he had told the truth at last. Felix was declared the winner. Later, the mayor came to Felix's workshop. "Teach me," he said sadly, "to build real clocks. I have been a fool." Felix smiled and handed him a file. "Every master was once a fool," he said. "Let's begin." The town of Berton remembered this story for a hundred years: the clockmaker who won not by being clever, but by being kind.`,
  ending:true},
 e3:{text:`Felix looked at the silent, dead clock of the mayor and raised his hand. "Your honours," he said loudly, "the mayor has deceived us all. His clock was powered by a hidden motor, not by craftsmanship. He must be disqualified." The judges agreed. The mayor was publicly shamed, forced to pay a heavy fine, and his fake clock was placed in the town museum with a sign: "A Warning Against Dishonesty." Children came to laugh at it on school trips. Felix was crowned Royal Clockmaker, and his honest clocks became famous across the kingdom. He used his fortune to open a school for young craftsmen, where he taught boys and girls that true skill comes from hard work and honesty. Every year, on the anniversary of the competition, he gathered his students in the square and told them the story of the battery that lied. The town of Berton prospered, and Felix's legacy lived on for generations. "The best clock," Felix often said, "is not the one that is most accurate. It is the one that is true to its maker's heart."`,
  ending:true},
 e4:{text:`Instead of pointing a finger, Felix walked calmly to the mayor's clock. He opened its doors, removed the silent battery and the whining motor, and laid them on the table. Everyone stared. "These are not parts of a clock," Felix said. "They are parts of a lie." Then he did something nobody expected. He took tools from his pocket and began to work. He replaced the motor with a real mechanism of gears and springs, which he had brought from his workshop. He adjusted the balance wheel, oiled the bearings, and fitted a proper pendulum. For two hours, the hall watched in silence. When he finished, he wound the clock. Tick-tock. Tick-tock. The mayor's clock was alive, a real clock at last. The mayor fell to his knees. "I am ashamed," he wept. "I built a lie, and you turned it into the truth." He confessed everything before the judges. The judges declared Felix the winner, and, by Felix's request, they made the mayor his apprentice. Felix taught the mayor the craft of honest clockmaking, and the two became unlikely friends. The town learned a powerful lesson about forgiveness and second chances. And the mayor's clock, now true, hung in the town hall for centuries, ticking honestly, reminding everyone that even a lie can become the truth when a good heart touches it.`,
  ending:true},
 e5:{text:`The old astronomer raised the battery above her head. "This," she said, "is why the mayor's clock never lost a second. It was not a clock. It was a machine that pretended to be one." The crowd shouted in anger, then in joy. The mayor was disqualified, and Felix's clock, corrected by the sun in the open square, had kept perfect time all day. The judges measured it again under the stars that night, and it lost less than a second. Felix won the fortune and the title of Royal Clockmaker. The mayor, humbled, came to Felix a week later with a humble gift: a box of rare brass gears, the best money could buy. "Make great clocks with these," he said, "and forgive me." Felix forgave him. He built a new clock with the mayor's gears and placed it in the town hall, where it chimed every hour, a gift to the people of Berton. And that is how the young clockmaker taught the whole town that the sun and the stars never lie, and neither should we.`,
  ending:true},

function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function annotateText(text,level){
  const dict=DICT[level]; if(!dict)return text;
  const words=Object.keys(dict); if(!words.length)return text;
  words.sort((a,b)=>b.length-a.length);
  const re=new RegExp('\\b('+words.map(escRe).join('|')+')\\b','gi');
  return text.replace(re,m=>{
    const ru=dict[m.toLowerCase()];
    return '<span class="dict-word" data-ru="'+ru+'">'+m+'</span>';
  });
}

function countWords(t){return t.replace(/[^A-Za-z']/g,' ').split(/\s+/).filter(Boolean).length;}
function readMin(words){return Math.max(1,Math.round(words/120));}
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function loadMyWords(){try{return JSON.parse(localStorage.getItem('readerMyWords')||'[]');}catch(e){return [];}}
function saveMyWords(w){localStorage.setItem('readerMyWords',JSON.stringify(w));}
function addMyWord(word,level){
  word=(word||'').trim().toLowerCase();
  if(!word)return;
  const w=loadMyWords();
  if(!w.find(x=>x.word===word)){w.push({word:word,level:level});saveMyWords(w);}
}
function storyDictHtml(story,level){
  const dict=DICT[level]||{};
  const text=Object.values(story.segs).map(g=>g.text).join(' ');
  const words=Object.keys(dict).filter(k=>new RegExp('\\b'+escRe(k)+'\\b','i').test(text));
  let h='<div class="card dict-card" style="text-align:left"><h3>📖 Словарь истории</h3>';
  if(words.length){
    h+='<ul class="dict-list">';
    words.forEach(k=>{h+='<li><b>'+k+'</b> — '+dict[k]+'</li>';});
    h+='</ul>';
  }else h+='<div style="color:var(--soft)">В этой истории нет сложных слов.</div>';
  const mine=loadMyWords();
  if(mine.length){
    h+='<h4 style="margin-top:12px">⭐ Мои слова</h4><ul class="dict-list">';
    mine.forEach(x=>{const ru=(DICT[x.level]&&DICT[x.level][x.word])||'';h+='<li><b>'+x.word+'</b>'+(ru?' — '+ru:'')+'</li>';});
    h+='</ul>';
  }
  h+='</div>';
  return h;
}

let voices=[];

if(window.speechSynthesis){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;}
let speaking=false;
function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  const en=voices.find(v=>v.lang.toLowerCase().startsWith('en'));
  if(en)u.voice=en;
  u.rate=0.85;u.pitch=1.05;
  window.speechSynthesis.speak(u);
  speaking=true;
}
function stopSpeak(){
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  speaking=false;
}

  stories.forEach(s=>{totalW+=countWords(Object.values(s.segs).map(g=>g.text).join(' '));});
  const totalM=readMin(totalW);
  let html='<div class="card"><h2>Истории уровня '+lv.label+'</h2>';
  html+='<div class="level-time">🕒 Чтение всех историй уровня ≈ '+totalM+' мин · Квизы ≈ '+stories.length+'–'+(stories.length*2)+' мин</div>';
  stories.forEach((s,i)=>{
    const mins=readMin(countWords(Object.values(s.segs).map(g=>g.text).join(' ')));
    html+=`<button class="story-item" data-i="${i}">
      <span class="story-emoji">${s.emoji}</span>
      <span class="story-info">
        <span class="story-title">${s.title}<span class="badge ${lv.badge}">${lv.label}</span></span>
        <span class="story-meta">≈ ${mins} мин · выбор · квиз</span>
      </span>
      <span style="color:var(--soft)">→</span>
    </button>`;
  });
  html+='</div>';
  appEl.innerHTML=html;
  appEl.querySelectorAll('.story-item').forEach(b=>{
    b.onclick=()=>{
      state.story=+b.dataset.i;state.seg=STORIES[state.level][state.story].start;
      state.view='read';render();
    };
  });
}

/* ===== Режим чтения с выбором ===== */
function renderRead(){
  const story=STORIES[state.level][state.story];
  const seg=story.segs[state.seg];
  const lv=LEVELS.find(l=>l.id===state.level);
  const fsCls=state.font==='big'?'big':(state.font==='small'?'small':'');
  const ttsBtn=speaking?'<button class="tts-btn playing" id="tts">⏹ Остановить</button>'
                      :'<button class="tts-btn" id="tts">🔊 Слушать</button>';

  let body=`<div class="story-text ${fsCls}">${annotateText(seg.text,state.level)}</div>`;

  if(seg.ending){
    body+=`<div class="ending-box">
      <div class="end-title">🏁 Конец истории</div>
      <div style="margin-top:8px">Ты сам выбрал, как всё закончилось!</div>
      <div style="margin-top:14px"><button class="btn primary" id="quizBtn">📝 Пройти квиз</button></div>
    </div>`;
  }else{
    body+='<div style="margin-top:16px">';
    seg.choices.forEach((c,i)=>{
      body+=`<button class="choice-btn" data-c="${i}">${c.t}</button>`;
    });
    body+='</div>';
  }

  appEl.innerHTML=`
    <div class="card">
      <div class="reading-head">
        <button class="btn" id="back">← Назад</button>
        <span class="story-title">${story.emoji} ${story.title}<span class="badge ${lv.badge}">${lv.label}</span></span>
      </div>
      <div class="toolbar">
        <div class="tts-bar">${ttsBtn}<span class="tts-note">английский голос</span></div>
        <div class="fs-group">
          <button class="fs-btn" id="fsSmall" title="Меньше">A−</button>
          <button class="fs-btn" id="fsNormal" title="Обычный">A</button>
          <button class="fs-btn" id="fsBig" title="Больше">A+</button>
          <button class="fs-btn" id="addWord" title="Добавить слово в словарь">➕ Слово</button>
        </div>
      </div>
      ${body}
    </div>`;

  $('#back').onclick=()=>{stopSpeak();state.view='list';render();};
  $('#tts').onclick=()=>{
    if(speaking){stopSpeak();render();}
    else{speak(seg.text);render();}
  };
  $('#fsSmall').onclick=()=>{state.font='small';render();};
  $('#fsNormal').onclick=()=>{state.font='normal';render();};
  $('#fsBig').onclick=()=>{state.font='big';render();};
  $('#addWord').onclick=()=>{
    const w=prompt('Какое слово добавить в мой словарь?');
    if(w&&w.trim()){addMyWord(w,state.level);alert('Слово «'+w.trim()+'» добавлено в словарь.');}
  };
  bindDictWords(appEl);

  appEl.querySelectorAll('.choice-btn').forEach(b=>{
    b.onclick=()=>{
      const c=seg.choices[+b.dataset.c];
      stopSpeak();state.seg=c.n;render();
    };
  });
  const qb=$('#quizBtn');
  if(qb)qb.onclick=()=>{stopSpeak();state.view='quiz';state.qidx=0;state.score=0;render();};
}

/* ===== Квиз ===== */
function renderQuiz(){
  const story=STORIES[state.level][state.story];
  const quiz=story.quiz;
  const q=quiz[state.qidx];
  const lv=LEVELS.find(l=>l.id===state.level);

  if(state.qidx>=quiz.length){
    const stars=state.score===quiz.length?'⭐⭐⭐':(state.score>=Math.ceil(quiz.length/2)?'⭐⭐':'⭐');
    appEl.innerHTML=`
      <div class="card" style="text-align:center">
        <div class="story-title">${story.emoji} ${story.title}<span class="badge ${lv.badge}">${lv.label}</span></div>
        <div class="quiz-score"><div class="stars">${stars}</div>
          Ты ответил правильно на ${state.score} из ${quiz.length}</div>
        <button class="btn primary" id="again">🔁 Пройти ещё раз</button>
        <button class="btn" id="lst" style="margin-left:8px">К списку историй</button>
      </div>
      ${storyDictHtml(story,state.level)}`;
    $('#again').onclick=()=>{state.qidx=0;state.score=0;render();};
    $('#lst').onclick=()=>{state.view='list';render();};
    return;
  }

  const order=shuffleArr(q.o.map((_,i)=>i));
  let opts='';
  order.forEach(oi=>{
    opts+=`<button class="choice-btn quiz-opt" data-i="${oi}">${q.o[oi]}</button>`;
  });

  appEl.innerHTML=`
    <div class="card">
      <div class="reading-head">
        <button class="btn" id="back">← Назад</button>
        <span class="story-title">${story.emoji} ${story.title}<span class="badge ${lv.badge}">${lv.label}</span></span>
      </div>
      <div class="quiz-progress">Вопрос ${state.qidx+1} из ${quiz.length}</div>
      <div class="quiz-q">${q.q}</div>
      ${opts}
      <div id="quizMsg" style="margin-top:12px;font-weight:600"></div>
    </div>`;

  $('#back').onclick=()=>{state.view='read';state.seg='e1';render();};

  appEl.querySelectorAll('.quiz-opt').forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.i;
      const correct=i===q.a;
      if(correct)state.score++;
      appEl.querySelectorAll('.quiz-opt').forEach(x=>x.disabled=true);
      if(correct){b.classList.add('correct');$('#quizMsg').textContent='✅ Верно!';}
      else{
        b.classList.add('wrong');
        const good=appEl.querySelectorAll('.quiz-opt')[q.a];
        good.classList.add('correct');
        $('#quizMsg').textContent='❌ Неверно.';
      }
      setTimeout(()=>{state.qidx++;render();},1400);
    };
  });
}

/* ===== Рендер ===== */
function render(){
  renderLevels();
  if(state.view==='list')renderList();
  else if(state.view==='read')renderRead();
  else if(state.view==='quiz')renderQuiz();
}

render();
</script></body></html>
