emoji:`🐶`,title:`The Lost Puppy`,start:`s1`,
segs:{
 s1:{text:`Emma was a girl of nine years old. She lived in a small town with her mother, her father, and her older brother, Tom. Their house was near a big park, and Emma loved to go there after school.

One sunny afternoon, Emma was walking home from school. She was thinking about her homework and about the cake her mother was making for dinner. Suddenly, she heard a small, sad sound. It was like a little cry, very quiet, very soft.

Emma stopped and listened. The sound came from behind a big bush near the path. She walked carefully to the bush and looked behind it. There, on the grass, was a little puppy. It was very small, with brown and white fur. Its eyes were big and sad. The puppy looked cold and hungry. It was shaking a little.

"Oh, you poor little thing!" Emma said softly. She sat down on the grass next to the puppy. The puppy looked at her and made a small, sad sound again. It was afraid, but it did not run away.

Emma looked around. The park was quiet. There were no people near. She looked at the puppy again. It had no collar, no name tag. It was alone.

"Where is your home?" Emma asked. The puppy just looked at her with its big, sad eyes.

Emma thought. She could not leave the puppy here alone. It was too small and too young. It could be hungry, and it could be cold at night. But what could she do? She did not know where the puppy lived. She did not know who its owner was.

Emma took off her jacket and put it around the puppy. The puppy felt warmer and stopped shaking. It looked at Emma and licked her hand.

"I will help you," Emma said. "I will find your home."`, choices:[{t:`Take the puppy home`,n:`s2`},{t:`Search the park for the owner`,n:`s3`}]},
 s2:{text:`Emma picked up the puppy carefully. It was very light and very warm. The puppy put its head on her arm and closed its eyes. It was tired.

Emma walked home quickly. She opened the door and called, "Mom! Look what I found!"

Her mother came from the kitchen. She saw the puppy in Emma's arms and smiled. "Oh, what a sweet little puppy! Where did you find it?"

"In the park, behind a bush," Emma said. "It was alone and cold. It has no collar. I think it is lost."

Her mother looked at the puppy. The puppy looked back at her with its big, sad eyes. "It is very young," her mother said. "It is maybe two or three months old. We must find its owner. But first, let us give it some food and water."

Emma put the puppy on a soft blanket in the kitchen. Her mother gave it a bowl of water and some food. The puppy drank and ate quickly. It was very hungry.

After the puppy ate, it felt better. It started to play with Emma's shoes. Emma laughed. "You are a funny little puppy!" she said.

"We must put up a sign," her mother said. "We can write that we found a puppy. People will see it and call us."

"And we can ask our neighbours," Emma said. "Maybe someone knows this puppy."

Emma's mother made a big sign with a picture of the puppy. She put the sign near the park. Emma asked her neighbours, but nobody knew the puppy. Nobody had lost a puppy.

The day passed. The puppy slept a lot. It was very tired. Emma watched it and smiled. She liked the puppy very much. But she knew that somewhere, someone was looking for it.

In the evening, Emma's brother Tom came home. He saw the puppy and was very happy. "A puppy! Can we keep it?" he asked.

"No," their mother said. "We must find its owner. It is not our puppy."

Tom was sad. But he helped Emma play with the puppy. The puppy was very funny. It ran after a ball and fell over its own legs. Everyone laughed.

The next morning, Emma went to the park again. She wanted to ask more people about the puppy. She took the puppy with her. Maybe someone would see it and say, "Oh, that is my puppy!"

Emma sat on a bench near the park. The puppy sat next to her. People walked by and looked at the puppy. Some people smiled. Some people said, "What a cute puppy!" But nobody said, "That is my puppy."

After an hour, Emma was tired. She wanted to go home. But then, she saw a girl. The girl was walking and looking around. She looked sad. She was calling something. Emma listened.

"Pip! Pip! Where are you?" the girl called.

Emma's heart jumped. Pip? The puppy next to her lifted its head. It heard the name. It started to wag its tail.

Emma stood up. "Excuse me!" she called. "Are you looking for a puppy?"

The girl ran to Emma. She saw the puppy and her face became happy. "Pip!" she cried. "Pip, there you are!"

The puppy jumped from the bench and ran to the girl. It licked her hands and jumped up and down. The girl laughed and cried at the same time. "I looked for you everywhere!" she said. "I was so worried!"

Emma smiled. She was happy for the girl. But she was also a little sad. She liked the puppy very much.

"Where did you find him?" the girl asked.

"In the park, behind a bush," Emma said. "He was alone and cold. I took him home and gave him food."

"Thank you! Thank you so much!" the girl said. "Pip ran away yesterday. I looked for him all day and all night. I was so afraid."

"I am happy I found him," Emma said.

The girl smiled. "My name is Lily. What is your name?"

"Emma."

"Emma, you are the best. You saved my puppy. Can I give you something?"

Emma shook her head. "No, I do not need anything. I am happy that Pip is home."

Lily smiled. "Can we be friends?" she asked.

"Yes!" Emma said happily.

The two girls walked home together. Pip ran next to them, happy and full of energy. Emma was happy too. She found a new friend, and she helped a lost puppy go home.`, choices:[{t:`Grow up and become a veterinarian`,n:`s8`},{t:`Stay best friends with Lily`,n:`s9`}]},
 s3:{text:`Emma decided to look for the puppy's owner in the park first. She put the puppy inside her jacket to keep it warm. The puppy was quiet and calm. It seemed to trust Emma.

Emma walked around the park. She looked at every person. She asked everyone she met, "Excuse me, did you lose a puppy?"

People looked at the small brown and white puppy. They smiled. But everyone said, "No, it is not my puppy."

Emma walked to the playground. There were many children there. She asked the children about the puppy. But nobody knew it.

Then Emma saw an old man sitting on a bench. He was feeding birds. Emma went to him and asked, "Excuse me, sir. Did you lose a puppy?"

The old man looked at the puppy. His eyes became sad. "No, my child," he said. "I did not lose a puppy. But I see that this little one is lost. You are a good girl to help it."

Emma smiled. "Thank you. I will find its home."

"I hope you do," the old man said. "A puppy needs a home and a family."

Emma walked on. She asked more people. She looked in every corner of the park. But nobody knew the puppy.

After two hours, Emma was tired. She sat on a bench and looked at the puppy. The puppy was sleeping in her jacket. It was warm and safe.

"What should I do now?" Emma asked herself. "I cannot leave you alone. But I cannot find your owner."

Emma thought. Then she had an idea. "I will take you home," she said. "My mother will know what to do."

Emma stood up and walked home. The puppy slept all the way. It was very tired.

When Emma came home, her mother saw the puppy. "Oh! Where did you find this little one?" she asked.

"In the park, behind a bush," Emma said. "It was alone. I asked everyone, but nobody knows it. Can we keep it for a while?"

Her mother looked at the puppy. The puppy opened its eyes and looked at her. Her mother smiled. "Of course we can keep it for a while," she said. "But we must try to find its owner."

Emma's mother made a sign with a picture of the puppy. She put the sign near the park. Emma also told her friends and neighbours about the puppy.

That evening, the puppy played with Emma and Tom. It was very funny. It ran after a ball and fell over its own legs. Everyone laughed. The puppy was happy. It seemed to like its new home.

But Emma knew that somewhere, someone was looking for the puppy. She hoped the owner would see the sign.

Two days passed. Nobody called. Emma started to think that the puppy would stay with them forever. She was happy about it. She loved the puppy very much.

But on the third day, the doorbell rang. Emma opened the door. A girl stood there. She looked sad and tired.

"Hello," the girl said. "I saw your sign. I think you found my puppy."

Emma's heart jumped. "Your puppy? What is its name?"

"Pip," the girl said. "He is small, with brown and white fur. He ran away three days ago."

Emma looked at the girl. Then she looked at the puppy. The puppy was playing in the living room. It heard the girl's voice and ran to the door. It started to bark and jump.

"Pip!" the girl cried. She picked up the puppy and hugged it. The puppy licked her face and wagged its tail. It was very happy.

Emma smiled. She was happy for the girl. But she was also a little sad. She liked the puppy very much.

"Thank you so much," the girl said. "My name is Lily. I looked for Pip everywhere. I was so worried."

"I am happy I found him," Emma said.

Lily smiled. "Can we be friends?" she asked.

"Yes!" Emma said happily.

The two girls talked for a long time. Lily told Emma about Pip. Pip was a gift from her grandmother. He was only three months old. He ran away when the door was open.

"I am so happy he is safe," Lily said. "Thank you for taking care of him."

"It was fun," Emma said. "He is a very good puppy."

Lily smiled. "Maybe you can come and visit us sometime. You can play with Pip."

"I would love that!" Emma said.

The girls said goodbye. Lily walked home with Pip in her arms. Emma watched them go. She felt happy. She helped a lost puppy find its home, and she found a new friend.`, choices:[{t:`Stay friends with Lily forever`,n:`s9`},{t:`Grow up and become a veterinarian`,n:`s8`}]},
 s8:{text:`Emma grew up. She never forgot about Lucky and how she found him. She always remembered the day when she heard the small, sad sound behind the bush.

Emma became a veterinarian. She helped animals every day. She helped dogs, cats, rabbits, and even birds. She loved her job very much.

Lucky was old now. He was not a puppy anymore. But he was still Emma's best friend. He slept next to her bed. He followed her around the house. He was always there.

One day, Emma was walking in the park. She saw a small puppy behind a bush. It was alone and cold. It looked just like Lucky when she found him.

Emma smiled. She picked up the puppy. "Do not worry, little one," she said. "I will help you find your home."

The puppy licked her hand. It knew it was safe.

Emma found the puppy's owner. It was a little girl who was crying in the park. The girl was so happy to see her puppy. She hugged Emma and thanked her many times.

Emma walked home. She felt happy. She helped another lost puppy. She remembered how she felt when she found Lucky. It was the best feeling in the world.

When Emma came home, Lucky was waiting at the door. He was old, but his tail still wagged fast. Emma petted him.

"I helped a lost puppy today, Lucky," she said. "Just like I helped you."

Lucky looked at her with his old, kind eyes. He seemed to understand.

Emma sat down next to Lucky. She thought about everything. She found a lost puppy, and she got a best friend. She helped many animals, and she became a veterinarian. She helped people, and she made many friends.

"You know, Lucky," Emma said. "You changed my life. If I did not find you, I would not be who I am today."

Lucky put his head on her leg. He was happy.

Emma smiled. "Thank you for being my best friend, Lucky. I love you."

And Lucky wagged his tail. He loved Emma too. He loved her very much.

The end.`, ending:true},
 s9:{text:`Emma and Lily stayed best friends for many years. They went to the same school. They did homework together. They played with Pip and Lucky in the park.

When they grew up, Emma became a veterinarian. Lily became a teacher. They lived in the same town. They still met in the park every week.

Pip and Lucky were old now. But they were still happy. They walked slowly, but they still wagged their tails. They still loved to be together.

One day, Emma and Lily were sitting on a bench in the park. Pip and Lucky were sleeping next to them. The sun was warm. The birds were singing.

"Do you remember when we met?" Lily asked.

"Yes," Emma said. "I found Pip behind a bush. He was alone and cold."

"And I was so worried," Lily said. "I looked for him everywhere. Then I saw your sign."

"And we became friends," Emma said.

"Yes," Lily said. "And we are still friends. After all these years."

Emma smiled. "I am happy I found Pip," she said. "If I did not find him, I would not have met you."

"And I am happy you found him too," Lily said. "You saved my best friend. And you became my best friend."

The two friends sat in silence. They watched the puppies sleep. They were happy.

"You know," Emma said. "Helping others is the best thing in the world. It brings you good things. It brings you friends. It brings you happiness."

"Yes," Lily said. "You are right. And you are the best helper I know."

Emma laughed. "Thank you. But I just do what is right."

"And that is why you are wonderful," Lily said.

The sun went down. Emma and Lily stood up. The puppies woke up. They wagged their tails.

"Let us go home," Emma said. "Lucky is hungry."

"Pip is hungry too," Lily said. "He is always hungry."

The friends laughed. They walked home together, with their old puppies next to them.

Emma looked at the sky. It was orange and pink. It was beautiful.

"Thank you, Lucky," she said quietly. "Thank you for everything."

Lucky looked at her and wagged his tail. He was happy. He was home.

The end.`, ending:true},
},

emoji:'🖌️',title:'The Magic Paintbrush',start:'s1',
segs:{
 s1:{text:`Leo loved to draw. He drew every day. He drew animals, people, houses, and trees. His drawings were good. But Leo wanted to draw better. He wanted his drawings to be alive. "If my drawings could move," he thought, "that would be amazing." One day, Leo was walking in the park. He saw an old man sitting on a bench. The old man had a small box. In the box, there was a paintbrush. It was old and simple. But it looked special. "Hello, boy," said the old man. "Do you like to draw?" "Yes, I do!" said Leo. The old man smiled. "Take this paintbrush," he said. "It is a gift. Use it well." Leo took the paintbrush. "Thank you!" he said. The old man smiled and walked away. Leo looked at the paintbrush. It was just a paintbrush. But Leo felt that it was special. He went home. He wanted to try it.`, choices:[{t:'Draw your cat',n:'s2'},{t:'Draw a flower',n:'s3'}]},
 s2:{text:`Leo had a cat named Tom. Tom was a big, orange cat. Leo decided to draw Tom. He took the magic paintbrush. He dipped it in yellow paint. He drew Tom's body. Then he drew Tom's head. He drew Tom's ears. He drew Tom's tail. He drew Tom's eyes. When he finished, he looked at the drawing. It was good. But then, something amazing happened. The drawing moved! Tom in the drawing blinked. Then he meowed. Then he jumped out of the paper! He was a real cat! Leo could not believe his eyes. "Tom!" he shouted. "You are alive!" The new Tom looked at Leo. He meowed. He was exactly like the real Tom. Leo was happy. But then he thought. "Wait," he said. "Now I have two cats!" The real Tom came into the room. He saw the new Tom. He hissed. The new Tom hissed back. They started to fight! Leo did not know what to do. "Stop! Stop!" he shouted. But the cats did not stop. Leo had an idea. He took the paintbrush. He drew a big dog. The dog jumped out of the paper. It barked loudly. The cats got scared and ran away. Leo laughed. The magic paintbrush was very powerful.`, choices:[{t:'Draw something else',n:'s4'},{t:'Try drawing something different',n:'s5'},{t:'Draw a garden for Grandma',n:'s7'}]},
 s3:{text:`Leo decided to draw a flower. He took the magic paintbrush. He dipped it in red paint. He drew a beautiful red flower. When he finished, the flower moved. It grew. It became a real flower! It was big and beautiful. It smelled nice. Leo was amazed. "It is a real flower!" he said. He touched it. The petals were soft. Leo was happy. He drew more flowers. He drew yellow flowers, blue flowers, and purple flowers. Soon, his room was full of flowers. They were all real. They were beautiful. Leo smiled. "This is wonderful!" he said. But then he thought. "If I can draw flowers, I can draw anything. I can help people with this." He wanted to use the magic paintbrush to do good things. He decided to draw food for hungry people. He drew bread, fruit, and vegetables. They became real. He gave them to people in need. The people were happy. Leo was happy too. He felt good. He was using the magic paintbrush to help others.`, choices:[{t:'Keep helping people',n:'s6'},{t:'Thank the old man',n:'s8'}]},
 s4:{text:`Leo wanted to test the paintbrush more. He drew a bird. The bird came alive. It flew around the room. Leo drew a fish. The fish came alive. It swam in a bowl. Leo drew a tree. The tree came alive. It grew in his room. Leo was having fun. But then, he drew something bad. He drew a monster. It was big and scary. The monster came alive! It was angry. It started to break things in Leo's room. Leo was scared. "Oh no!" he shouted. "What have I done?" The monster was big. It was strong. Leo did not know what to do. He thought fast. He took the paintbrush. He drew a big cage. The cage came alive. It fell on the monster. The monster was trapped! Leo was safe. He looked at the monster. "I am sorry," he said. "I should not have drawn you." He took the paintbrush. He drew a big eraser. The eraser came alive. It erased the monster. The monster disappeared. Leo's room was clean again. Leo learned a lesson. "I must be careful with the paintbrush," he said. "I must only draw good things." From that day on, Leo was very careful. He only drew things that helped people. He drew houses for people who had no homes. He drew clothes for people who were cold. He drew food for people who were hungry. People loved Leo. They called him "the boy with the magic paintbrush." Leo was happy. He used his gift to make the world better.`, ending:true},
 s5:{text:`Leo decided to be careful with the magic paintbrush. He did not want to make mistakes. He drew only simple things. He drew a sun. The sun came alive. It shone in his room. He drew a rainbow. The rainbow came alive. It appeared in the sky. Leo was happy. But he was still careful. He did not draw anything dangerous. One day, Leo's friend Anna came to visit. She saw the magic paintbrush. "What is that?" she asked. "It is a magic paintbrush," said Leo. "Anything I draw becomes real." Anna did not believe him. "Really?" she said. "Draw something for me." Leo drew a butterfly. The butterfly came alive. It flew around the room. Anna was amazed. "It is true!" she said. "This is amazing!" Leo smiled. "But I must be careful," he said. "I only draw good things." Anna nodded. "That is a good idea," she said. Leo and Anna played together. Leo drew toys for them. He drew a ball. The ball came alive. They played with it. He drew a kite. The kite came alive. They flew it. It was a wonderful day. Leo was happy. He had a magic paintbrush and a good friend. He knew that with great power comes great responsibility. He promised to always use the paintbrush for good.`, ending:true},
 s6:{text:`Leo continued to help people. He drew food for the hungry. He drew clothes for the poor. He drew houses for the homeless. People were grateful. They thanked Leo. Leo was happy. But one day, a greedy man saw the magic paintbrush. His name was Mr. Greed. He wanted the paintbrush for himself. "Boy," he said. "Give me that paintbrush." "No," said Leo. "It is mine. And I use it to help people." Mr. Greed was angry. "Give it to me!" he shouted. He tried to take the paintbrush. Leo ran away. Mr. Greed ran after him. Leo ran to the park. He hid behind a tree. Mr. Greed was looking for him. Leo thought. "I must do something," he said. He took the paintbrush. He drew a big wall. The wall came alive. It appeared between Leo and Mr. Greed. Mr. Greed could not pass. He was angry. "Let me through!" he shouted. Leo drew a door in the wall. The door opened. Mr. Greed went through. But behind the door, there was a big hole. Mr. Greed fell into the hole. He could not get out. "Help! Help!" he shouted. Leo looked at him. "If you promise to be good," said Leo. "I will help you." Mr. Greed promised. Leo drew a ladder. The ladder came alive. Mr. Greed climbed out. He was dirty and tired. "Thank you," he said. "I am sorry. I will not try to take your paintbrush again." Leo smiled. "Good," he said. From that day on, Mr. Greed was a good man. He helped people too. And Leo continued to use the magic paintbrush to make the world a better place.`, ending:true},
 s7:{text:`Leo wanted to show the paintbrush to his grandmother. Grandmother Rosa lived nearby. She loved her garden. Leo decided to draw her garden as a gift. He took the brush. He dipped it in green paint. He drew the grass. He drew the flowers. He drew the trees. He drew the little gate. When he finished, the paper began to glow. The garden came to life! It grew out of the paper. It filled his room. There were roses, tulips, and sunflowers. A small bee buzzed among the flowers. Leo laughed. "Grandma will love this!" he said. Grandma Rosa came to visit. She saw the garden. She was amazed. "Is this real?" she asked. "Yes!" said Leo. "The paintbrush makes my drawings real." Grandma smiled. Then she sighed. "If only I had my silver brooch," she said. "It was my mother's. I lost it years ago. It had a blue stone. It is gone forever." Leo had an idea. "I can draw it for you!" he said. But Leo had never seen the brooch. He did not know what it looked like. "I will try," he said. He drew a round brooch with a blue stone. It became real. But it was not right. It was too big. The stone was the wrong color. Grandma shook her head. "That is not my brooch," she said. Leo was sad. He had failed. But then he remembered. Grandma had a photograph of her mother. The brooch was in the photo. Leo asked to see the photo. Grandma brought it. Leo looked at the small brooch in the picture. He studied it carefully. He drew again. This time, he drew exactly what he saw. The little brooch became real. It was perfect. Grandma's eyes filled with tears. "This is my mother's brooch," she whispered. "Thank you, Leo." Leo learned something important. You must know exactly what you want to draw. A picture must come from the heart.`, choices:[{t:'Help others find lost things',n:'s9'},{t:'Learn what the symbols mean',n:'s10'}]},
 s8:{text:`Leo wanted to thank the old man. He went back to the park. He looked for the old man. He was not on the bench. Leo walked around the park. He looked near the pond. He looked near the playground. He could not find him. Leo felt sad. He sat on the bench. Then, he saw something. There was a small envelope on the bench. It had Leo's name on it. Leo opened it. There was a letter inside. "Dear Leo," the letter said. "I knew you would come back. I am old, and I travel a lot. But I will see you again one day. Remember: the paintbrush is a gift. Use it with care. Draw what you see in your heart. Do not draw for money or fame. Draw to bring joy. Yours, the old man." Leo read the letter twice. He put it in his pocket. He felt warm inside. He wanted to learn more about the magic paintbrush. He wondered how it worked. He wondered why the old man chose him. He looked at the paintbrush. There were small symbols on it. Leo had never noticed them before. He looked closely. There was a star. There was a moon. There was a heart. What did they mean?`, choices:[{t:'Learn what the symbols mean',n:'s10'},{t:'Learn why the old man chose you',n:'s12'}]},
 s9:{text:`After that day, Grandma Rosa told everyone about Leo's gift. People came to Leo with their problems. A farmer came. His cow had run away. Leo drew a picture of the cow. The cow appeared next to the farm. A woman came. She had lost her wedding ring. Leo drew the ring from a photo. The ring appeared on the table. Leo helped everyone. He felt proud. But one evening, a man came to Leo's house. He was tall and thin. He wore a dark coat. He smiled, but his eyes were cold. "Boy," he said. "I heard about your paintbrush. I want you to draw me a mountain of gold." Leo was surprised. "Gold?" he said. "Why do you need gold?" The man laughed. "Because I am poor," he said. But Leo saw the man's fancy watch. He saw his shiny shoes. The man was not poor. He was greedy. Leo remembered what the old man had told him. "I only draw good things," Leo said. The man got angry. "Draw me the gold!" he shouted. Leo shook his head. The man tried to grab the paintbrush. Leo held it tight. He ran outside. The man chased him. Leo reached the park. He hid behind a tree. He thought fast. He drew a big, friendly dog. The dog jumped out of the paper. It barked at the man. The man was scared. He ran away. Leo laughed. He felt safe. He learned that the paintbrush must never be used for greed.`, choices:[{t:'Go back to the park bench',n:'s11'},{t:'Learn what the symbols mean',n:'s10'}]},
 s10:{text:`Leo decided to learn how the paintbrush worked. He sat at his desk. He looked at the symbols. Star. Moon. Heart. He took the brush. He drew a star in the air. Nothing happened. He drew it on paper. It became real. It shone brightly. "The star is for light," Leo thought. He drew a moon. It appeared in the sky. It glowed. "The moon is for dreams," he thought. He drew a heart. It appeared on the paper. It was warm. "The heart is for love," he thought. Now Leo understood. The paintbrush had three powers. Light, dreams, and love. If he drew with love, the drawing became real. If he drew with anger, something bad could happen. Leo remembered the monster. He had drawn it without thinking. He had drawn it with fear. That was why it was scary. Leo smiled. "I will always draw with love," he said. He drew a picture of his family. His mother, his father, and his cat Tom. The picture became real. His family walked out of the paper! They were surprised. "Leo!" said his mother. "How did you do that?" Leo laughed. "It is magic," he said. "But it is the magic of love." His family smiled. They hugged him. Leo felt happy. He knew the secret of the paintbrush now.`, choices:[{t:'Discover what happens to the magic',n:'s13'},{t:'Become a famous artist',n:'s14'}]},
 s11:{text:`The next morning, Leo went to the park. He sat on the bench where he had met the old man. He thought about everything. He had helped his grandmother. He had helped the farmer and the woman. He had stood up to a greedy man. He looked at the paintbrush. It looked old and simple. But it held so much power. "I will use you only for good," Leo said softly. Suddenly, someone sat next to him. It was the old man! "Hello, Leo," he said. "I have been watching you. You did well. You used the brush with a kind heart." Leo smiled. "Thank you," he said. "But why did you give it to me?" The old man looked at him. "Because you love to draw," he said. "And because your heart is good. The paintbrush can only work for someone who draws with love." Leo nodded. He understood. The old man stood up. "Keep using it well," he said. He walked away. Leo watched him go. He looked at the paintbrush. He knew he would always use it to make the world better.`, ending:true},
 s12:{text:`Leo wanted to know why the old man chose him. He thought and thought. He remembered that day. He was walking in the park. He was drawing in his notebook. He was drawing a bird. He loved birds. Maybe the old man saw him drawing. Maybe he saw how much Leo loved art. Leo looked at his old drawings. He had drawn animals. He had drawn people. He had drawn houses. All his drawings were full of life. Even without magic, his drawings looked alive. Leo understood. The old man chose him because he was an artist. The brush did not make Leo an artist. Leo was already an artist. The brush just made his art real. Leo felt proud. He decided to draw every day. He practiced more. He drew from life. He drew the trees in the park. He drew the clouds in the sky. He drew his friends playing. His drawings became even better. People came to see them. They said Leo had a gift. Leo smiled. "The magic is in my hands," he said. "The paintbrush just showed me the way." He kept drawing. He kept helping. He was happy.`, choices:[{t:'Become a famous artist',n:'s14'},{t:'Meet the old man again',n:'s11'}]},
 s13:{text:`Days passed. Leo used the paintbrush carefully. He drew trees for the city park. He drew benches for old people. He drew toys for children in the hospital. Everyone loved Leo. One day, Leo woke up. The paintbrush was glowing. It glowed softly, like the sun. Leo picked it up. The glow moved to his hand. Leo felt warm. He did not need the paintbrush anymore! He could make things real with his hands. He touched a paper flower. It became real. He touched a drawing of a bird. It flew away. Leo was amazed. He understood. The paintbrush had taught him how to create. Now the magic was inside him. Leo ran to the park. He drew a rainbow in the sky with his finger. It appeared. People looked up. They smiled. Leo smiled too. He had the magic inside him forever. And he used it to bring joy to everyone.`, ending:true},
 s14:{text:`Years later, Leo was a famous artist. People came from far away to see his pictures. But Leo never forgot the magic paintbrush. He kept it in a special box. Sometimes, he took it out. He held it. He remembered the old man. He remembered the day everything changed. One day, a child came to Leo's studio. The child was drawing a cat. It was a small, orange cat. Leo smiled. "Do you like to draw?" he asked. "Yes, I do!" said the child. Leo looked at the child. The child's eyes were bright. Leo walked to the box. He opened it. He took out the magic paintbrush. "Take this paintbrush," he said. "It is a gift. Use it well." The child's eyes grew wide. Leo smiled. The magic would live on. It would pass from artist to artist. And the world would be full of wonder, forever.`, ending:true},
},

emoji:'⏳',title:'The Time Capsule',start:'s1',
segs:{
 s1:{text:`It was a sunny Saturday. Four friends were playing in the old park near their school. Their names were Max, Lily, Ben, and Zoe. They were all ten years old. They loved to explore. "Let's look for treasure!" said Max. "Yes!" said the others. They looked under the bushes. They looked behind the trees. They looked in the old fountain. They found nothing. "Maybe there is no treasure," said Lily. "Wait," said Ben. "Look at this old oak tree. There is something in the ground near its roots." The children came closer. They saw a small metal box. It was half buried in the ground. It was old and rusty. "Wow!" said Zoe. "What is it?" "Let's dig it out!" said Max. The children dug carefully. The box was heavy. They pulled it out. It was a metal box with a lock. The lock was old. "How do we open it?" asked Lily. "Maybe the key is nearby," said Ben. They looked around. Max saw a small key under a rock. "Here!" he said. He picked it up. The key fit the lock. Max turned it. The lock opened. The children opened the box. Inside, there were old things. There was a letter. There was a small diary. There was a photograph. There was a coin. There was a ribbon. "This is a time capsule!" said Zoe. "People put things in it for the future." The children were excited. They wanted to see everything.`, choices:[{t:'Read the letter',n:'s2'},{t:'Look at the photograph',n:'s3'}]},
 s2:{text:`Max opened the letter. It was old. The paper was yellow. The writing was beautiful. Max read it aloud. "Dear friend from the future," he read. "My name is Mary. I am ten years old. I live in this town. I am putting this time capsule under the old oak tree. I want you to know about my life. It is 1975. Life is different now. We do not have computers. We do not have mobile phones. We play outside. We read books. We listen to music on the radio. I love to ride my bicycle. I love to play with my friends. My favorite food is ice cream. My favorite color is blue. I hope you are happy in the future. I hope the world is a good place. Please write a letter back and put it in this box. Then bury it again. Someone in the future will find it. With love, Mary." The children were quiet. They thought about Mary's words. "1975," said Lily. "That was a long time ago." "Yes," said Ben. "Mary is old now. Maybe she is a grandmother." "But her letter is here," said Zoe. "It is like she is talking to us." The children felt a connection to Mary. They wanted to know more about her.`, choices:[{t:'Look at the photograph',n:'s3'},{t:'Read the diary',n:'s4'}]},
 s3:{text:`Lily picked up the photograph. It was black and white. In the photo, there was a girl. She was about ten years old. She had long hair. She was smiling. She was wearing a dress. She was standing next to a bicycle. "This must be Mary," said Lily. "She looks happy." The children looked at the photo. "She is wearing a dress," said Zoe. "Girls wore dresses all the time in the past." "And look at her bicycle," said Max. "It is different from our bikes. It has a big front wheel." "Yes," said Ben. "Bicycles were different in 1975." The children looked at the photo for a long time. They tried to imagine Mary's life. "I wonder what she is doing now," said Lily. "Maybe she is a teacher," said Zoe. "Maybe she is a doctor," said Max. "Maybe she is a grandma," said Ben. The children laughed. They wanted to know more about Mary. They looked in the box again. There was a small diary.`, choices:[{t:'Read the diary',n:'s4'},{t:'Look at the other things',n:'s5'}]},
 s4:{text:`Ben opened the diary. It was small. It had a red cover. The pages were yellow. Ben read the first page. "May 3, 1975," he read. "Today was a good day. I rode my bicycle to school. I saw my friends. We played in the park. We climbed the old oak tree. It is the best tree in the world. I love my town." Ben turned the page. "May 10, 1975," he read. "Today, my mother made a cake. It was chocolate. It was delicious. I ate two pieces. My father laughed. He said I would get a stomachache. I did not. I was fine." Ben turned another page. "May 17, 1975," he read. "Today, it rained. I could not play outside. I stayed at home. I read a book. It was about a girl who went on an adventure. I want to go on an adventure too. Maybe one day, I will." The children listened. They felt like they knew Mary. "She is like us," said Zoe. "She likes to play. She likes cake. She likes books." "Yes," said Lily. "People in the past are not so different from us." "But their life is different," said Max. "No computers. No phones. No video games." "But they had fun too," said Ben. "They played outside. They climbed trees. They rode bicycles." The children thought about this. They looked at the diary again. There were more pages. "Let's read more," said Zoe.`, choices:[{t:'Keep reading the diary',n:'s6'},{t:'Look at the other things',n:'s5'}]},
 s5:{text:`The children looked at the other things in the box. There was a coin. It was from 1975. "Look," said Max. "This coin is old. It has a different design." The children looked at the coin. "It is not like our coins," said Lily. "It is bigger." "And it has different pictures," said Ben. There was also a ribbon. It was blue. "This is a beautiful ribbon," said Zoe. "Maybe Mary wore it in her hair." The children looked at the ribbon. "Or maybe she used it for something else," said Max. "Maybe she tied it around a gift." "Or maybe she won it in a race," said Ben. The children did not know. But they liked the ribbon. "We should keep these things safe," said Lily. "They are from the past. They are important." "Yes," said Max. "They are like a message from Mary." The children looked at the box. They felt like they were holding a piece of history. They wanted to know more about Mary. They wanted to know about her life in 1975.`, choices:[{t:'Read the diary',n:'s4'},{t:'Decide what to do with it',n:'s7'}]},
 s6:{text:`Ben continued to read the diary. "June 1, 1975," he read. "Today, my father took me to the lake. We went fishing. We caught three fish. My father cooked them for dinner. They were delicious. I love my father." Ben turned the page. "June 15, 1975," he read. "Today, my best friend Sarah moved away. I am sad. I will miss her. We promised to write letters to each other. I hope she writes to me." The children were quiet. "It is sad when friends move away," said Lily. "Yes," said Zoe. "But they promised to write letters." "Letters are special," said Ben. "People do not write letters much now. They send messages." "But letters are nice," said Max. "You can keep them. You can read them again." Ben continued reading. "July 4, 1975," he read. "Today was Independence Day. We had a big picnic. We saw fireworks. They were beautiful. I love fireworks. They light up the sky." The children smiled. "We also see fireworks on Independence Day," said Zoe. "Yes," said Max. "Some things do not change." The children felt happy. They felt like they knew Mary. They wanted to know more. But the diary was almost finished. There were only a few pages left.`, choices:[{t:'Finish reading the diary',n:'s8'},{t:'Decide what to do with it',n:'s7'}]},
 s7:{text:`The children looked at each other. "What should we do with the time capsule?" asked Max. "We could keep it," said Lily. "We could show it to our families." "We could take it to a museum," said Ben. "People there would like it." "But Mary asked us to write a letter back," said Zoe. "She wanted us to put a new letter in the box and bury it again." The children thought. "Mary wanted someone in the future to find her letter," said Max. "We found it. Now we should do the same thing." "Yes," said Lily. "We should write a letter to the future. We should put it in the box. We should bury it again." "That is a great idea," said Ben. "But we should also show the things to our families first," said Zoe. "They would love to see them." "Yes," said Max. "We can show them today. Then tomorrow, we can write our letter and bury the box again." The children agreed. They were excited. They were going to be part of history. They were going to send a message to the future.`, choices:[{t:'Show the things to your families',n:'s9'},{t:'Write a letter to the future',n:'s10'}]},
 s8:{text:`Ben read the last pages of the diary. "August 20, 1975," he read. "Today, I put my things in a box. I wrote a letter. I put the letter in the box. I am going to bury the box under the old oak tree in the park. I want someone in the future to find it. I want them to know about my life. I want them to know that I was here. I hope they are happy. I hope the world is a good place. Goodbye, friend from the future. With love, Mary." Ben closed the diary. The children were quiet. They felt something special. They had read Mary's message. They had connected with a girl from 1975. "She was brave," said Zoe. "She put her things in a box and buried them. She did not know if anyone would find them." "But we found them," said Max. "We found her message." "And we should answer it," said Lily. "We should write a letter to the future. We should put it in the box. We should bury it again." "Yes," said Ben. "We should do what Mary did." The children agreed. They were going to write a letter to the future. They were going to be part of history.`, choices:[{t:'Write a letter to the future',n:'s10'},{t:'Show the treasures to your families',n:'s9'}]},
 s9:{text:`The children took the time capsule home. They showed it to their families. Their families were amazed. "This is from 1975!" said Max's father. "I was a child then!" "Look at the coin," said Lily's mother. "I remember coins like this." "And the ribbon," said Zoe's grandmother. "I had a ribbon like this when I was a girl." The children were happy. Their families loved the time capsule. They told stories about 1975. They talked about the music, the clothes, and the games. The children listened. They learned a lot. "People in 1975 had fun too," said Max. "Yes," said Lily. "They just had fun in different ways." The next day, the children met in the park. They had paper and a pen. They wanted to write a letter to the future. They wanted to tell people in the future about their lives. They wanted to be like Mary.`, choices:[{t:'Write a letter to the future',n:'s10'},{t:'Give the capsule to a museum',n:'s11'}]},
 s10:{text:`The children sat under the old oak tree. They had paper and a pen. They wanted to write a letter to the future. "What should we write?" asked Max. "We should tell them about our lives," said Lily. "Like Mary did." "Yes," said Ben. "We should tell them about our town. About our school. About our games." "And about our dreams," said Zoe. The children thought. Then they started to write. "Dear friend from the future," they wrote. "We are Max, Lily, Ben, and Zoe. We are ten years old. We found Mary's time capsule under the old oak tree. We read her letter. We read her diary. We looked at her photo. We felt like we knew her. We want you to know about our lives. We live in the same town. We go to the same school. We play in the same park. We love to play video games. We love to watch movies. We love to read books. Our favorite food is pizza. Our favorite color is blue, like Mary's. We hope you are happy in the future. We hope the world is a good place. Please write a letter back and put it in this box. Then bury it again. Someone in the future will find it. With love, Max, Lily, Ben, and Zoe." The children put the letter in the box. They closed it. They locked it. They buried it under the old oak tree. They stood up. They looked at each other. They smiled. "We did it," said Max. "We are part of history now," said Lily. "Someone in the future will find our letter," said Ben. "And they will know about us," said Zoe. The children walked home. They felt happy. They had done something special. They had sent a message to the future. And under the old oak tree, the time capsule waited. It waited for someone else to find it. It waited for a new friend from the future.`, ending:true},
 s11:{text:`The families loved the time capsule so much that they decided to keep it safe. The local museum heard about it and asked to show it. The children agreed. The time capsule stood in a glass case. People came to see it. Children read Mary's letter. The children were proud. They had saved a piece of history, and Mary's message lived on for everyone to see.`, ending:true},
},

 {q:'Where did the children find the time capsule?',o:['Under an old oak tree','In the river','In the school'],a:0},

]},

segs:{
 s1:{text:`Mia loved the night sky. Every evening, she sat on the roof of her house and looked at the stars. The stars were bright and beautiful. She knew their names. She knew the Big Dipper and the Little Dipper. She knew Orion and the North Star. Her grandfather had taught her. "The stars are like little friends," he used to say. "They shine for us every night."

One night, Mia saw something strange. A star was falling from the sky. It was bright and fast. It fell behind the hill near her house. Mia was surprised. "A shooting star!" she said. "I must make a wish." She closed her eyes and wished. Then she opened them. She wanted to see where the star fell. She decided to go and look. She took her flashlight and walked to the hill. The night was cool. The grass was wet. She walked and walked. Then she saw a light. It was small and golden. It was in the grass. Mia came closer. She could not believe her eyes. A small star was lying in the grass! It was warm and shiny. It was not a shooting star. It was a real star that had fallen.`, choices:[{t:'Carefully pick up the star',n:'s2'},{t:'Call Grandpa for help',n:'s3'}]},
 s2:{text:`Mia carefully picked up the star. It was warm, like a small lamp. It was soft and smooth. The star trembled a little. Mia felt that it was afraid. "Do not be afraid," she said softly. "I will help you." The star seemed to calm down. It glowed a little brighter. Mia looked at it. "How did you fall from the sky?" she asked. The star could not answer. But it glowed in a special way. It seemed to point up at the sky. "You want to go back home," said Mia. "I understand." She thought. "But how can I help you get back?" The star glowed again. It seemed to say: "You can help me." Mia looked at the sky. It was very high. She could not throw the star that high. She needed an idea.`, choices:[{t:'Launch the star like a balloon',n:'s4'},{t:'Ask Grandpa, he knows about stars',n:'s5'},{t:'Ask the wise owl for help',n:'s6'},{t:'Take the star home in a box',n:'s9'}]},
 s3:{text:`Mia ran back to her house. She called her grandfather. "Grandpa! Grandpa! Come quickly!" she shouted. "There is a star on the hill!" Her grandfather came out. He was old but strong. "A star?" he said. "What do you mean?" "Come, I will show you!" said Mia. They walked to the hill. Mia showed him the star. It was lying in the grass, glowing. Her grandfather looked at it. He was amazed. "I have never seen anything like this," he said. He smiled. "This is a very special night, Mia." He bent down and looked at the star. "We must help it get home," he said. "But how?" asked Mia. Her grandfather thought. He looked at the sky. "There is an old legend," he said. "It says that fallen stars can return home if someone sings to them the song of the sky." Mia looked at him. "A song?" she said. "Yes," said her grandfather. "The song of the sky. Do you know it?" Mia shook her head. "I will teach you," said her grandfather.`, choices:[{t:'Learn the sky song and sing it',n:'s5'},{t:'Hear the rest of the legend',n:'s8'}]},
 s4:{text:`Mia had an idea. She had a balloon at home. It was big and red. She ran to get it. She came back with the balloon. She filled it with air. Then she tied the star to the balloon. "This will carry you up," she said. She let the balloon go. It went up. It went higher and higher. Mia watched it. But then, a wind came. The wind blew the balloon to the side. The balloon went down. It landed in a tree. Mia ran to the tree. The balloon was stuck. The star was still there. It glowed weakly. Mia was sad. "I am sorry," she said. "I could not help you." The star glowed a little. It seemed to say: "It is okay. Thank you for trying." Mia looked at the star. She did not want to give up. She thought again. "Maybe I need to try something else," she said. She untied the star from the balloon. She held it in her hands. She looked at the sky. She remembered what her grandfather said about stars. "The stars shine because they are happy," he said. "They shine for the people they love." Mia smiled. She held the star up. "Shine," she said. "Shine for me." The star glowed brighter. Then something amazing happened. The star began to rise. It rose slowly at first. Then faster. It went up into the sky. It flew to its place among the other stars. It twinkled at Mia. Mia waved. "Goodbye, little star!" she shouted. The star twinkled again. Then it was just a star in the sky. Mia smiled. She felt happy. She had helped the star go home. And now, every night, she looked at the sky. She always found her star. It was the brightest one. It was her friend.`, ending:true},
 s5:{text:`Mia sat with her grandfather. He taught her the song of the sky. It was a soft, beautiful song. It was about the stars and the moon and the night. Mia learned it quickly. She loved the song. Then she went back to the hill. She held the star in her hands. She began to sing. She sang softly. The star listened. It glowed brighter. Mia sang the whole song. When she finished, the star glowed very bright. Then it began to rise. It rose slowly. Then faster. It went up into the sky. It flew to its place among the stars. It twinkled at Mia. Mia waved. "Goodbye, little star!" she shouted. The star twinkled again. Then it was just a star in the sky. Mia smiled. She walked back to her house. Her grandfather was waiting. "Did it work?" he asked. "Yes," said Mia. "The star went home." Her grandfather smiled. "You have a kind heart, Mia," he said. "The stars will always remember you." From that night on, Mia looked at the sky every evening. She always found her star. It was the brightest one. It was her friend. And sometimes, when she sang the song of the sky, the star twinkled back at her.`, ending:true},
 s6:{text:`Mia did not know what to do. She held the star in her hands and thought very hard. Then she remembered something important. In the forest behind her house, there lived an old owl. Everyone in the village said that the owl was the wisest creature in the whole world. The owl knew all the secrets of the night. Mia wrapped the star carefully in her scarf and walked into the forest. The trees were tall and dark. The moon shone between the branches, making silver patterns on the ground. It was quiet. Only the leaves whispered in the wind. Mia walked until she found the old owl sitting on a thick branch, with its big yellow eyes open wide. "Owl," said Mia, "I found a star that fell from the sky. Can you help me send it home?" The owl blinked slowly. It looked at the star in Mia's scarf. "Little girl," said the owl in a deep, soft voice, "this star has used up almost all of its light. It is too weak to fly home alone. But there is a way. Behind the hill, where the two old pines grow, there is a Moon Pool. The water there is made of moonlight. If the star drinks from the Moon Pool, it will become strong again and can return to the sky." Mia's eyes shone. "Thank you, Owl!" she said. "But hurry," said the owl. "The moon will set soon. Go now, before it is too late. The stars in heaven are waiting for their little sister." Mia hugged the star and ran as fast as she could toward the hill, holding the scarf close so the star would not fall.`, choices:[{t:'Find the Moon Pool',n:'s7'},{t:'Go back and try the balloon',n:'s4'}]},
 s7:{text:`Mia ran and ran. She ran through the meadow and up the hill. The grass was wet and slippery, but she did not stop. At last she saw the two old pines. They stood side by side on the top of the hill, their branches touching like two old friends. Between them, the grass sparkled with silver light. In the middle was a small round pool, glowing softly like liquid moon. Mia knelt down by the pool. Very gently, she took the star out of her scarf and placed it on the water. The star floated on the surface like a small golden leaf. Then something wonderful happened. The star began to drink the moonlight. It shimmered and trembled. It glowed brighter and brighter until the whole pool turned golden. Mia had to close her eyes because the light was so bright and warm. When she opened them, the star was rising from the water. It circled once around Mia's head, as if to say thank you. Then it flew up, higher and higher, until it became a tiny golden dot in the sky. Mia watched until the dot joined the other stars. And from that night on, one star in the sky shone a little brighter than all the others. Mia knew it was her star. Every evening, she waved at it, and it twinkled back at her, like an old friend saying hello from far away.`, ending:true},
 s8:{text:`Her grandfather smiled. He sat down on the grass next to Mia. "There is more to the legend, Mia," he said softly. "Long ago, a star fell from the sky because it was lonely. It wanted to find a friend here on Earth. And this is the secret of the legend: some stars want to go back home to the sky, where their family lives. But other stars, when they find a true friend, choose to stay on Earth forever." Mia looked at the star in her hands. "Can a star really stay on Earth?" she asked. "It can," said her grandfather, "if the star wants to, and if you are ready to take care of it. You must give it a warm, safe place to sleep. You must talk to it every day and never leave it alone for long. You must feed it with sunlight in the morning and with starlight at night. And you must never lock it in a closed box, because stars need freedom and light." Mia thought about her grandfather's words. She looked at the star. The star twinkled at her, one, two, three times, like a little heartbeat. Mia felt that the star was asking her a question. Did she want the star to go home? Or did she want it to stay with her? Mia held her breath. It was a very important decision, and she wanted to make it right.`, choices:[{t:'Let the star stay with me',n:'s10'},{t:'Sing the song of the sky',n:'s5'}]},
 s9:{text:`That night, Mia could not decide what to do. The star was getting weaker in her hands. So she wrapped it in her scarf, carried it home, and put it gently into her little wooden jewelry box. She placed the box on the table and went to sleep. But in the middle of the night, Mia woke up. The room was dark. She felt that something was wrong. She opened the box. The star was lying inside, very pale. Its light was almost gone. Mia's heart sank. "Oh no," she whispered. "I am sorry, little star." She understood. The star could not live in a closed box. It needed the sky. It needed the air of the night. Mia carried the box to the window and opened it wide. Cool night air came in. Mia took the star out and held it up to the moonlight. The star drank the night air. Slowly, its light came back. It glowed, then it rose from Mia's hands. It hovered at the window for a moment, as if saying goodbye. Mia smiled through her tears. "Go home, little star," she said softly. "I will always remember you." The star flew out of the window and up into the sky. Mia watched it join its family. And she learned that sometimes, loving someone means letting them go.`, ending:true},
 s10:{text:`Mia smiled. She knew what she wanted. "Would you like to stay with me?" she asked the star quietly. The star jumped out of her hands. It danced in the air, spinning like a tiny firefly. It was happy! Mia laughed and clapped her hands. She ran home and found a small glass jar. She lined it with a soft blue cloth and put the star inside. The star glowed warmly, like a tiny night lamp. From that night on, the star lived on Mia's windowsill. It twinkled when she was sad and shone brightly when she was happy. In the daytime it slept inside the jar, and at night it woke up to keep her company. Mia told it everything: about school, about her friends, about her dreams, about the songs her grandfather sang. Sometimes her grandfather came and told them both stories about the sky, and the star listened, glowing softly. Mia was never afraid of the dark again, because her little star was always there, watching over her. Years later, when Mia grew up, the star was still her friend. And people in the village said that even the stars in heaven were a little jealous, because one of them had found a home and a heart here on Earth. But the star was happy. It had found a friend, and that was the best thing of all.`, ending:true},
},

 {q:'What did Mia see falling from the sky?',o:['A star','A bird','A plane'],a:0},
 {q:'Where did Mia find the star?',o:['In the grass on the hill','In the river','On her roof'],a:0},
 {q:'What did her grandfather teach her?',o:['The song of the sky','A dance','A game'],a:0},

emoji:'🖼️',title:'The Mystery of the Missing Painting',start:'s1',
segs:{
 s1:{text:`Willowbrook was a small town with one main street, one cinema, and one little art gallery. The gallery was called the Whitfield Gallery, after the man who built it in 1925. The people of Willowbrook were proud of their gallery. It was not huge, but it was beautiful. It had white walls, tall windows, and a marble floor that always sparkled.

The most famous painting in the whole gallery was called "Sunrise over Willow River". A young artist named Amelia Hartwood painted it in 1931. It showed the river at dawn, coloured pink and gold, with small boats resting on the water. Everyone in town loved that painting. Children visited it on school trips every year. Old Mr. Foley said he remembered the day the painting arrived, and he claimed it looked exactly like a real morning.

Emily and Jack were sister and brother. Emily was eleven years old, and Jack was twelve. They lived near the gallery and knew every corner of it. They also ran a little detective club in their garden shed. They had a notebook, a magnifying glass, and a torch. Emily had red hair and always carried her notebook. Jack had freckles and a habit of forgetting his hat. Their detective club even had a secret password, and only the two of them knew it. They had already solved small mysteries together: who had eaten the prize cakes in the school kitchen, and where the postman hid his bicycle every Sunday. But they were still waiting for a real adventure, and their dream was about to come true.`,
  choices:[{t:'Run to the gallery',n:'s2'},{t:'Stay home and let the police handle it',n:'e5'}]},
 s2:{text:`On Monday morning, the town woke up to shocking news. Someone had stolen "Sunrise over Willow River" during the night. The gallery alarm had gone off at five minutes to midnight, but when the police arrived, the gallery seemed quiet and empty. The night guard, Mr. Pollard, was ill that week, so nobody had checked the rooms when the alarm rang. By morning, the staff discovered that the painting had disappeared from the Blue Room, and the back window stood wide open.

Emily and Jack ran to the gallery as soon as they heard. A small crowd was standing outside: old Mr. Foley shaking his head, the baker Mrs. Chen drying her hands on her apron, and the mayor talking loudly with the police inspector.

Inside, the director of the gallery, Ms. Hartley, was sitting by the window with a cup of cold tea. Her eyes were red. "That painting meant everything to this town," she said quietly. "We had plans to celebrate its ninety-fifth birthday next spring."

Inspector Patel let the children look around. "You know this building well," he said. "Walk around and tell me if you see anything strange." The inspector smiled at them. "A detective needs sharp eyes and a patient heart." Emily nodded and wrote that sentence in her notebook. This was their first real case, and they were not going to waste it.`,
  choices:[{t:'Search the Blue Room',n:'s3'},{t:'Leave the case to the grown-ups',n:'e6'}]},
 s3:{text:`The Blue Room looked almost normal, except for the empty space on the wall. The painting had hung there for ninety-five years, and now the wall looked sad and bare. On the floor, the children found a long scratch on the wooden boards, as if something heavy had been dragged across the room.

Outside the back window, the flowerbed was wet from the night rain. In the dark mud, there were deep footprints. They were big, the size of a tall man's boots. Jack measured one with his ruler: nearly thirty centimetres long.

Near the back door, on the metal handle, hung a blue woollen scarf. It smelled faintly of soap. "Nobody from the gallery wears this," whispered Emily. On the ground, a small ladder lay on its side.

Emily wrote everything in her notebook: footprints, scarf, scratch, ladder, open window. "There are three people we should talk to," she said. "Mr. Grimshaw, who wanted to buy the painting. Mrs. Dobbs, who cleans here in the evening. And Otto, who runs the little art shop. I am sure one of them knows something." The morning sun climbed over the roofs, and the town smelled of fresh bread. But for the two detectives, the world smelled of a case.`,
  choices:[{t:'Question Mr. Grimshaw',n:'s4'},{t:'Talk to Mrs. Dobbs, the cleaner',n:'s5'},{t:'Visit Otto\'s shop',n:'s6'}]},
 s4:{text:`Mr. Grimshaw lived in the biggest house in Willowbrook. He collected old paintings and talked about them in a loud voice. When the children knocked, his driver opened the door, and soon Mr. Grimshaw appeared in a velvet jacket. "The police already asked me everything," he said. "I was at the mayor's dinner on Monday evening. I left at ten o'clock, and my driver took me home. Ask anyone you like."

It was true. The mayor confirmed that Mr. Grimshaw had been at the dinner the whole evening. The driver confirmed the drive home. Emily looked at Mr. Grimshaw's shoes: elegant, small, polished leather shoes. The footprints in the mud were huge, twice that size.

"May I ask you a question?" said Emily. "Did you want to buy the painting?"

Mr. Grimshaw turned red. "Of course I did! I offered a fortune for it. Ms. Hartley refused. She said the painting belonged to the town. And I will tell you something else: that painting was getting old. It needed rest, not bright lights. A gallery that does not care for its paintings does not deserve them."

Then he shut the door, not angrily, but sadly. The children looked at each other. "He is rude," said Jack. "But I do not think he is the thief. He does not look like a man who climbs through windows. Climbing is hard in those shiny shoes."`,
  choices:[{t:'Look over the hall carefully again',n:'s7'},{t:'Visit Otto\'s shop',n:'s6'}]},
 s5:{text:`Mrs. Dobbs was the gallery's cleaner. She worked in the evenings, after the visitors had gone home. The children found her in the kitchen, drinking tea and eating biscuits. She looked nervous when they mentioned the painting.

"Oh dear," she said. "I liked that painting. I cleaned its glass every Friday."

"Did you see anything strange on Monday night?" asked Emily.

Mrs. Dobbs put down her biscuit. "Well," she said slowly, "I finished work at half past nine. As I walked out the back gate, I saw Otto, from the art shop, walking along the lane with a big flat parcel under his arm, wrapped in brown paper. It was about this big." She spread her arms wide, like a large painting. "I thought it was strange, because it was very late. And then I heard the ladder fall. It must have been the wind."

"The ladder?" asked Jack. "Why was there a ladder near the back door?"

"It was mine," said Mrs. Dobbs. "I used it on Sunday to change a light bulb above the back door. I forgot to put it away. Oh dear, oh dear. Do you think the thief used my ladder?"

"Maybe," said Emily kindly. "But you are not in trouble. Thank you, Mrs. Dobbs." Outside, Jack frowned. "A flat parcel, the size of a painting. And a ladder. This is getting interesting."`,
  choices:[{t:'Visit Otto\'s shop',n:'s6'},{t:'Go back to Mr. Grimshaw',n:'s4'}]},
 s6:{text:`Otto's little shop stood on Market Lane. Otto made picture frames and sometimes copied old paintings for customers. He was a cheerful, round man with paint on his fingers. When the children came in, he was working at a table, and on the table stood a beautiful small painting: a copy of "Sunrise over Willow River".

"This is lovely!" said Emily.

"Thank you," said Otto. "An old lady wants a copy of the famous painting, because she cannot travel to the gallery anymore. People order copies all the time."

"Do you copy paintings for the gallery too?" asked Jack.

"Oh, sometimes," said Otto. "Last month I made a new frame for the gallery. And I often sell them varnish and soft brushes for conservation. In fact, Ms. Hartley bought a pot of special varnish from me last week. She said the old paintings needed care. She said the sunrise painting needed revarnishing."

"Aha!" thought Emily. "If somebody knows how to take care of the painting, it might be easier for them to take it away safely." She looked around the shop. Near the door stood a pile of large flat parcels, exactly like the one Mrs. Dobbs had described. Otto saw her looking and laughed. "Those are mirrors," he said. "I deliver them for the new hotel. Look at yourself in any of them!"

"No, thank you," smiled Emily. Otto wiped his hands on his apron. "Every painting tells a story," he said. "My job is to make sure the story stays alive." The children thanked him and left. Outside, Jack said: "Do you believe him about the mirrors?"

"I don't know," said Emily. "But now we have two clues pointing to the same person. And it is not Mr. Grimshaw."`,
  choices:[{t:'Sneak into the gallery storage room',n:'s8'},{t:'Look at the hall once more',n:'s7'}]},
 s7:{text:`That afternoon, the gallery was closed. Emily and Jack knew a secret way inside: an old key that hung on a nail behind the drainpipe, left there years ago by the caretaker. They slipped in through the back door.

The Blue Room was silent. Emily knelt and ran her finger along the floorboards. "Look," she said. "There is a thin white line, like dust, leading from the wall to the back corridor."

They followed it. Behind the place where the painting had hung, the wallpaper was damp. A small patch was soft and green with mould. Lying on the floor was a tiny piece of torn paper. Jack picked it up. On it, in neat handwriting, was written: "Varnish. Brushes. Thursday, ten in the evening. Bring the ladder again. For the quiet job."

"There is a quiet job happening here," whispered Emily. "Someone is using the ladder at night, and someone bought varnish. I think the painting never left this building."

Just then, they heard footsteps in the corridor. They hid behind a tall cupboard. Ms. Hartley passed by, carrying a small lamp, and went toward the storage room at the end of the corridor. The storage room door opened and closed softly.

"The storage room," whispered Jack. "That is where we need to go. Tonight."`,
  choices:[{t:'Sneak into the storage room tonight',n:'s8'},{t:'Call Inspector Patel',n:'s9'}]},
 s8:{text:`At night, Emily and Jack hid among the tall shelves in the storage room. Canvases stood everywhere, covered with white cloths. Through a gap in the curtain, they watched the door. The night air was cold, and the children hugged their jackets. The building was quieter than a whisper.

At exactly ten o'clock, the door opened. Ms. Hartley came in, carrying a lamp. Behind her walked a young woman with a leather bag. The woman wore glasses and began to take out bottles, brushes, and soft rags.

"Are you sure this will work, Anya?" asked Ms. Hartley.

"Almost sure," said Anya. "The dampness damaged the lower corner, but I can save it. Another week, and the colours would have started to fade forever. You did the right thing to take it away quietly."

They stopped in front of a table. And there, lying on soft cloth, was "Sunrise over Willow River". It was not stolen. It was being saved, centimetre by centimetre.

"But why did you hide it?" Emily stepped out from behind the shelf. Ms. Hartley jumped. "Emily! Jack!" she cried. Then she sat down, tired. "Because the town council promised money for a new climate room only if the gallery started modernising. If I told everyone the damp was destroying our greatest painting, the whole town would have panicked. I wanted to restore it first and surprise everyone on Friday's reopening. The alarm went off because Anya knocked the ladder over the window. We left through the back door, and the wind blew the window open."

Everything made sense now: the footprints belonged to the gardener, who had walked in the flowerbed that afternoon; the scarf belonged to Anya; the scratch came from the heavy frame being carried out gently. The children looked at the shining painting. Now they had to decide what to do.`,
  choices:[{t:'Speak honestly with the director',n:'e1'},{t:'Keep the secret and just watch',n:'e2'},{t:'Tell the police everything',n:'e3'}]},
 s9:{text:`Emily and Jack did not go to the storage room. Instead, they went straight to the police station. "Inspector Patel, we know who took the painting," said Emily. "Mr. Grimshaw. He wanted to buy it, and the gallery refused him. He argued with Ms. Hartley. And someone saw a big flat parcel leaving the back gate at night."

Inspector Patel raised his eyebrows. "That is serious, children. Very serious." The next morning, he questioned Mr. Grimshaw in front of the whole town hall. Mr. Grimshaw's face turned purple. "I was at the mayor's dinner! My driver proves it!" he shouted. But the gossip had already flown around town like birds. Mrs. Chen stopped selling Mr. Grimshaw her best bread. Old Mr. Foley crossed the street to avoid him. The poor collector sat at home, angry and hurt.

Then, on Thursday night, Emily and Jack saw a light in the gallery's storage room. They crept closer, pressed their faces to the window, and saw Ms. Hartley and Anya gently cleaning the painting with brushes and varnish. The truth hit them like cold water. They had accused an innocent man. They had to fix it.`,
  choices:[{t:'Fix your mistake',n:'e4'},{t:'Confess the truth to the whole town',n:'e7'}]},
 e1:{text:`Emily took a deep breath. "Ms. Hartley," she said, "we are detectives of the Willowbrook Detective Club. We know about the painting. We saw it on the table. And we think what you are doing is brave. The painting is not lost. It is being healed."

Ms. Hartley looked at them for a long moment. Then she smiled through her tears. "You are two very clever children. Will you help us keep the secret until Friday? And will you help us move the painting when it is ready?"

Emily and Jack looked at each other and nodded.

On Friday morning, the gallery opened again. A crowd gathered in the Blue Room. Ms. Hartley pulled the white cloth off the painting, and the whole room gasped. The colours were brighter than ever. The river shone like real gold. The mayor gave a speech. The newspapers wrote about the wonderful surprise: the painting was not stolen. It was saved. Afterwards, Ms. Hartley gave Emily and Jack silver badges with the words "Junior Guardians of the Gallery". And the children understood that sometimes, the best detectives are the ones who keep secrets for a good reason.`, ending:true},
 e2:{text:`The children decided to say nothing. Every night, they watched from the hiding place while Anya carefully cleaned the painting. Slowly, the dull colours came back to life, like a sunrise returning to a night sky. Ms. Hartley noticed their kindness and let them sit nearby while Anya worked. She explained everything: how varnish could be cleaned, how gold leaf could be fixed, and how patience could save beauty. The children learned that not every mystery has a villain. Sometimes a mystery needs a clock, a quiet room, and trust.

On Friday, the gallery reopened. When the cloth fell, everyone cheered. Emily and Jack clapped louder than anyone. The town celebrated with cake and music. Nobody ever learned the truth, except the two young detectives, who carried the secret in their notebooks and in their hearts.

Years later, when Emily became an art student, she sometimes told her friends: "Once, I watched a painting wake up." Nobody believed her. But she smiled, because it was true. Some mysteries are solved with whispers, not with shouts.`, ending:true},
 e3:{text:`The children ran to the police station and told Inspector Patel everything. He listened without smiling, his chin resting on his hand. Then he said: "You have done well, young detectives. Let us go and see."

The inspector came to the gallery with two officers. Ms. Hartley opened the storage room and explained everything. The inspector examined the painting, the varnish, and even the scarf. He turned to the children. "There is no crime here," he said. "A painting cannot be stolen if it is being cared for."

On Friday, the story was officially announced: the painting had left for secret restoration. The newspapers wrote that the town's young detectives had helped solve the great mystery of the "missing" painting. The gallery became even more popular, and the town council finally approved the new climate room.

That night, Inspector Patel gave Emily and Jack a certificate: "Honorary Junior Inspectors". "Now you know the most important rule," he said. "Before you accuse somebody, find the facts. The truth is always calmer than fear." The children hung the certificate above their beds. It was their favourite treasure.`, ending:true},
 e4:{text:`Emily and Jack ran to Mr. Grimshaw's house the next morning. "We are very sorry," said Emily. "We made a terrible mistake. The painting was never stolen. It was being restored quietly, and we blamed you."

Mr. Grimshaw stared at them. Then he laughed, a big, roaring laugh. "Children!" he said. "You are the first people in this town to apologize to me. Come in. I will make you hot chocolate."

When the painting returned, brighter than ever, the mayor gave a speech. Mr. Grimshaw stood in the front row, and the children stood beside him. Everyone clapped. The inspector shook their hands and said: "It takes a strong heart to admit a mistake. The town is proud of you."

And from that day, the Willowbrook Detective Club had a golden rule, written at the top of their notebook: first find the truth, then speak. The mystery of the missing painting taught the whole town that accusations fly fast, but the truth walks slowly, and it always arrives in the end. That spring, the gallery opened a small exhibition of the children's drawings. The first drawing was of a painting waking up.`, ending:true},
 e5:{text:`Emily and Jack decided that the police were in charge. They stayed home that weekend with hot cocoa and comic books. On Monday, the town buzzed with news: the painting had reappeared in the Blue Room, brighter than ever. Ms. Hartley announced that the painting had been secretly sent for restoration by a famous conservator. Nobody was arrested, and nobody was blamed. The children watched the celebration from the edge of the crowd. Jack shrugged. "Maybe some mysteries solve themselves," he said. Emily smiled. "Or maybe the grown-ups handled it for once." Still, deep down, they both felt a little itch. The notebook with the detective club rules stayed in the shed, waiting for the next adventure.`, ending:true},
 e6:{text:`Emily and Jack watched the police tape off the gallery and decided to leave the case to Inspector Patel. "We're just kids," said Jack. "The inspector has real tools and real handcuffs." They rode their bikes home and tried not to think about the missing painting. But the mystery nagged at them. A week later, the newspaper printed the answer: the painting had never left the building. The director had quietly sent it for restoration to save it from dampness, and the "theft" was a misunderstanding that got out of hand. Emily stared at the paper. "We could have figured that out," she whispered. "Maybe," said Jack. "But sometimes knowing when to step back is part of being a detective too." They pasted the article into their notebook and closed it. The next case would be theirs.`, ending:true},
 e7:{text:`At dawn, Emily and Jack stood in front of the town hall. Emily had written a short speech. When the mayor arrived, the children asked to speak. "Mr. Grimshaw is innocent," Emily announced to the gathering crowd. "We accused him without proof. The painting was being restored secretly by Ms. Hartley. The alarm, the scarf, the footprints — all of them had simple explanations. We were wrong, and we are sorry." The crowd murmured. Mr. Grimshaw stepped forward, his eyes wet. "These children are braver than most adults I know," he said. The inspector nodded. "A false accusation is heavy. Admitting it is heavier." At the reopening, Mr. Grimshaw received an official apology, and the children helped hang the restored painting with their own hands. Their golden rule was written that day at the top of the notebook: find the truth, then speak. And this time, they spoke with the truth beside them.`, ending:true},
},
quiz:[
 {q:'What was the name of the missing painting?',o:['Sunrise over Willow River','The Blue Room','Portrait of the Mayor'],a:0},
 {q:'Where did the painting hang?',o:['In the Blue Room','In the basement','In the town hall'],a:0},
