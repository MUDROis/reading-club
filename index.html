emoji:'📚',title:'The Secret Code of the Old Library',start:'s1',
segs:{
 s1:{text:`It was a cold and rainy Saturday in October. Three friends sat in the old Maplewood Public Library, waiting for the storm to end. Liam, his sister Maya, and their best friend Sam were volunteers. They helped Mrs. Whitaker, the librarian, prepare for the library's 125th anniversary. The building was old and smelled of paper and old wood. The children were dusting the highest shelves in the history section when Liam noticed a very old book. It was dark green, with gold letters on its cover: Tales of the Voyagers by Arthur Pemberton. "Look at this," Liam said. "It looks ancient." He pulled the book off the shelf. It was heavy. As he opened it, a small yellow piece of paper fell out and fluttered to the floor. Maya picked it up. The paper was old and neatly folded. On it, someone had written a strange line of letters: "Khdj wkh sruwudlw ri Wkrpdv Ehqqhww." "What is this?" asked Sam. "It looks like a secret code," Maya answered quietly, her eyes wide. The storm outside grew louder, but the children did not hear it. They were looking at the mysterious paper. "We have to figure this out," said Liam. The children sat down at an old wooden table and put the paper in the middle. They studied the letters. The code looked impossible at first. But Maya had an idea. "Sometimes people replace each letter with another one," she explained. "Like a shift. We can try to break it." Sam nodded slowly. "But we need to know how to start," he said. The three friends stared at the strange letters. Suddenly, the old library seemed full of secrets.`, choices:[{t:'Crack the code',n:'s2'},{t:'Put the paper back and forget it',n:'e1'}]},
 s2:{text:`The children worked on the code for half an hour. Liam wrote the whole alphabet on a sheet of paper. Maya looked at the strange phrase again. "There are some words that repeat," she said. "And some are very short. Maybe the double letter in the middle of that long word helps." Sam tapped his pencil on the table. "If every letter was moved by the same number, we could test it," he said. "The most common letter in English is E. I see many letters here, but none of them is E." The children tried shifting the letters forward and backward, one step at a time. Nothing made sense at first. Then Sam noticed something else. At the bottom of the paper, under the strange letters, someone had written small numbers in faded ink: 14-3-8, 22-6-2, and many more. "Look," he said. "Numbers. Maybe they point to something in a book." Maya shook her head slowly. "Or maybe the letters are enough," she said. "One idea is to check if the alphabet is shifted. Another idea is to use these numbers with the old book we found." Liam smiled. "So we have two ways to try." "Yes," Maya said. "We can start with the shift, or we can start with the numbers. Which one should we try first?" The children looked at the yellow paper and then at the old green book. The mystery was waiting for them, and they had to choose.`, choices:[{t:'Try shifting the letters',n:'s3'},{t:'Use the numbers and the book',n:'s4'}]},
 s3:{text:`The children decided to try the letter shift first. Maya wrote the alphabet in a long row on a blank page. Under each letter, she wrote the same alphabet again, but moved forward by three spaces. "If the writer used a shift of three," she explained, "then when we see K, we read H. When we see H, we read E. When we see D, we read A." Liam took the yellow paper and began to rewrite the message, one letter at a time. Slowly, the strange letters became real words. "Khdj" became "Behind." "Wkh" became "the." "Sruwudlw" became "portrait." The children leaned closer to the table. When Liam finished, the whole message was clear: Behind the portrait of Thomas Bennett. Sam whistled quietly. "We did it!" Maya whispered excitedly. "The code was not too hard. But it means something is hidden behind a portrait." Sam nodded. "Thomas Bennett was the man who built this library, a long time ago. His portrait hangs in the reading room upstairs, above the fireplace." The children put the yellow paper in a pocket and walked quietly to the stairs. Their hearts beat faster. Somewhere above them, behind the serious eyes of an old man, a secret was waiting.`, choices:[{t:'Go to the portrait',n:'s5'},{t:'Ask Mrs. Whitaker about Thomas Bennett first',n:'e2'}]},
 s4:{text:`The children decided to try the numbers instead. Sam took the old green book, Tales of the Voyagers, from the table. The small numbers on the paper seemed to point to pages, lines, and words. "Let's test it," Sam said. "Fourteen, three, eight. Page fourteen, line three, word eight." Maya turned to page fourteen and counted the lines carefully with her finger. On the third line, the eighth word was "behind." The children's eyes met. They worked fast. Each group of numbers gave them one word. Soon they had a whole list: behind, the, portrait, of, Thomas, Bennett. "It is a book code!" Sam said in a low voice. "The person who wrote this hid the message inside the book. Without this book, the numbers mean nothing." Maya smiled. "So the message says: behind the portrait of Thomas Bennett." Liam frowned. "Thomas Bennett... Wasn't he the merchant who gave the money to build the library in 1901?" "Yes," said Maya. "There is a large portrait of him in the reading room. I saw it many times." The children looked at each other. Somewhere in that quiet room, behind the golden frame, a secret from the past was waiting for them. "Let's go," Liam said, and they climbed the stairs together.`, choices:[{t:'Go to the portrait',n:'s5'},{t:'Tell Mrs. Whitaker what you found',n:'e3'}]},
 s5:{text:`The reading room was on the second floor. It was a quiet place with tall windows and dark leather chairs. In the middle of the wall hung a large painting in a golden frame. It showed a serious old man with a white beard. He wore a dark suit and held a book in one hand. Under the painting, a small bronze plate said: Thomas Bennett, Founder, 1901. The children looked at the portrait. "He does not look like a man with secrets," Liam said quietly. "But the code says something is behind this portrait." The children looked around the room. Nobody was watching them. Sam carefully lifted one side of the frame away from the wall. Dust fell onto the floor. Behind the frame, between the thick wood and the wall, there was a flat brown envelope. "There!" Maya whispered. Sam took the envelope carefully. It was old, and its edge was sealed with red wax. On the front, someone had written in beautiful old handwriting: To the Finder of This Letter. The children could hardly breathe. They brought the envelope back to the table and sat down. Maya touched the red wax seal. "Should we open it?" she asked. "Of course," Sam said. "We came this far." Liam nodded. Maya broke the seal gently. Inside, there were two letters and an old black-and-white photograph. The photograph showed a young man with a kind face, standing in front of a new building. On the back, someone had written: The Maplewood Library, 1901.`, choices:[{t:'Open the envelope',n:'s6'},{t:'Take the envelope to Mrs. Whitaker unopened',n:'e4'}]},
 s6:{text:`Mrs. Whitaker was busy with other visitors, so the children could read in peace. The first letter was dated March 3, 1901. It was written by Thomas Bennett himself, in careful handwriting. "My dear Genevieve," the letter began. "If you are reading this, I am no longer here. Please forgive me for the secrets I kept. I built this library for our town because I wanted everyone to have access to books and knowledge. But the year 1901 was hard for me. My business partner disappeared with much of my money, and some people thought I had cheated them. I hid the rest of my savings to protect our family. I could not explain everything in public." The children read the words silently. The second letter was shorter. It was addressed to the library itself. "To the Librarian of Maplewood: if this letter is found, please know that the true story of Thomas Bennett is not what the newspapers wrote. I was an honest man. Everything I owned is in a safe place. Look for the key in the red dictionary, page 512. And remember: the garden knows where the roots drink." The children looked at each other. "A safe place," Maya repeated. "And a key in a red dictionary, on page 512." "And a garden," Sam added. "But first, let's look at the portrait once more. Maybe there is something else hidden there." "Or maybe we should find the dictionary first," Liam said. The children could not agree. "Let's do one thing first, then the other," Maya suggested. "Which one should we try first?"`, choices:[{t:'Find the red dictionary',n:'s7'},{t:'Look at the portrait once more',n:'s8'}]},
 s7:{text:`The children chose the red dictionary. The old dictionary stand stood near the window, in a quiet corner of the reading room. On it lay a huge red book, thick and worn by many years of use. Liam opened it carefully. The pages were soft and yellow. He turned them quickly, looking for page 512. When he found the page, something glinted between the pages: a small brass key, wrapped in a piece of soft cloth. "There it is," Maya whispered. Liam unwrapped the key. It was dark, heavy, and very old. A small bird was carved on its handle. "This is beautiful," Sam said. "But what does it open?" Maya thought for a moment. "The second letter said: the garden knows where the roots drink," she remembered. "The library has a small garden behind the building. There is an old birch tree there, and flowerbeds. Maybe the key opens something in the garden." The children looked out of the window. Below them, the garden was gray and wet after the rain. The old birch tree stood alone near the back wall of the library. "Let's go down and take a closer look," Liam said. The children put the key in Liam's pocket and walked quietly down the stairs, trying not to make any noise.`, choices:[{t:'Go to the garden behind the library',n:'s9'},{t:'Check the portrait for another key',n:'s8'}]},
 s8:{text:`The children chose to examine the portrait once more. "Two letters talked about a key," Liam said. "Maybe there are two keys. Maybe the envelope was not the only thing hidden behind the frame." The children returned to the reading room. It was still empty. Sam lifted the heavy frame again, very carefully this time. Maya looked behind it with a small torch from her pocket. At first, they saw only dust and old cobwebs. Then Maya froze. "There is something on the back of the frame," she said. "A small hook." Sam looked closer. On the hook hung a tiny key, almost invisible against the dark wood. It was old, rusty, and covered with dust. "A second key," Maya whispered. "Someone really wanted us to find this." Liam took the key carefully. "But what does it open?" he asked. Sam thought about the letters. "The second letter mentioned a garden. 'The garden knows where the roots drink.' Maybe the key fits something in the library garden." The children walked to the window. Below, they could see the old birch tree behind the library, standing between the flowerbeds. Its white trunk rose above the wet grass. "Let's go outside," Liam decided. "If there is a lock somewhere, we will find it."`, choices:[{t:'Go to the garden behind the library',n:'s9'},{t:'Check the red dictionary for a key',n:'s7'}]},
 s9:{text:`The library garden was quiet and cold. The rain had stopped, but the grass was still wet. The children walked between the flowerbeds until they reached the old birch tree. Its white trunk shone in the gray light. Near the roots, the ground looked different: it was softer and darker than the rest, and it rose in a small hill. "Here," Liam said. "The roots drink water here. Maybe something is hidden under this spot." The children knelt on the wet grass. They had no shovel, but Sam found a strong stick. They dug carefully, slowly, without speaking. After a few minutes, the stick hit metal. It made a deep, hollow sound. The children dug faster, using their hands too. Soon they saw a small iron box with a rusty lock. It was heavy. They pulled it out of the earth and set it on the grass. Maya tried the brass key from the dictionary. It fit the lock perfectly and turned with a click. The lid opened slowly. Inside the box, there were old coins, a small leather bag, a silver locket, and a diary. Maya opened the locket. Inside there was a tiny photograph of a young woman with kind eyes. On the back of the photograph, in the same beautiful handwriting, someone had written: Genevieve Bennett, 1905. "This was his daughter," Maya said softly. Sam opened the diary. The last page was written by Thomas Bennett: "My dear Genevieve. You were never alone. The box belongs to you. Use it wisely. I love you. Your father." The children sat on the wet grass, silent. The old library was hiding not just treasure, but a whole family story. Now the question was: what should they do with everything they had found?`, choices:[{t:'Decide what to do next',n:'s10'},{t:'Bury the box again and keep the secret',n:'e5'}]},
 s10:{text:`The children carried the iron box back inside. They hid it under the old wooden table and covered it with a jacket. Then they sat around it and looked at each other. "This is real," Maya said quietly. "These coins are from 1901. This box is more than a hundred years old." Liam nodded. "The money belonged to Thomas Bennett. He wanted his daughter Genevieve to have it. But we don't know what happened to her." Sam leaned forward and looked at the box. "So what do we do now? We can't just keep it." "No," Maya agreed. "But we have to choose. We can tell the whole town about our discovery and give the box to the museum. Or we can try to find the Bennett family and give the box to them. Or we can keep the secret and hide the box again, so that another adventure can begin." The three friends looked at the old iron box. Each option felt different. Each option would change the story forever. "It's our decision," Liam said quietly. "Together. But we have to choose well."`, choices:[{t:'Give the box to the museum',n:'s11'},{t:'Find the Bennett family',n:'s12'},{t:'Keep the secret',n:'s13'}]},
 s11:{text:`The children chose the museum. The next morning, they went to Mrs. Whitaker and put the iron box on her desk. The librarian listened to their story with wide eyes. When they finished, she wiped away a tear. "This is the most wonderful thing I have seen in forty years of work," she said. The town museum made a special exhibition: The Secret Code of the Old Library. The box, the letters, the locket, and the old coins were placed in a glass case. A local newspaper wrote about the children and their adventure. But the best part came later. The museum found out that Genevieve Bennett had left the town in 1910. She married a doctor, and her family lived in a nearby city. Her granddaughter, Margaret Bennett-Hartley, came to the opening of the exhibition. She was an old lady with silver hair and warm eyes. She hugged the children. "My grandmother always said that the library had a secret," she said. "She looked for it all her life and never found it. Now you did. Thank you." The museum discovered that the old coins were worth a lot of money. The town used the money to start the Bennett Reading Fund, which buys new books for children every year. Liam, Maya, and Sam received their own golden library cards with their names on them. "We started with a strange code," Maya said, "and we ended up writing a new chapter in the history of the library." The old library seemed brighter that day. And the portrait of Thomas Bennett, the children thought, looked almost as if he was smiling.`, ending:true},
 s12:{text:`The children chose to find the family. It was not easy. They asked Mrs. Whitaker for the library's old records. Sam's grandmother remembered that Genevieve Bennett had married a man named Hartley and moved away from the town. Maya found an old address book in the library's archive. The name Hartley appeared twice in it. The children wrote letters to both addresses and waited. A week later, an answer came. It was from Mrs. Margaret Bennett-Hartley, the granddaughter of Genevieve. She lived three towns away. On the next Saturday, she visited the library. She was a small woman with gentle eyes and a soft voice. She listened to the children's whole story, then opened the iron box with trembling hands. When she saw the locket and the diary, tears ran down her cheeks. "My grandmother told me about this box," she said. "She said that her father hid something important, but nobody ever found it. She searched this library many times when she was young. She never gave up hope." Mrs. Hartley smiled at the children. "You finished what my great-grandfather began." She opened the leather bag. There were gold coins inside. "I will donate these to the library," she said, "as Thomas wanted. And I want to give each of you something too." She gave the children three old books from her own collection. "Read them," she said, "and remember that knowledge is the greatest treasure of all." The children watched her leave, holding the locket close to her heart. They knew they had given something back to history. And the story of Thomas Bennett was finally told the way it should have been told.`, ending:true},
 s13:{text:`The children chose to keep the secret. It felt right. They returned the iron box to the garden, but not before adding their own letter to it. In the letter, they wrote about their adventure, about the code, and about the night when they found the box under the birch tree. They put the letter inside the box, locked it, and buried it again in the same place. "Someday, another child will find this," Maya said. "And they will have their own adventure." "But our code will be harder," Sam laughed. They wrote a new cipher on a small card and left it in the library, hidden inside the same old book, Tales of the Voyagers. The new code pointed to the garden and to the birch tree. "Now the library has a new legend," Liam said. The children started a small club. They called themselves the Junior Archivists. Every Saturday, they met in the library and looked for other mysteries. They looked behind paintings. They read old diaries. They learned to read old handwriting. Sometimes they found nothing at all. But sometimes they found little treasures: forgotten photographs, old tickets, dried flowers between the pages of books. And the children understood that every old thing has a story. The secret of the old library was safe. It waited for the next generation. And under the birch tree, the iron box waited too, full of coins, letters, and a promise from the year 1901.`, ending:true},
 e1:{text:`Liam put the yellow paper back inside the old book. "It's probably some old homework," he said. "That's not a code — it's a puzzle from a school project." Maya hesitated, then nodded. The three friends finished dusting the shelves and went home. Years later, during the library's 150th anniversary, workers renovating the reading room found a second envelope behind the portrait of Thomas Bennett. Inside were letters revealing a hidden family fortune. The librarians laughed and wondered who had missed the first clue so long ago. Liam, now an adult, read the article and went very quiet. Some secrets wait for the right person to open them.`, ending:true},
 e2:{text:`Instead of climbing to the reading room, the children showed the decoded message to Mrs. Whitaker. The librarian turned pale. "Thomas Bennett wrote about a portrait in his private letters," she said. "The town archives have a whole folder about him." Together they opened the archive and found a letter from Bennett describing a hidden compartment behind his portrait. With the librarian's permission, they opened it and found the envelope addressed "To the Finder of This Letter". Mrs. Whitaker declared the discovery a piece of town history and invited the newspaper. The children got their names in the paper, and the envelope went to the town archives — opened with proper care, in the light of day.`, ending:true},
 e3:{text:`Sam closed the green book. "We found the message," he said. "Now the question is whether we should be the ones to chase it." Maya agreed. "This is old library business. Let's tell Mrs. Whitaker." The librarian listened to their story about the book code and then led them to the reading room. Behind the portrait of Thomas Bennett they found the wax-sealed envelope. Mrs. Whitaker opened it in front of them, and the letters revealed the truth about the family savings. The town decided to turn the discovery into an exhibit. The children received honorary library cards, and Sam learned that some adventures are even better when you share them with the right people.`, ending:true},
 e4:{text:`Maya held the envelope out to Mrs. Whitaker. "We found this behind the portrait," she said. "We didn't open it. It says 'To the Finder', but it feels like it belongs to the library." Mrs. Whitaker's hands trembled as she broke the red wax seal. Inside were the letters about Thomas Bennett's lost savings and the key hidden in the red dictionary. The librarian gathered the town council, and together they followed the clues to the iron box under the birch tree. The letters and coins became the centrepiece of the library's new history corner. And the children understood that some doors open best when trusted adults hold the key.`, ending:true},
 e5:{text:`The children closed the iron box, locked it, and buried it again beneath the birch tree. "Some treasures are meant to stay hidden," said Maya softly. They told nobody — not even Mrs. Whitaker. But they added their own small letter to the box, describing their adventure and promising to return in ten years. And they did. On a rainy Saturday, ten years later, three grown friends knelt by the birch tree and dug up the box. Inside lay the coins, the locket, the diary — and their own letter. They donated everything to the museum that afternoon, and the museum named the exhibit "A Secret Kept for Ten Years". The iron box had waited patiently, and so had they.`, ending:true},
},

 {q:'Where did the children find the yellow paper with the code?',o:['Inside an old book in the library','Under a tree in the garden','In a letter from the mayor'],a:0},
 {q:'How did the children decode the message?',o:['By shifting the letters of the alphabet','By reading the book backwards','By using a computer program'],a:0},
 {q:'Who was Thomas Bennett?',o:['A fisherman','The man who built the library','The town baker'],a:1},
 {q:'What did the children find behind the portrait?',o:['A silver locket','A box of sweets','An envelope with old letters'],a:2},
 {q:'What was hidden in the iron box in the garden?',o:['Old coins, a locket, and a diary','A map of the town','A collection of stamps'],a:0}

emoji:'🛶',title:'The Great River Race',start:'s1',
segs:{
 s1:{text:`The town of Riverbend sat on the banks of a wide, sparkling river. Every autumn, the river held its most exciting event: the Great River Race. Boats of every size raced from the old stone bridge to Willow Island, three miles downstream. This year, the whole town was talking about two children's teams. Team Otter raced in a blue boat painted with a smiling otter. Their captain was Maya, a brave twelve-year-old girl. With her were Theo, the strongest paddler, and Zoe, a girl who noticed everything. Team Beaver raced in a red boat with a cheeky beaver on its side. Their captain was Sam, calm and clever. His paddlers were Nina, the fastest girl in town, and Leo, the smallest but the loudest. The two teams were neighbours, classmates, and best friends. But during race week, they became rivals. The parents smiled and said: "The river is big enough for everyone, but the cup is small." On Monday morning, the children walked to the bank. The water sparkled in the sun. The air smelled of wet wood and fish. Maya looked at the red boat. Sam waved at her. "Ready for another year?" he called. Maya grinned. "We are going to win that cup, Sam!" The race was in six days.`, choices:[{t:'Train for the race',n:'s2'},{t:'Scout the river',n:'s3'}]},
 s2:{text:`For five days, Team Otter worked hard. Every morning before school, they practised paddling. Every afternoon, they studied the river. Theo made new wooden paddles. He sanded them until they were smooth. Maya taught them to keep the rhythm: one, two, one, two. "Power comes from your whole body, not just your arms," she said. Zoe wrote notes about the river. She drew maps. She watched how the current moved. "The middle of the river is fast," she said. "But after rain, the water rises. There are hidden rocks near the left bank." The boys listened. They respected Zoe's sharp eyes. On Wednesday, they tested the repaired boat. Maya named it Swift Otter. It glided over the water like a skater. "We are ready," said Theo. "Almost," said Zoe. "We have not trained for the storms of fear yet." The others laughed, but they understood. The race was not only about muscles. It was about courage, quick thinking, and trust. That evening, the sky turned orange and pink. The river looked like liquid gold. The children sat on the dock and dangled their feet in the water. "Do you think we can win?" asked Theo softly. Maya squeezed his shoulder. "We can win if we race like a team. And if we are lucky." "Luck is for lazy people," said Zoe with a smile. "We will make our own luck."`, choices:[{t:'Train with Team Beaver',n:'s4'},{t:'Look for a shortcut',n:'s5'}]},
 s3:{text:`On Tuesday, the three friends walked along the southern bank. They wanted to know every tree, every rock, and every bend of the river. The water was low, so they could see the bottom in shallow places. Zoe pointed to a huge pile of logs, half a mile before Willow Island. Last winter's flood had pushed branches and whole trees into one place. The pile stretched across the river like a dark wall. "That is the logjam," said Zoe. "It grows every year. Boats must go around it." Theo squinted. "Can we paddle through it?" "No way," said Maya. "The current pushes everything into it. We would get stuck. Or worse." Suddenly, they heard voices. The red boat appeared from behind a clump of bushes. Sam, Nina, and Leo were practising too. Nina paddled so fast that the boat seemed to fly. Leo shouted happily. The boat wobbled, but Leo did not stop laughing. Maya felt a sting of jealousy. Then it passed. "Hey, Sam!" she called. "Pretty fast!" Sam smiled. "You are not bad yourself, Maya. See you at the race!" The teams waved. The two boats floated side by side for a moment. Then each went its own way. Zoe watched the red boat disappear around the bend. "They are fast," she said quietly. "But we do not have to be faster. We have to be smarter."`, choices:[{t:'Join a joint practice',n:'s4'},{t:'Talk to Team Beaver',n:'s6'}]},
 s4:{text:`On Thursday, the two teams decided to practise together. The idea came from Nina, who always looked for a good challenge. "A friendly race!" she shouted across the water. "First to the old bridge and back!" Both teams agreed. The boats lined up. Maya counted: "Three, two, one... go!" The paddles hit the water together. Swift Otter jumped forward. But Red Beaver was already beside it. Side by side, they flew. The children's lungs burned. Their arms ached. The wind whistled in their ears. Near the turning point, Theo made a small mistake. His paddle slipped, and the blue boat turned sharply. Maya corrected it quickly, but they lost three seconds. Red Beaver turned smoothly and dashed back. It finished ten seconds ahead. Leo jumped out of the boat, cheering. "Woo-hoo! We win!" Nina laughed and hugged him. Maya's face was red, but not from running. "Good race," she said honestly. Sam nodded. "You were very close, Maya. Tomorrow is the real race." The teams shook hands. On the way home, Theo was quiet. "It was my fault," he said. "I lost the rhythm." "No," said Zoe. "We learned something important. Now we know their speed. And we saw their trick at the turn." Maya smiled slowly. "She is right. A loss today is a lesson for tomorrow." That night, they improved their training plan.`, choices:[{t:'Spend the evening before the race',n:'s7'},{t:'Go straight to bed',n:'s8'}]},
 s5:{text:`On Friday afternoon, Zoe had an idea. "There is an old channel behind the beaver dam, near the east woods," she said. "Fishermen say it is shorter. It connects the bridge straight to Willow Island." The team was excited. They ran to the east woods. The channel was narrow and shadowed. Reeds grew tall on both sides. The water was black and still. They pushed the blue boat in carefully. For two hundred metres, the channel was perfect. Then they saw the problem. A fallen oak tree lay across the water. Branches reached down like long arms. Behind it, mud and leaves had built a small dam. "This is a dead end," said Theo sadly. "Not a dead end," said Zoe. "It is a message. If the main river gets blocked, this channel can save us. But only if we clear it." "Clearing this would take hours," said Maya. "We do not have hours. Tomorrow is the race." They stood silently. The sun set behind the trees. Finally, Maya spoke: "Maybe we will not use it. But we should tell the organizers about it. The main river has a logjam too. If anyone gets into trouble, this channel can be an escape route." The others agreed. It was a responsible thing to do.`, choices:[{t:'Warn the organizers and Team Beaver',n:'s7'},{t:'Stay quiet and go to bed',n:'s8'}]},
 s6:{text:`That evening, Maya walked alone to the riverbank. She wanted to calm down. Near the dock, she saw Sam. He was sitting alone too, looking at the water. For a long moment, nobody spoke. Then Sam said, "Your team is fast, Maya. I mean it." Maya blushed. "Yours is faster." "Maybe," said Sam. "But speed is not everything. My father says the river changes every year. Last year, the winner was the boat that stopped to help another boat stuck in the weeds." Maya thought about this. "People remember who helped," said Sam softly. "Long after they forget who won." Maya felt ashamed. Earlier that day, she had boasted to the whole street that Team Otter would crush the Beavers. She had not meant it cruelly, but the words sounded ugly now. "Sam," she said, "I am sorry about what I said this morning. It was rude." Sam smiled gently. "Forget it, Maya. Tomorrow, we race like friends, not enemies." They shook hands. The moon rose over the river. Both went home with lighter hearts. Zoe saw Maya's face when she returned. "What happened?" she asked. "I made peace," said Maya. "And I learned something. Winning is better when your rival is your friend."`, choices:[{t:'Go to bed early',n:'s8'},{t:'Discuss the coming storm',n:'s7'}]},
 s7:{text:`On Friday night, the weather changed. Black clouds rolled in from the mountains. The wind howled around the houses. The river turned grey and angry. Grandma Rosa, who had lived in Riverbend for eighty years, shook her head. "The river will rise tonight," she said. "Tomorrow, it will be a different river." Maya looked out of the window. Rain drummed on the roof. "The race will still happen, right?" she asked her mother. "The mayor says yes," her mother answered. "But the boats must be careful." At that moment, Sam knocked on the door. He wore a yellow raincoat. Water dripped from his hood. "Maya!" he called. "We checked our boat. The rope is loose. The storm might break it." Maya grabbed her jacket. Together, they ran to the docks. They pulled both boats onto the grass. They tied them tightly to strong posts. They covered them with tarpaulins. The children worked in the rain, laughing and shivering. "Thank you," said Sam. "If you had not told me about the weather, we could have lost our boat." "No problem," said Maya. "Friends watch out for each other." The storm raged all night. In the morning, the rain stopped. The sun rose, weak and pale. The river was high, fast, and brown. But the boats were safe.`, choices:[{t:'Race day',n:'s8'},{t:'Agree to help each other during the race',n:'s16'}]},
 s8:{text:`The morning of the race arrived. The whole town gathered on the banks. Flags fluttered. Children waved balloons. The mayor stood on a platform with a shiny silver cup. "Welcome to the forty-first Great River Race!" he shouted. "Today, sixteen boats will race to Willow Island. May the best boat win!" Swift Otter and Red Beaver lined up at the bridge. The water was wild. It swirled beneath them. The brown current carried leaves and branches quickly away. "Look at the river," whispered Zoe. "It is twice as fast as yesterday." Theo gulped. Maya gripped her paddle. "Stay near the middle," she said. "Avoid the hidden rocks near the left bank. And whatever happens, do not panic." The mayor raised a starting pistol. The crowd fell silent. Only the river spoke, rushing past the boats. "Racers!" cried the mayor. "Get ready!" The children leaned forward. Everything around them disappeared. There was only the water, the boat, and the sound of their hearts. BANG! The pistol fired. Sixteen boats exploded forward. Spray flew into the air. The crowd roared. The Great River Race had begun.`, choices:[{t:'Take the middle of the river',n:'s12'},{t:'Follow the shore',n:'s13'}]},
 s12:{text:`Team Otter chose the middle of the river, where the current was strongest. They flew past two kayaks and a dancing sailboat. "Yes!" shouted Theo. "We are in second place!" But the river changed quickly. Dark clouds appeared again, rolling in from the west. The wind rose. Big drops of rain began to fall. Within minutes, it became a real storm. Waves slapped against the boat. The children were soaked. Their hands slipped on the paddles. "Keep going!" yelled Maya above the wind. "We can do this!" But then Zoe screamed: "Look ahead!" The logjam loomed in front of them. During the night, the pile of logs had grown. New branches and whole trees now blocked half the river. The water crashed against the wall of wood. It roared like a monster. "We cannot get through that!" shouted Theo. "We must turn!" But the current was too strong. Turning was impossible. The boat rushed straight towards the jam. "Hold tight!" cried Maya. Swift Otter hit the logs with a horrible crack. The boat stopped suddenly. Maya, Theo, and Zoe flew forward and landed in a heap. Around them, water poured through the gaps. Red Beaver fought the roaring waves a little further away. Sam shouted something, but the wind stole his words. There was no time to think. In front of them stood the terrible wall of logs. Maya breathed deeply. They had to decide now.`, choices:[{t:'Stop and help clear the jam',n:'s16'},{t:'Try to climb over the jam',n:'s15'}]},
 s13:{text:`Team Otter chose the path near the shore. It was safer, but slower. The wind was softer there. The water was calmer. The children paddled steadily. "We may be slower," said Zoe, "but we will not sink." Then the storm came anyway. Rain fell in silver sheets. The shore path began to fill with branches and rubbish. Still, the blue boat moved forward. Soon they saw the great logjam. Even from the shore, they could hear the roar of the trapped water. And then they saw the red boat. Red Beaver had tried to squeeze between two giant logs. Now it was completely stuck. The wood pressed against its sides like giant hands. Leo was crying. Sam was pulling at a branch. Nina leaned over the side, trying to push a log away. "Help!" Sam shouted when he saw them. "Please! The boat is cracking!" Maya looked at her team. The finish line was not far. The jam was about two hundred metres wide. If they stopped, they could lose the race. If they did not stop, the Beavers might sink. Zoe read Maya's mind. "Maya," she said quietly, "remember what Sam told you. People remember who helped."`, choices:[{t:'Stop and help',n:'s16'},{t:'Continue the race alone',n:'s18'}]},
 s15:{text:`Maya made a quick decision. "We cannot leave them!" she shouted. Swift Otter turned towards the jam. But the current was violent. Before they could reach the red boat, a huge branch swept under their boat. The blue boat tilted dangerously. Theo shouted, but it was too late. Swift Otter tipped over. The cold, brown water swallowed them. Maya went under. She felt the world spin. She opened her eyes, but saw only darkness and bubbles. She kicked and pushed. Her head broke the surface. She gasped for air. Theo appeared beside her, coughing and grabbing a log. Where was Zoe? Maya panicked. Then she saw Zoe. Zoe was clinging to an overhanging branch, safe but shaking. "Are you okay?" Maya shouted. "Yes!" called Zoe. "But we have no boat!" The blue boat floated upside down, half caught in the branches. The race seemed over for them. But at that moment, Red Beaver came sliding carefully towards them. Sam threw a rope. "Grab it!" he shouted. "We will pull you in!" They did. The red boat held all six children. It was crowded, but safe. Maya looked at the water. The finish line was still far away. "We can still finish," she said quietly. "How?" asked Leo. "Our boat is broken." The children looked at each other. One thing was certain: they would decide together.`, choices:[{t:'Stay and fix the boat together',n:'s16'},{t:'Move to the red boat and sail together',n:'s18'}]},
 s16:{text:`When the race began, the sky was still grey. The wind rose again, and the river turned angry. By the time the two teams reached the logjam, the storm was roaring around them. Neither team could pass alone. So they worked as one. First, they pulled the damaged boat to the shore. Theo and Sam checked the hull. It had a crack, but it was not too bad. They found dry wood and ropes in their bags. They patched the hole. Zoe and Nina pushed the heaviest logs out of the channel. Slowly, water began to flow through the opening. "Push!" shouted Maya. The children pulled together. The jam broke with a loud crack. The river rushed through, free and joyful. The children cheered. Then they looked at the sky. The storm was passing. The sun broke through the clouds. "The race is still on," said Sam. "We can still reach Willow Island." Everyone looked at the two boats. One was fixed and ready. The other waited patiently. "We have a choice," said Maya. "We can race to the finish. Or we can go together." The children smiled. The river glittered in the new sunlight, and the two boats set off for the final stretch.`, choices:[{t:'Row to the finish together',n:'s19'},{t:'Have an honest sprint',n:'s20'}]},
 s18:{text:`The finish line was close. So close that they could see the flag. But the last part of the river was full of boats that had slowed down in the storm. A raft drifted in front of them. Before anyone could steer away, the boat bumped into it. Paddles flew into the air. Children laughed and grabbed at them. Boats tangled together. The crowd gasped. And through the middle of the mess, a tiny green canoe slipped past everyone. It was Toby, the mail boy. He delivered letters every day, and he had been floating down the river with his bag of mail. He had not even known there was a race. He crossed the line first and looked around in surprise. "The winner," the mayor announced, shaking his head happily, "is Toby and his mail canoe!" The children stared at each other. Then they howled with laughter. They clapped for Toby. "I always deliver," said Toby with a grin. Later, at the celebration, Maya smiled. "We raced and raced," she said. "And the winner is the boy who was not even racing." The whole town laughed together. Sometimes, the river decides the winner itself. And sometimes, delivering the mail is enough.`, ending:true},
 s19:{text:`The two boats crossed the finish line together. Side by side, they cut through the last metres of water. The crowd on the shore went wild. People jumped and waved. The mayor looked at the two boats and laughed. "I have never seen this in forty-one years!" he said. "Two winners!" The children climbed out and hugged each other. Maya and Sam shook hands. "We did it," said Maya. "We really did it." "The trophy is yours too," said Sam. "No," said Maya. "It belongs to both of us." The mayor placed the silver cup between the two boats. "This year," he announced, "the cup stays with the river. With the teams that helped each other." The sun set over Riverbend. On the riverbank, six children sat together, eating ice cream and talking about the race. They had not won alone. But they had won together. And that, they decided, was the best victory of all.`, ending:true},
 s20:{text:`The two boats lined up once more. "One final sprint," said Sam. "To the island. Fair and square." Maya nodded. "Fair and square." The children dug their paddles into the water. The boats flew over the sparkling river. The crowd roared. For a long moment, the boats were perfectly side by side. Then Maya found one last reserve of strength. She pulled harder. Swift Otter edged forward, half a boat ahead. The line came closer, closer... and crossed! The blue boat crossed first. The crowd exploded. Team Otter had won! Maya collapsed forward, breathing hard. The Beavers paddled up and smiled. "You did it, Maya," said Sam. "And you raced honestly. That is what makes a true champion." The mayor gave the silver cup to Team Otter. But Maya lifted it high and said, "This cup belongs to everyone who helped today. We won because we raced like friends." The children cheered. The river sparkled. And in Riverbend, people told the story of the Great River Race for many years: the year the winners were brave, honest, and, yes, a little bit lucky.`, ending:true},
},
quiz:[
 {q:'Where does the Great River Race start?',o:['At the old stone bridge','At Willow Island','At the lake'],a:0},
 {q:'Who was the captain of Team Otter?',o:['Sam','Maya','Leo'],a:1},
 {q:'What blocked the middle of the river during the race?',o:['A logjam of trees and branches','A stone wall','A broken bridge'],a:0},
 {q:'What did the two teams decide to do when someone was in trouble?',o:['Help each other','Race faster','Go home'],a:0},
 {q:'What was the name of the blue boat?',o:['Swift Otter','Red Beaver','Green Turtle'],a:0}
]

emoji:'🤖',title:'The Robot Who Wanted to Dance',start:'s1',
segs:{
 s1:{text:`Bolt was a robot. He worked in the workshop at Green Hill School. Every morning, he opened the big door before the children arrived. He helped the teacher carry heavy boxes. He fixed broken chairs and shelves. The children liked Bolt very much. Bolt had been at the school for three years. He knew every classroom and every corner of the building. When a bulb went out, he changed it. When a desk wobbled, he fixed it. His eyes were two soft blue lights. His voice was friendly and calm. He never complained, even when a shelf fell on him.

One rainy Tuesday, Emma stayed after lessons to finish a poster for the school wall. Suddenly, she heard a strange sound from the workshop. It sounded like somebody moving and counting quietly. Emma pushed the door open. Bolt was standing in the middle of the room. He was turning around slowly. He lifted one foot, then the other. "One, two, three," his voice said softly. "One, two, three."

"Bolt!" Emma said. "What are you doing?"

Bolt stopped at once. His blue eyes blinked. "I am trying to dance," he said. "Do robots dance?" asked Emma. "I do not know," said Bolt. "But I want to learn. At the spring festival, I watched the children dance. They looked so happy. Their faces shone. I want to know how that feels." Emma smiled. "Then we will help you," she said.`,
  choices:[{t:'Help him learn to dance',n:'s2'},{t:'First ask why he wants to dance',n:'s3'}]},
 s2:{text:`The next day, Emma told her friends Tom and Mia about Bolt. "A robot that wants to dance?" Tom laughed. "That's the best thing I have heard all year." Mia nodded. "We have to help him."

After classes, the three friends went to the workshop. Bolt stood waiting near the table. "Today you start your first lesson," said Emma. She put her phone on the table and played a simple song. "Now, do what I do." Emma moved her arms and stepped left and right. Bolt watched carefully. Then he tried. His arms moved like metal doors. His feet hit the floor hard. Clank! Clank! He walked like a big tin soldier. Tom laughed, but not in a bad way. "You look like a fridge doing gymnastics," he said.

Bolt's lights grew dim. "I am not good at this," he said. "That's okay," said Mia. "Nobody dances well on the first day. Even humans fall at the beginning." Bolt tried again. This time, his foot got stuck on a box, and he fell with a loud crash. The children rushed to help him up. Bolt sat on the floor and looked at his hands. "Are you sure a robot can learn this?" he asked. "Yes," said Emma. "We just need a plan. Machines are made of programs. We will make you a new program for dancing."`,
  choices:[{t:'Write a new dance program',n:'s4'},{t:'Train him the old way, without programs',n:'s5'}]},
 s3:{text:`But Tom was not sure they understood Bolt's dream. "Tell us the truth, Bolt," he said. "Why do you really want to dance? Is it only because you saw it?" Bolt was silent for a moment. Then his voice became softer. "I will tell you," he said. "Every Friday, the dance class uses the hall next to my workshop. Through the window, I watch them. There is a girl with a red ribbon in her hair. She dances in the corner alone. Sometimes she makes mistakes. But she laughs every time. She is never angry at herself."

Bolt looked down. "Once, it was raining, and she danced outside under the roof. She twirled and water fell from her coat. She laughed and laughed. I wanted to laugh too. My programs know math and fixing. They do not know laughter. But I think, if I could dance, maybe I could laugh as well."

The children were quiet. Tom rubbed his eyes. "Okay," he said finally. "That is the most important reason I have ever heard. Let's do it." From that day, the workshop became a dance studio after school. The children made a plan. Emma would teach the steps. Mia would choose the music. Tom would write the program. Bolt would try his best.`,
  choices:[{t:'Start training',n:'s5'},{t:'Ask the teacher first',n:'s6'}]},
 s4:{text:`Tom knew computers better than anyone in the class. He opened his laptop and connected it to Bolt with a long cable. On the screen, lines of code appeared. "This is Bolt's movement program," Tom explained. "I will add a new part. A dance part." For two evenings, Tom wrote the program. Emma and Mia tested Bolt's knees and arms. Finally, Tom finished. "Ready?" he asked. Bolt nodded. Tom pressed Enter.

For a second, nothing happened. Then Bolt suddenly started to spin. Faster and faster. His arms flew up like helicopter blades. He spun across the room and hit the shelf of paint cans. Crash! Red and blue paint poured onto the floor. Bolt stopped and stood shaking. "That was NOT dancing," he said. The children stared at the mess. "Okay," said Tom. "There is a bug in my program. The speed line is wrong. Also, I put the arm move before the step move. That's why he flew." He looked at the fallen cans. "Sorry about the paint."

Bolt felt bad. "Maybe I should just be a fixing robot again," he said. "No," said Emma firmly. "We fix programs the same way we fix chairs. We try again." They cleaned the floor. Then they faced a choice: fix the program until it works, or forget the computer and train slowly by eye.`,
  choices:[{t:'Fix the bug in the program',n:'s7'},{t:'Go back to simple training',n:'s5'}]},
 s5:{text:`They chose to train slowly, and it was harder than they expected. Every day after school, the children came to the workshop. Emma counted: "One, two, three, four." Bolt tried to follow. He learned to shift his weight from foot to foot. He learned to bend his knees. But he still fell. He fell twenty times in one week. He fell into boxes. He fell over a bench. Once, he fell out of the open window into a flower bed. Mrs. Green, the gardener, was not pleased. "My flowers!" she shouted. Bolt apologized in his calm voice, covered in dirt.

But the children never laughed at him when he fell. Mia brought a little mirror so Bolt could watch his own legs. Tom drew footprints on the floor with chalk. Step by step, Bolt learned where to put his feet. They picked him up and said, "Again!" After two weeks, something changed. Bolt could walk a whole dance step without falling. Mia put on music, and Bolt moved his arms in a smooth wave. "He's getting it!" Tom shouted. Bolt's eyes glowed brighter than ever. "This is nice," he said. "My motors feel warm. Is that happiness?" "Yes, Bolt," said Emma. "That's happiness."

Then the school announced the City Robotics Fair. There would be a talent show for robots. Every school could enter one robot. Tom's eyes lit up. "Bolt could win!" he said. But Mia worried. "Are we ready for a stage?" she asked. "We have only one month." There was another question, too. Would the teachers allow it?`,
  choices:[{t:'Sign up for the contest',n:'s8'},{t:'Ask the teacher for permission',n:'s6'}]},
 s6:{text:`The children decided to ask Mr. Okafor, the head teacher. Mr. Okafor was tall and kind, but he believed machines were for work. They found him in his office, grading papers. "Mr. Okafor," said Emma. "Can Bolt perform in the talent show at the fair?" Mr. Okafor put down his pen. "A robot in a talent show?" he said. "Bolt is a school helper. He opens doors, carries boxes, fixes things. That is what he is for. Dancing is for children, not for machines." "But Bolt wants to dance," said Tom. "He practiced for weeks." Mr. Okafor shook his head. "Machines do not want things. They follow programs. You are good children, but do not waste time on this. Focus on your studies."

The children walked out slowly. Emma felt angry. "He thinks Bolt is just a toaster with legs," she said. "He did not even see him dance." Mia thought. "Maybe we should not give up. But maybe we should not fight either. We can keep training in secret." Tom nodded. "If they see Bolt dance well, they will change their minds." Or maybe they should try to convince Mr. Okafor properly, with proof.`,
  choices:[{t:'Convince the teacher by showing him the dance',n:'s10'},{t:'Train in secret from the adults',n:'s9'}]},
 s7:{text:`Tom could not stop thinking about the broken program. "Training is good," he said, "but the program can make Bolt's body remember the moves forever. Let me fix it." So they returned to the laptop. Tom found the bug. Two lines of the code were swapped, and the speed number was ten times too high. "Here," he said. "The speed must be one, not ten. And the step command must come before the arm command." He changed the lines and pressed Enter again.

This time, Bolt rose slowly. He stepped left, stepped right, and raised his arms in a gentle circle. Then he turned. The movement was almost human. The children held their breath. Bolt finished with a small bow. "Was that good?" he asked. The children cheered. "Bolt, you're a dancer!" shouted Mia. Bolt's blue eyes sparkled. For the first time, his voice had something new in it. It was not just calm. It was proud. "Then let us go to the fair," he said.

Tom typed quickly. "I will send the entry form now. The contest is in three weeks." Emma looked at Bolt. "Are you sure you want a stage?" "I want to dance where people can see," said Bolt. "I want them to feel happy too."`,
  choices:[{t:'Sign up for the contest',n:'s8'},{t:'Dance just for fun',n:'s11'}]},
 s8:{text:`The day of the City Robotics Fair came. The hall was huge. Robots from ten schools stood in rows. Some shone like silver. Some were small and round. But none of them moved like Bolt when the music played. There were robots that played chess, robots that painted pictures, and robots that vacuumed floors. Bolt stood near the stage, holding hands with Emma, Tom, and Mia. Inside, his fans whirred faster than usual. "Am I nervous?" he asked. "I think I am nervous. Can robots be nervous?" "Yes," said Mia. "You are feeling something real. That means you are ready."

Their turn came. The announcer called: "And now, Bolt from Green Hill School!" Bolt walked onto the stage. The music started. He began to dance. The crowd gasped. The mechanical boy moved as smoothly as a leaf in the wind. He spun. He stepped. He bowed. Then, in the middle of the dance, something terrible happened. Bolt's left knee made a grinding sound. He stopped. The music played on, but Bolt could not move. "My motor is stuck," he whispered into the microphone. The hall became silent. Hundreds of eyes looked at the frozen robot. Emma ran to the stage. "Bolt!" she cried. "Hold on!" The children had only seconds to decide what to do.`,
  choices:[{t:'Fix the mechanism right on stage',n:'s12'},{t:'Help him finish the dance without music',n:'s13'}]},
 s9:{text:`In those quiet weeks, while the others planned, Bolt kept helping. He carried books, opened windows, and fixed the football goal. But every evening, in the empty workshop, the children played music, and Bolt danced in secret. They did not tell anyone. Mr. Okafor sometimes passed by and heard sounds, but he did not come in.

At the fair, the school had a stand where Bolt helped greet visitors. He gave out flyers. He showed how small repairs worked. The children were proud of him. But near the stand, there was an open-air stage. Anyone could go up and perform. A little girl sang. A boy played the guitar. Bolt watched them with longing in his blue eyes. "Do you want to go up there?" asked Emma softly. Bolt looked at the stage, then at the children. "I do," he said. "But what if I fail in front of everyone?" "Then we will clap anyway," said Tom. "Because you tried." Standing under the bright sky, Bolt decided what to do. To perform on the open stage, or to stay at the stand, safe and useful.`,
  choices:[{t:'Perform on the open-air stage',n:'s14'},{t:'Stay a helper',n:'s15'}]},
 s10:{text:`Emma asked Mr. Okafor to come to the workshop, just once. "Please," she said. "See for yourself." Mr. Okafor sighed but agreed. That afternoon, Bolt danced for him. He was not perfect. He stumbled twice. But the way he moved, the way his eyes glowed, made Mr. Okafor open his mouth in surprise. "He has rhythm," he said. "A machine with rhythm." Then Bolt did something more. He walked to the corner and returned with a picture that had fallen from the wall. He fixed its hook in ten seconds. "See?" said Tom. "He is still a helper. But he is also a dancer." Mr. Okafor was quiet for a long time. Finally, he smiled. "A robot that makes people smile," he said. "That is useful too. I will sign the school's entry for the fair myself." The children hugged each other. Bolt's fans hummed with joy. Now they had three weeks to prepare. And the head teacher himself promised to come and watch.`,
  choices:[{t:'Prepare for the fair contest',n:'s8'},{t:'Arrange a school concert',n:'s14'}]},
 s11:{text:`In the end, they did not need a contest. The week before the fair, the school held a small evening concert for parents. Mr. Okafor asked Bolt to dance there. The workshop lights were dim. Families sat on chairs. Bolt danced in the middle, and the music was soft. He made a mistake in the middle, and instead of being angry, he laughed. It was a strange, mechanical sound, but it was a laugh. The children laughed too, and the parents clapped. After the dance, nobody talked about winners. Everyone talked about how happy the robot looked.

Bolt stood by the window, looking at the stars. "Do you still want to go to the fair?" asked Emma. "No," said Bolt. "I wanted to dance so people would feel happy. Tonight, they were happy. I am happy. That is enough." From that day, Bolt was not only the school helper. He was their friend. And every Friday, the workshop filled with music, laughter, and the sound of a dancing robot.`,
  ending:true},
 s12:{text:`On the stage, Emma did not panic. "Tom, the toolkit!" she shouted. Tom threw the metal box. Emma opened Bolt's knee panel. Inside, a small gear was stuck. She pulled it out and put in a spare one from the box. "Bolt, try now!" Bolt's motor hummed. The music had ended, but the announcer smiled and started it again from the middle. Bolt stood up. He finished his dance perfectly. He spun once more and ended with a deep bow. The hall exploded with applause. People stood up. Some children screamed with joy.

Bolt received the Audience Prize, a small golden medal. But the best moment came later, when Bolt danced with Emma on the floor of the hall while the band played. Mr. Okafor clapped the loudest of all. "Well," he said, "machines can do wonderful things." And Bolt, the robot who wanted to dance, performed for everyone who wished to see.`,
  ending:true},
 s13:{text:`Tom had no toolkit on the stage. But Mia had another idea. She climbed on the stage and began to clap the rhythm of the song with her hands. The crowd joined one by one. Clap, clap, clap. Soon the whole hall clapped. Bolt listened with his sensors. Slowly, he raised his arms. He moved his good leg, then dragged the other, turning in a circle. It was not the program. It was the dance of a robot who refused to give up. The clapping became a heartbeat. Bolt danced to it, slowly and beautifully, until the song ended. The silence lasted one second. Then the applause was like thunder.

Bolt was not first in the contest, but the judges gave him a special prize for spirit. On the way home, Bolt said, "When the music stopped, I found another music. It was inside all of you." Emma wiped her eyes. "You danced without a program," she said. "That means you have your own music now."`,
  ending:true},
 s14:{text:`Bolt chose the open-air stage. He walked up, not with a program, but with the steps he had learned by heart. The children stood in the first row. Mia played the music on her phone, loudly. Bolt danced. People gathered from all sides. Food sellers stopped selling. A dog sat down to watch. When Bolt finished, the crowd cheered, and someone shouted, "Encore!" Bolt danced again.

Later, the organizer of the city festival came to their stand. "Your robot is wonderful," she said. "Would he like to open the big city festival next month?" Emma looked at Bolt. Bolt nodded, his eyes glowing. The news traveled fast. The local newspaper wrote about the dancing robot from Green Hill School. But Bolt remained the same. In the morning, he opened doors and fixed chairs. In the evening, he danced in the workshop with his friends. And Mr. Okafor hung the newspaper article on the school wall, with a red frame around it.`,
  ending:true},
 s15:{text:`Bolt looked at the open stage for a long time. Then he turned away. "No," he said. "I am a helper. That is what I am made for. I will not dance in front of hundreds of people. It is not my place." The children were surprised. "But you trained so hard," said Emma. "I know," said Bolt. "And I will keep dancing. With you. Here, in the workshop, in the evenings. Not for a crowd. For joy."

And so it was. Bolt stayed the school helper. He opened doors, carried boxes, and fixed things. But every evening, the workshop filled with music, and Bolt danced with Emma, Tom, and Mia. They invented silly dances. They laughed. Bolt never went to the fair. But he laughed every Friday, and that was more than any program could give him. He was the helper of the school and the friend of the children, and his dance was for them alone.`,
  ending:true},
},
